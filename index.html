  function drawRadar(S) {
    const p = S.player, R = 74, cx = W - R - 20, cy = H - R - 20, range = 2200;
    sctx.fillStyle = 'rgba(7,12,20,0.7)';
    sctx.beginPath(); sctx.arc(cx, cy, R, 0, TAU); sctx.fill();
    sctx.strokeStyle = 'rgba(110,140,170,0.35)';
    sctx.beginPath(); sctx.arc(cx, cy, R, 0, TAU); sctx.stroke();
    sctx.strokeStyle = 'rgba(110,140,170,0.15)';
    sctx.beginPath(); sctx.arc(cx, cy, R * 0.5, 0, TAU); sctx.stroke();
    // radar sweep
    const swa = (performance.now() / 900) % TAU;
    const sg = sctx.createConicGradient ? null : null;
    sctx.strokeStyle = 'rgba(120,200,170,0.25)';
    sctx.beginPath(); sctx.moveTo(cx, cy);
    sctx.lineTo(cx + Math.cos(swa) * R, cy + Math.sin(swa) * R); sctx.stroke();
    const put = (wx, wy) => {
      const dx = (wx - p.x) / range * R, dy = (wy - p.y) / range * R;
      const d = Math.hypot(dx, dy);
      const k = d > R - 4 ? (R - 4) / d : 1;
      return [cx + dx * k, cy + dy * k];
    };
    for (const s of S.ships) {
      if (!s.alive || s.faction !== 'hostile') continue;
      const [bx, by] = put(s.x, s.y);
      sctx.fillStyle = s.id === S.lockTargetId ? '#ffdf80' : s.cls === 'hlogi' ? '#8be0a8' : '#ff6a5a';
      if (s.cls === 'cruiser') sctx.fillRect(bx - 3, by - 3, 6, 6);
      else { sctx.beginPath(); sctx.arc(bx, by, 2.4, 0, TAU); sctx.fill(); }
    }
    for (const s of S.ships) {
      if (!s.alive || !s.wing) continue;
      const [bx, by] = put(s.x, s.y);
      sctx.fillStyle = '#7fb8ff';
      sctx.fillRect(bx - 1.5, by - 1.5, 3, 3);
    }
    for (const pr of S.projectiles) {
      if (pr.kind !== 'torp') continue;
      if (Math.floor(performance.now() / 160) % 2 === 0) continue;
      const [bx, by] = put(pr.x, pr.y);
      sctx.fillStyle = '#ffb35a';
      sctx.fillRect(bx - 1.5, by - 1.5, 3, 3);
    }
    for (const pk of S.pickups || []) {
      const [bx, by] = put(pk.x, pk.y);
      sctx.fillStyle = '#b8ff9a';
      sctx.fillRect(bx - 1, by - 1, 2, 2);
    }
    sctx.fillStyle = '#bfe0ff';
    sctx.beginPath(); sctx.arc(cx, cy, 3, 0, TAU); sctx.fill();
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > 20) {
      const a = Math.atan2(p.vy, p.vx);
      sctx.strokeStyle = 'rgba(190,225,255,0.7)';
      sctx.beginPath(); sctx.moveTo(cx, cy);
      sctx.lineTo(cx + Math.cos(a) * 10, cy + Math.sin(a) * 10); sctx.stroke();
    }
  }

  function drawLockUI(S, lerp) {
    const tgt = S.ships.find(s => s.id === S.lockTargetId && s.alive);
    if (!tgt) return;
    const x = w2sx(tgt.px + (tgt.x - tgt.px) * lerp);
    const y = w2sy(tgt.py + (tgt.y - tgt.py) * lerp);
    const r = Math.max(16, tgt.radius * scale * 2.4);
    if (!S.locked) {
      sctx.strokeStyle = 'rgba(240,200,90,0.85)'; sctx.lineWidth = 1.5;
      sctx.setLineDash([6, 5]);
      sctx.lineDashOffset = -performance.now() / 22;
      sctx.beginPath(); sctx.arc(x, y, r + 6, 0, TAU); sctx.stroke();
      sctx.setLineDash([]);
      sctx.beginPath();
      sctx.arc(x, y, r + 12, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(S.lockProgress / S.lockNeed, 0, 1));
      sctx.stroke();
    } else {
      const pulse = 1 + lockPulse * 0.8;
      sctx.strokeStyle = 'rgba(235,85,70,' + (0.9 - lockPulse * 0.3).toFixed(2) + ')';
      sctx.lineWidth = 1.8;
      const rr2 = r * pulse, c = rr2 * 0.45;
      for (const [sx2, sy2] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        sctx.beginPath();
        sctx.moveTo(x + sx2 * rr2, y + sy2 * rr2 - sy2 * c);
        sctx.lineTo(x + sx2 * rr2, y + sy2 * rr2);
        sctx.lineTo(x + sx2 * rr2 - sx2 * c, y + sy2 * rr2);
        sctx.stroke();
      }
    }
    sctx.lineWidth = 1;
  }

  function drawOffscreen(S) {
    const p = S.player;
    for (const s of S.ships) {
      if (!s.alive || s.faction !== 'hostile') continue;
      const sx = w2sx(s.x), sy = w2sy(s.y);
      if (sx > -20 && sx < W + 20 && sy > -20 && sy < H + 20) continue;
      const ang = Math.atan2(s.y - p.y, s.x - p.x);
      const m = 30;
      const ax = clamp(sx, m, W - m), ay = clamp(sy, m, H - m);
      sctx.save(); sctx.translate(ax, ay); sctx.rotate(ang);
      sctx.fillStyle = s.cls === 'cruiser' ? 'rgba(255,90,80,0.9)' : 'rgba(220,110,100,0.7)';
      sctx.beginPath(); sctx.moveTo(10, 0); sctx.lineTo(-6, 6); sctx.lineTo(-6, -6);
      sctx.closePath(); sctx.fill();
      sctx.restore();
    }
  }

  function fmtTime(t) {
    const m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  /* ---------------- keycaps, control cards, tutorial ---------------- */
  function roundRectPath(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function drawKey(x, y, label, w) {
    const h = 24;
    w = w || Math.max(26, 14 + label.length * 8);
    roundRectPath(sctx, x, y, w, h, 5);
    sctx.fillStyle = '#18222f'; sctx.fill();
    sctx.strokeStyle = '#5d7a99'; sctx.lineWidth = 1.2; sctx.stroke();
    sctx.lineWidth = 1;
    sctx.fillStyle = '#cfe0f0'; sctx.font = 'bold 11px Consolas,monospace';
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(label, x + w / 2, y + h / 2 + 1);
    sctx.textBaseline = 'alphabetic';
    return w;
  }
  // a centered line mixing text and {key:'W'} keycaps
  function drawSegments(cx, cy, segs) {
    sctx.font = '13px Consolas,monospace';
    let total = 0;
    const widths = segs.map(s => {
      if (typeof s === 'string') { const w = sctx.measureText(s).width; total += w; return w; }
      const w = Math.max(26, 14 + s.key.length * 8); total += w + 8; return w;
    });
    let x = cx - total / 2;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (typeof s === 'string') {
        sctx.fillStyle = '#d7e3ef'; sctx.font = '13px Consolas,monospace';
        sctx.textAlign = 'left';
        sctx.fillText(s, x, cy + 4);
        x += widths[i];
      } else {
        drawKey(x + 4, cy - 12, s.key, widths[i]);
        x += widths[i] + 8;
      }
    }
  }

  function drawControlCards(topY) {
    const cw = 340, ch = 352, gap = 24;
    const twoCol = W > cw * 2 + gap + 40;
    const x1 = twoCol ? W / 2 - cw - gap / 2 : W / 2 - cw / 2;
    const x2 = twoCol ? W / 2 + gap / 2 : x1;
    const y2 = twoCol ? topY : topY + ch + 16;

    const card = (x, y, title) => {
      sctx.fillStyle = 'rgba(7,12,20,0.82)';
      roundRectPath(sctx, x, y, cw, ch, 10); sctx.fill();
      sctx.strokeStyle = 'rgba(110,150,190,0.4)'; sctx.stroke();
      sctx.fillStyle = '#9fc0dd'; sctx.font = 'bold 13px Consolas,monospace'; sctx.textAlign = 'left';
      sctx.fillText(title, x + 16, y + 24);
    };

    card(x1, topY, 'CONTROLS');
    drawKey(x1 + 46, topY + 38, 'W');
    drawKey(x1 + 16, topY + 66, 'A');
    drawKey(x1 + 46, topY + 66, 'S');
    drawKey(x1 + 76, topY + 66, 'D');
    sctx.fillStyle = '#cfe0f0'; sctx.font = '12px Consolas,monospace'; sctx.textAlign = 'left';
    sctx.fillText('Thrust — you keep inertia', x1 + 120, topY + 60);
    const row = (y, key, txt) => {
      drawKey(x1 + 16, y, key);
      sctx.fillStyle = '#cfe0f0'; sctx.font = '12px Consolas,monospace'; sctx.textAlign = 'left';
      sctx.fillText(txt, x1 + 120, y + 16);
    };
    row(topY + 100, 'Shift', 'Afterburner (drains capacitor)');
    row(topY + 128, 'Tab', 'Lock next hostile');
    row(topY + 156, 'Click', 'Lock the ship you click');
    row(topY + 184, 'Space', 'Wave Motion Gun (hold)');
    row(topY + 212, 'F', 'Fire missile at locked target');
    row(topY + 240, '1-4', 'Fleet orders — focus/defend/free/regroup');
    row(topY + 268, 'G', 'OVERHEAT — burn hull for speed + rate of fire');
    row(topY + 296, 'P', 'Pause   ·   R restarts');

    card(x2, y2, 'HOW TO WIN');
    const lines = [
      ['1.', 'You are the FC. Your fleet shoots', 'whatever target YOU lock. Call it.'],
      ['2.', 'Damage order: SHIELD → ARMOR → HULL.', 'Only your shield regenerates.'],
      ['3.', 'SPEED IS ARMOR — fast sideways motion', 'makes enemy turrets miss you.'],
      ['4.', 'Enemy MENDERS repair their fleet.', 'Always primary the logistics first.'],
      ['5.', 'Full capacitor? HOLD SPACE to charge', 'the WAVE MOTION GUN. It erases the lane.'],
      ['6.', 'Survive 3 waves. Kill the cruiser', 'SANGUINE VESPER to secure the site.']
    ];
    let yy = y2 + 48;
    for (const [n, a, b] of lines) {
      sctx.fillStyle = '#f0c85a'; sctx.font = 'bold 12px Consolas,monospace'; sctx.textAlign = 'left';
      sctx.fillText(n, x2 + 16, yy);
      sctx.fillStyle = '#cfe0f0'; sctx.font = '12px Consolas,monospace';
      sctx.fillText(a, x2 + 38, yy);
      sctx.fillText(b, x2 + 38, yy + 16);
      yy += 42;
    }
    return (twoCol ? topY + ch : y2 + ch);
  }

  const tut = { step: 0, hold: 0, wait: 0, done: false };
  function drawTutorial(S, dtF) {
    if (tut.done || S.mode !== 'play' || S.paused) return;
    if (S.wave > 1) { tut.done = true; return; }
    const p = S.player;
    let segs = null;
    switch (tut.step) {
      case 0:
        segs = ['Hold ', { key: 'W' }, { key: 'A' }, { key: 'S' }, { key: 'D' }, ' to thrust — your ship drifts with inertia'];
        if (Math.hypot(p.vx, p.vy) > 110) { tut.hold += dtF; if (tut.hold > 0.7) tut.step = 1; }
        break;
      case 1:
        segs = ['Press ', { key: 'Tab' }, ' or click a red ship to start a target lock'];
        if (S.lockTargetId != null) tut.step = 2;
        break;
      case 2:
        segs = ['Locking… once locked, your turrets fire BY THEMSELVES inside 520 m'];
        if (S.stats.shots > 0) tut.step = 3;
        break;
      case 3:
        segs = ['Hold ', { key: 'Shift' }, ' to afterburn — it drains the gold capacitor ring'];
        if (S.abOn) tut.step = 4;
        break;
      case 4:
        segs = ['Perfect. Full cap + hold ', { key: 'Space' }, ' = WAVE MOTION GUN. o7'];
        tut.wait += dtF;
        if (tut.wait > 4) tut.done = true;
        break;
    }
    if (!segs) return;
    const cy = H - 205;
    sctx.globalAlpha = 0.94;
    sctx.fillStyle = 'rgba(7,12,20,0.78)';
    roundRectPath(sctx, W / 2 - 300, cy - 24, 600, 48, 8);
    sctx.fill();
    sctx.strokeStyle = 'rgba(120,180,255,' + (0.35 + 0.25 * Math.sin(performance.now() / 300)).toFixed(2) + ')';
    sctx.stroke();
    drawSegments(W / 2, cy, segs);
    sctx.globalAlpha = 1;

    // gauge legend while learning
    const gx = W / 2 - 78, gy = H - 96;
    sctx.font = '10px Consolas,monospace'; sctx.textAlign = 'right';
    const leg = (dy, col, txt) => { sctx.fillStyle = col; sctx.fillText(txt, gx, gy + dy); };
    leg(-40, 'rgba(95,170,255,0.95)', 'outer arc — SHIELD (regens)');
    leg(-24, 'rgba(235,180,90,0.95)', 'mid arc — ARMOR');
    leg(-8, 'rgba(240,95,80,0.95)', 'inner arc — HULL');
    leg(8, 'rgba(255,215,120,0.95)', 'gold ring — CAPACITOR');
    sctx.textAlign = 'left';
  }

  function overlay(S) {
    if (S.mode === 'intro') {
      sctx.fillStyle = 'rgba(2,4,9,0.55)'; sctx.fillRect(0, 0, W, H);
      const ty = Math.max(84, H * 0.14);
      sctx.textAlign = 'center';
      sctx.save();
      sctx.shadowColor = 'rgba(100,180,255,0.9)'; sctx.shadowBlur = 34;
      sctx.fillStyle = '#eaf2fa'; sctx.font = 'bold 52px Consolas,monospace';
      sctx.fillText('CARBON SKIRMISH', W / 2, ty);
      sctx.restore();
      sctx.fillStyle = '#8fa4b8'; sctx.font = '14px Consolas,monospace';
      sctx.fillText('Destiny simulates. Trinity draws. You fly.', W / 2, ty + 30);
      const bottom = drawControlCards(ty + 58);
      if (Math.floor(performance.now() / 500) % 2 === 0) {
        sctx.fillStyle = '#eaf2fa'; sctx.font = 'bold 17px Consolas,monospace'; sctx.textAlign = 'center';
        sctx.fillText('— press any key to warp in —', W / 2, bottom + 42);
      }
    } else if (S.mode === 'play' && S.paused) {
      sctx.fillStyle = 'rgba(2,4,9,0.62)'; sctx.fillRect(0, 0, W, H);
      const ty = Math.max(80, H * 0.14);
      sctx.textAlign = 'center';
      sctx.save();
      sctx.shadowColor = 'rgba(100,180,255,0.8)'; sctx.shadowBlur = 24;
      sctx.fillStyle = '#eaf2fa'; sctx.font = 'bold 40px Consolas,monospace';
      sctx.fillText('PAUSED', W / 2, ty);
      sctx.restore();
      const bottom = drawControlCards(ty + 34);
      sctx.fillStyle = '#eaf2fa'; sctx.font = 'bold 15px Consolas,monospace'; sctx.textAlign = 'center';
      sctx.fillText('press P to resume', W / 2, bottom + 40);
    } else if (S.mode === 'dead') {
      sctx.fillStyle = 'rgba(24,4,4,0.45)'; sctx.fillRect(0, 0, W, H);
      sctx.textAlign = 'center';
      sctx.save();
      sctx.shadowColor = 'rgba(255,80,60,0.8)'; sctx.shadowBlur = 26;
      sctx.fillStyle = '#f5e0dc'; sctx.font = 'bold 40px Consolas,monospace';
      sctx.fillText('SHIP LOST', W / 2, H * 0.4);
      sctx.restore();
      sctx.fillStyle = '#c89898'; sctx.font = '13px Consolas,monospace';
      sctx.fillText('Your pod drifts among the wreckage. ' + S.kills + ' kills in ' + fmtTime(S.stats.endT)
        + (S.overtime ? ' — overtime wave ' + S.otWave : '') + '.', W / 2, H * 0.4 + 30);
      sctx.fillStyle = newRecord ? '#ffd978' : '#c8b898';
      sctx.font = 'bold 15px Consolas,monospace';
      sctx.fillText('SCORE ' + S.score.toLocaleString() + (newRecord ? '  — NEW RECORD' : '   ·   BEST ' + best.toLocaleString()), W / 2, H * 0.4 - 34);
      let tip = 'Tip: keep moving — fast sideways motion makes enemy turrets miss.';
      if (S.deathInfo) {
        if (S.deathInfo.src === 'torp') tip = 'Tip: torpedoes can be outrun — hold Shift and burn away from them.';
        else if (S.deathInfo.webbed) tip = 'Tip: you were WEBBED to half speed — kill the webifier frigates first.';
        else if (S.deathInfo.src === 'cruiser') tip = "Tip: the cruiser's heavy guns track slowly — orbit her CLOSE and fast.";
      }
      sctx.fillStyle = '#f0c85a'; sctx.font = '13px Consolas,monospace';
      sctx.fillText(tip, W / 2, H * 0.4 + 56);
      sctx.fillStyle = '#eaf2fa'; sctx.font = 'bold 14px Consolas,monospace';
      sctx.fillText('press R to refit and warp back', W / 2, H * 0.4 + 86);
    } else if (S.mode === 'victory') {
      sctx.fillStyle = 'rgba(3,14,8,0.4)'; sctx.fillRect(0, 0, W, H);
      sctx.textAlign = 'center';
      sctx.save();
      sctx.shadowColor = 'rgba(120,255,180,0.8)'; sctx.shadowBlur = 26;
      sctx.fillStyle = '#e2f5e4'; sctx.font = 'bold 40px Consolas,monospace';
      sctx.fillText('SITE SECURED', W / 2, H * 0.4);
      sctx.restore();
      const acc = S.stats.shots ? Math.round(100 * S.stats.hits / S.stats.shots) : 0;
      sctx.fillStyle = '#9cc8a0'; sctx.font = '13px Consolas,monospace';
      sctx.fillText('The Sanguine Vesper is dust. ' + fmtTime(S.stats.endT) + ' · ' + S.kills + ' kills · ' + acc + '% turret accuracy', W / 2, H * 0.4 + 30);
      const rating = S.stats.endT < 240 ? 'ELITE' : S.stats.endT < 380 ? 'VETERAN' : 'CAPSULEER';
      sctx.save();
      sctx.shadowColor = 'rgba(255,215,120,0.8)'; sctx.shadowBlur = 16;
      sctx.fillStyle = '#ffd978'; sctx.font = 'bold 18px Consolas,monospace';
      sctx.fillText('RATING: ' + rating + '   ·   SCORE ' + S.score.toLocaleString()
        + (newRecord ? '  — NEW RECORD' : ''), W / 2, H * 0.4 + 60);
      sctx.restore();
      let mvp = null, mk = 0;
      for (const nm in S.killsBy) if (nm !== 'FC' && S.killsBy[nm] > mk) { mk = S.killsBy[nm]; mvp = nm; }
      sctx.fillStyle = '#9cc8d8'; sctx.font = '13px Consolas,monospace';
      sctx.fillText('FC: ' + (S.killsBy.FC || 0) + ' kills' + (mvp ? '   ·   Top gun: ' + mvp + ' — ' + mk + ' kills' : ''), W / 2, H * 0.4 + 82);
      sctx.fillStyle = '#a8e8c0'; sctx.font = 'bold 15px Consolas,monospace';
      if (Math.floor(performance.now() / 500) % 2 === 0)
        sctx.fillText('press N for OVERTIME — endless reinforcements, keep your score', W / 2, H * 0.4 + 110);
      sctx.fillStyle = '#eaf2fa'; sctx.font = '13px Consolas,monospace';
      sctx.fillText('or press R to fly the site again', W / 2, H * 0.4 + 134);
    }
  }

  /* ---------------- frame ---------------- */
  function render(lerp, evts) {
    handleEvents(evts);
    const S = Destiny.state();
    const p = S.player;
    const now = performance.now() / 1000;
    const dtF = clamp(now - lastFrame, 0.001, 0.05);
    lastFrame = now;

    // camera: lead ahead of velocity so motion reads instantly
    const ptx = p.px + (p.x - p.px) * lerp, pty = p.py + (p.y - p.py) * lerp;
    const lead = S.mode === 'play' || S.mode === 'dead' ? 0.55 : 0;
    let camTX = ptx + p.vx * lead, camTY = pty + p.vy * lead;
    let zoomT = (S.abOn ? 0.86 : 1) * (1 + 0.05 * zoomPulse);
    if (killcam) {   // linger on the big kill
      killcam.t -= dtF;
      if (killcam.t <= 0) killcam = null;
      else {
        const mix = 0.85 * Math.sin(clamp(killcam.t / 1.6, 0, 1) * Math.PI);
        camTX += (killcam.x - camTX) * mix;
        camTY += (killcam.y - camTY) * mix;
        zoomT *= 1 + 0.3 * mix;
      }
    }
    cam.x += (camTX - cam.x) * (1 - Math.exp(-3.2 * dtF));
    cam.y += (camTY - cam.y) * (1 - Math.exp(-3.2 * dtF));
    zoomK += (zoomT - zoomK) * (1 - Math.exp(-2.5 * dtF));
    zoomPulse *= Math.exp(-4 * dtF);
    scale = (H / 1350) * zoomK;

    // persist the best score at the moment a run ends
    if (S.mode === 'dead' || S.mode === 'victory') {
      if (S.score > best) {
        best = S.score; newRecord = true;
        try { localStorage.setItem('cs_best', String(best)); } catch (e) {}
      }
    } else newRecord = false;

    if (shake > 0.3) {
      cam.x += (Math.random() - 0.5) * shake / scale * 0.35;
      cam.y += (Math.random() - 0.5) * shake / scale * 0.35;
      shake *= Math.exp(-6 * dtF);
    }
    if (lockPulse > 0) lockPulse = Math.max(0, lockPulse - dtF * 3);
    for (const [id, fx] of shieldFx) {
      fx.t -= dtF;
      if (fx.t <= 0) shieldFx.delete(id);
    }

    // 1) world → offscreen buffer
    drawWorld(S, lerp, now, dtF);

    // 2) composite to screen
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    sctx.globalCompositeOperation = 'source-over';
    sctx.globalAlpha = 1;
    sctx.drawImage(worldCv, 0, 0);

    // chromatic ghosting on heavy shake
    if (shake > 7) {
      const off = clamp(shake * 0.35, 1, 7);
      sctx.globalCompositeOperation = 'screen';
      sctx.globalAlpha = 0.22;
      sctx.drawImage(worldCv, off, 0);
      sctx.drawImage(worldCv, -off, off * 0.5);
      sctx.globalAlpha = 1;
      sctx.globalCompositeOperation = 'source-over';
    }

    // 3) bloom: downsample twice, add back
    bactx.clearRect(0, 0, bloomA.width, bloomA.height);
    bactx.drawImage(worldCv, 0, 0, bloomA.width, bloomA.height);
    bbctx.clearRect(0, 0, bloomB.width, bloomB.height);
    bbctx.drawImage(bloomA, 0, 0, bloomB.width, bloomB.height);
    sctx.globalCompositeOperation = 'lighter';
    sctx.globalAlpha = 0.26;
    sctx.drawImage(bloomA, 0, 0, W, H);
    sctx.globalAlpha = 0.34;
    sctx.drawImage(bloomB, 0, 0, W, H);
    sctx.globalAlpha = 1;
    sctx.globalCompositeOperation = 'source-over';

    // wave motion gun white-out
    if (screenFlash > 0.01) {
      sctx.fillStyle = 'rgba(215,240,255,' + screenFlash.toFixed(2) + ')';
      sctx.fillRect(0, 0, W, H);
      screenFlash *= Math.exp(-5 * dtF);
    }

    // warp arrival: radial streaks collapsing as you drop out of warp
    if (warpFx > 0.01) {
      sctx.globalCompositeOperation = 'lighter';
      sctx.lineWidth = 1.5;
      for (let i = 0; i < 36; i++) {
        const a = (i / 36) * TAU + 0.35;
        const r1 = ((120 + i * 47) % (H * 0.7)) + H * 0.12;
        const x1 = W / 2 + Math.cos(a) * r1 * (1.7 - warpFx * 0.7);
        const y1 = H / 2 + Math.sin(a) * r1 * (1.7 - warpFx * 0.7);
        sctx.strokeStyle = 'rgba(160,210,255,' + (0.5 * warpFx).toFixed(2) + ')';
        sctx.beginPath();
        sctx.moveTo(x1, y1);
        sctx.lineTo(x1 + Math.cos(a) * 150 * warpFx, y1 + Math.sin(a) * 150 * warpFx);
        sctx.stroke();
      }
      sctx.lineWidth = 1;
      sctx.globalCompositeOperation = 'source-over';
      warpFx *= Math.exp(-2.2 * dtF);
    }

    // 4) world-anchored UI (crisp, no bloom)
    floaters = floaters.filter(f => (f.life -= dtF) > 0);
    for (const f of floaters) {
      f.y -= 34 * dtF;
      sctx.globalAlpha = clamp(f.life * 2, 0, 1);
      sctx.fillStyle = f.col;
      sctx.font = 'bold ' + (f.big ? 15 : 12) + 'px Consolas,monospace';
      sctx.textAlign = 'center';
      sctx.fillText(f.txt, w2sx(f.x), w2sy(f.y));
    }
    sctx.globalAlpha = 1;
    drawLockUI(S, lerp);
    drawOffscreen(S);
    if (S.mode === 'play' && p.alive) {
      sctx.strokeStyle = 'rgba(90,140,190,0.13)';
      sctx.setLineDash([3, 7]);
      sctx.beginPath(); sctx.arc(w2sx(ptx), w2sy(pty), 520 * scale, 0, TAU); sctx.stroke();
      sctx.setLineDash([]);
    }

    // 5) damage vignette + low-hull heartbeat
    if (redFlash > 0.01) {
      const vg = sctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.75);
      vg.addColorStop(0, 'rgba(180,30,20,0)');
      vg.addColorStop(1, 'rgba(180,30,20,' + (redFlash * 0.8).toFixed(2) + ')');
      sctx.fillStyle = vg; sctx.fillRect(0, 0, W, H);
      redFlash *= Math.exp(-3.5 * dtF);
    }
    if (p.alive && p.hull < p.hullMax * 0.3 && (S.mode === 'play')) {
      const beat = 0.5 + 0.5 * Math.sin(now * 6);
      const vg = sctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.8);
      vg.addColorStop(0, 'rgba(160,20,15,0)');
      vg.addColorStop(1, 'rgba(160,20,15,' + (0.18 * beat).toFixed(2) + ')');
      sctx.fillStyle = vg; sctx.fillRect(0, 0, W, H);
    }

    // 6) film grain + vignette
    if (!grainPattern) grainPattern = sctx.createPattern(grainCv, 'repeat');
    sctx.save();
    sctx.globalAlpha = 0.05;
    sctx.globalCompositeOperation = 'overlay';
    sctx.translate((Math.random() * 128) | 0, (Math.random() * 128) | 0);
    sctx.fillStyle = grainPattern;
    sctx.fillRect(-128, -128, W + 256, H + 256);
    sctx.restore();
    const vg2 = sctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.95);
    vg2.addColorStop(0, 'rgba(0,0,0,0)');
    vg2.addColorStop(1, 'rgba(0,0,10,0.42)');
    sctx.fillStyle = vg2; sctx.fillRect(0, 0, W, H);

    // kill feed decay
    for (const k of killFeed) k.life -= dtF;
    killFeed = killFeed.filter(k => k.life > 0);

    // banner
    if (banner) {
      banner.life -= dtF;
      if (banner.life <= 0) banner = null;
      else {
        const a = clamp(Math.min(banner.life, 4.5 - banner.life) / 0.5, 0, 1);
        sctx.globalAlpha = a;
        sctx.save();
        sctx.shadowColor = 'rgba(120,180,255,0.7)'; sctx.shadowBlur = 18;
        sctx.fillStyle = '#e8eef5'; sctx.font = 'bold 30px Consolas,monospace'; sctx.textAlign = 'center';
        sctx.fillText(banner.text, W / 2, H * 0.22);
        sctx.restore();
        if (banner.sub) {
          sctx.fillStyle = '#93a8bd'; sctx.font = '13px Consolas,monospace'; sctx.textAlign = 'center';
          sctx.fillText(banner.sub, W / 2, H * 0.22 + 26);
        }
        sctx.globalAlpha = 1;
      }
    }

    // 7) HUD
    if (S.mode === 'play' || S.mode === 'dead') {
      if (p.alive) { drawCapWheel(S); drawWmgStatus(S); }
      drawPanels(S);
      drawRadar(S);
      drawFleetUI(S, dtF);
    }
    if (S.mode === 'play' && !S.paused) {
      drawTutorial(S, dtF);
      drawDraft(S);
    }
    overlay(S);
  }

  return {
    render,
    screenToWorld: (x, y) => ({ x: (x - W / 2) / scale + cam.x, y: (y - H / 2) / scale + cam.y }),
    overviewHit: (x, y) => {
      for (const r of overviewRows)
        if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r.id;
      return null;
    },
    draftHit: (x, y) => {
      for (const r of draftRects)
        if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r.pick;
      return null;
    }
  };
})();

/* =====================================================================
   AURA — WebAudio, driven by sim events
   ===================================================================== */
const Aura = (() => {
  let ac = null, master = null, noiseBuf = null, abGain = null;
  let droneGain = null, engGain = null, engFilter = null;
  let wmgOsc = null, wmgOscGain = null, wmgSwellGain = null, wmgSwellFilter = null;

  function ensure() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
        const len = ac.sampleRate;
        noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        // ambient drone — swells as the war heats up
        const o1 = ac.createOscillator(), o2 = ac.createOscillator();
        droneGain = ac.createGain();
        o1.frequency.value = 55; o2.frequency.value = 55.7;
        o1.type = 'sine'; o2.type = 'sine';
        droneGain.gain.value = 0.015;
        o1.connect(droneGain); o2.connect(droneGain); droneGain.connect(master);
        o1.start(); o2.start();
        // afterburner noise loop
        const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.7;
        abGain = ac.createGain(); abGain.gain.value = 0;
        src.connect(bp); bp.connect(abGain); abGain.connect(master);
        src.start();
        // engine hum — follows the throttle
        const esrc = ac.createBufferSource(); esrc.buffer = noiseBuf; esrc.loop = true;
        engFilter = ac.createBiquadFilter(); engFilter.type = 'lowpass'; engFilter.frequency.value = 160;
        engGain = ac.createGain(); engGain.gain.value = 0;
        esrc.connect(engFilter); engFilter.connect(engGain); engGain.connect(master);
        esrc.start();
        // wave motion gun charge layers (persistent, gain-managed)
        wmgOsc = ac.createOscillator(); wmgOscGain = ac.createGain();
        wmgOsc.type = 'sawtooth'; wmgOsc.frequency.value = 55; wmgOscGain.gain.value = 0;
        wmgOsc.connect(wmgOscGain); wmgOscGain.connect(master); wmgOsc.start();
        const ssrc = ac.createBufferSource(); ssrc.buffer = noiseBuf; ssrc.loop = true;
        wmgSwellFilter = ac.createBiquadFilter(); wmgSwellFilter.type = 'bandpass'; wmgSwellFilter.Q.value = 1.2;
        wmgSwellGain = ac.createGain(); wmgSwellGain.gain.value = 0;
        ssrc.connect(wmgSwellFilter); wmgSwellFilter.connect(wmgSwellGain); wmgSwellGain.connect(master);
        ssrc.start();
      } catch (e) {}
    }
    if (ac && ac.state === 'suspended') ac.resume();
  }

  // route a one-shot through a stereo panner so battle reads left/right
  function out(pan) {
    if (!pan || !ac.createStereoPanner) return master;
    const sp = ac.createStereoPanner();
    sp.pan.value = clamp(pan, -1, 1);
    sp.connect(master);
    return sp;
  }

  function blip(freq, dur, type, vol, slide, pan) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(out(pan));
    o.start(); o.stop(ac.currentTime + dur);
  }

  function noise(dur, vol, freq, slide, pan) {
    if (!ac) return;
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) f.frequency.exponentialRampToValueAtTime(Math.max(30, slide), ac.currentTime + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    src.connect(f); f.connect(g); g.connect(out(pan));
    src.start(); src.stop(ac.currentTime + dur);
  }

  function handle(evts, S) {
    if (!ac) return;
    const px = S && S.player ? S.player.x : 0;
    for (const e of evts) {
      const pan = e.x != null ? clamp((e.x - px) / 900, -0.85, 0.85) : 0;
      switch (e.type) {
        case 'muzzle': if (e.player) { blip(600, 0.08, 'square', 0.045, 200, pan); noise(0.05, 0.03, 3500, 800, pan); } break;
        case 'hit': e.layer === 'shield' ? blip(950, 0.07, 'triangle', 0.04, 500, pan) : noise(0.12, 0.06, 900, 200, pan); break;
        case 'boom': noise(e.big ? 1.4 : 0.6, e.big ? 0.5 : 0.3, 900, 50, pan); blip(70, e.big ? 1 : 0.5, 'sine', 0.2, 28, pan); break;
        case 'torpboom': if (!e.fizzle) { noise(0.8, 0.4, 700, 40, pan); blip(60, 0.7, 'sine', 0.25, 25, pan); } break;
        case 'torplaunch': noise(0.4, 0.1, 500, 1800, pan); break;
        case 'torpwarn': blip(880, 0.1, 'sine', 0.05); break;
        case 'lock': blip(1150, 0.09, 'sine', 0.07); blip(1450, 0.12, 'sine', 0.06); break;
        case 'webbed': blip(220, 0.35, 'sawtooth', 0.05, 90); break;
        case 'warpin': noise(0.45, 0.18, 300, 4200, pan); break;
        case 'kill': blip(440 + 60 * Math.min(e.combo || 1, 8), 0.15, 'triangle', 0.06, 900, pan); break;
        case 'pickup': blip(880, 0.08, 'sine', 0.06, 1320, pan); blip(1320, 0.12, 'sine', 0.05, 0, pan); break;
        case 'banner': blip(340, 0.25, 'sine', 0.05, 420); break;
        case 'mlaunch': noise(0.5, 0.14, 500, 2800, pan); blip(320, 0.3, 'triangle', 0.05, 900, pan); break;
        case 'order': blip(700, 0.07, 'sine', 0.05, 950); break;
        case 'wingdown': blip(180, 0.5, 'sine', 0.12, 60); break;
        case 'wingback': blip(520, 0.2, 'sine', 0.06, 780); break;
        case 'draftoffer': blip(660, 0.15, 'sine', 0.06, 880); blip(880, 0.2, 'sine', 0.05, 1170); break;
        case 'fitted': blip(880, 0.12, 'sine', 0.07, 1170); break;
        case 'heaton': noise(0.4, 0.1, 2200, 500); break;
        case 'bosslance':
          if (e.phase === 'charge') blip(90, 3, 'sawtooth', 0.08, 750, pan);
          else { noise(1.4, 0.4, 1000, 60, pan); blip(58, 1.2, 'sine', 0.3, 28, pan); }
          break;
        case 'wmgcancel': blip(240, 0.35, 'sawtooth', 0.05, 55); break;
        case 'wmgfire':
          noise(2.4, 0.55, 1400, 35);
          blip(30, 2.8, 'sine', 0.45, 16);
          blip(220, 1.2, 'sawtooth', 0.12, 30);
          break;
      }
    }
  }

  function update(S) {
    if (!ac || !abGain) return;
    const t = ac.currentTime;
    abGain.gain.setTargetAtTime(S.abOn ? 0.06 : 0, t, 0.08);
    const p = S.player;
    const spd = p ? Math.hypot(p.vx, p.vy) : 0;
    if (engGain) {
      engGain.gain.setTargetAtTime(
        p && p.alive && S.mode === 'play' && !S.paused ? 0.012 + (spd / 430) * 0.035 : 0, t, 0.15);
      engFilter.frequency.setTargetAtTime(160 + spd * 1.1, t, 0.15);
    }
    if (droneGain) {
      const hot = S.ships && S.ships.some(s => s.alive && s.faction === 'hostile');
      droneGain.gain.setTargetAtTime(
        0.012 + 0.004 * Math.min((S.wave || 0) + (S.otWave || 0), 8) + (hot ? 0.006 : 0), t, 0.5);
    }
    const ch = S.wmg && S.wmg.charging ? S.wmg.charge : 0;
    if (wmgOscGain) {
      wmgOscGain.gain.setTargetAtTime(ch > 0 ? 0.02 + 0.07 * ch : 0, t, 0.05);
      wmgOsc.frequency.setTargetAtTime(55 + 1100 * ch * ch, t, 0.05);
    }
    if (wmgSwellGain) {
      wmgSwellGain.gain.setTargetAtTime(ch > 0 ? 0.02 + 0.13 * ch * ch : 0, t, 0.08);
      wmgSwellFilter.frequency.setTargetAtTime(300 + 2600 * ch, t, 0.08);
    }
  }

  return { ensure, handle, update };
})();

/* =====================================================================
   Input + main loop (glue)
   ===================================================================== */
const Input = (() => {
  const held = new Set();
  let tab = false, restart = false, anyKey = false, pause = false, overtimeKey = false, missileKey = false, orderKey = null, pickKey = 0, click = null;
  const ORDER_KEYS = { 1: 'focus', 2: 'defend', 3: 'free', 4: 'regroup' };
  const ALIAS = { arrowup: 'w', arrowdown: 's', arrowleft: 'a', arrowright: 'd', z: 'w', q: 'a' };

  window.addEventListener('keydown', e => {
    if (e.key === 'Tab' || e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
    if (e.repeat) return;
    Aura.ensure();
    let k = e.key.toLowerCase();
    if (ALIAS[k]) k = ALIAS[k];
    if (k === 'p' || k === 'escape') { pause = true; return; }
    anyKey = true;
    held.add(k);
    if (e.key === 'Tab') tab = true;
    if (k === 'r') restart = true;
    if (k === 'n') overtimeKey = true;
    if (k === 'f') missileKey = true;
    if (ORDER_KEYS[k]) orderKey = ORDER_KEYS[k];
    if (k >= '1' && k <= '3') pickKey = +k;
  });
  window.addEventListener('keyup', e => {
    let k = e.key.toLowerCase();
    if (ALIAS[k]) k = ALIAS[k];
    held.delete(k);
  });
  window.addEventListener('blur', () => held.clear());

  document.getElementById('cv').addEventListener('mousedown', e => {
    Aura.ensure();
    anyKey = true;
    const rect = e.target.getBoundingClientRect();
    click = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  });

  function consume() {
    let tx = 0, ty = 0;
    if (held.has('w')) ty -= 1;
    if (held.has('s')) ty += 1;
    if (held.has('a')) tx -= 1;
    if (held.has('d')) tx += 1;
    const cmd = {
      thrustX: tx, thrustY: ty,
      ab: held.has('shift'),
      wmg: held.has(' '),
      heat: held.has('g'),
      tab, restart, anyKey, pause,
      overtime: overtimeKey,
      missile: missileKey,
      order: orderKey,
      pick: pickKey,
      clickWorld: null, lockId: null
    };
    if (click) {
      const dp = Trinity.draftHit(click.x, click.y);
      if (dp) cmd.pick = dp;
      else {
        const id = Trinity.overviewHit(click.x, click.y);
        if (id != null) cmd.lockId = id;
        else cmd.clickWorld = Trinity.screenToWorld(click.x, click.y);
      }
    }
    tab = false; restart = false; anyKey = false; pause = false; overtimeKey = false; missileKey = false; orderKey = null; pickKey = 0; click = null;
    return cmd;
  }
  return { consume };
})();

(function main() {
  let last = performance.now() / 1000, acc = 0;
  function frame() {
    const now = performance.now() / 1000;
    acc += Math.min(now - last, 0.25);
    last = now;
    const evts = [];
    while (acc >= TICK) {
      Destiny.tick(Input.consume());
      evts.push(...Destiny.drainEvents());
      acc -= TICK;
    }
    Aura.handle(evts, Destiny.state());
    Aura.update(Destiny.state());
    Trinity.render(acc / TICK, evts);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

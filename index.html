<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CARBON SKIRMISH</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#020409;overflow:hidden;height:100%}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
"use strict";
/* =====================================================================
   CARBON SKIRMISH v2
   A structural homage to CCP's open-sourced Carbon engine.

   - Destiny : deterministic fixed-tick world simulation. Physics, AI,
               ballistics (transversal tracking!), webifiers, torpedoes,
               target locks, waves. The only writer of state.
   - Trinity : rendering layer. Reads sim state, never writes it.
               Camera, parallax space, trails, particles, EVE-style HUD.
   - Aura    : WebAudio. Driven by sim events.

   Zero dependencies. One file.
   ===================================================================== */

const TICK = 1 / 60;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* =====================================================================
   DESTINY — simulation
   ===================================================================== */
const Destiny = (() => {

  function mulberry32(seed) {
    let s = seed | 0;
    return function () {
      s = s + 0x6D2B79F5 | 0;
      let t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  let rng = mulberry32(0xC0FFEE);
  const rr = (a, b) => a + (b - a) * rng();

  /* metres, m/s, seconds. track = turret tracking in rad/s: your hit
     chance collapses as the target's angular velocity beats it. */
  const CLS = {
    player:  { radius: 13, speed: 240, abSpeed: 430, inertia: 2.2,
               shield: 330, sregen: 8, armor: 300, hull: 260,
               cap: 130, cregen: 8.5, abDrain: 15,
               gunDmg: 12, gunRof: 0.4, gunRange: 520, gunCost: 3,
               pspeed: 1200, track: 1.6 },
    scout:   { radius: 9, speed: 265, orbit: 310, inertia: 3.2,
               shield: 35, sregen: 1.5, armor: 30, hull: 30,
               gunDmg: 5, gunRof: 1.1, gunRange: 470, pspeed: 900, track: 2.6,
               lock: 1.4, jink: 0.6, label: 'Blood Raider Scout' },
    frigate: { radius: 12, speed: 230, orbit: 250, inertia: 2.0,
               shield: 90, sregen: 2, armor: 100, hull: 75,
               gunDmg: 10, gunRof: 1.5, gunRange: 520, pspeed: 950, track: 1.7,
               web: 260, lock: 2.2, label: 'Blood Raider Webifier' },
    escort:  { radius: 12, speed: 240, orbit: 270, inertia: 2.0,
               shield: 110, sregen: 2.4, armor: 120, hull: 90,
               gunDmg: 11, gunRof: 1.4, gunRange: 540, pspeed: 950, track: 1.8,
               web: 260, lock: 2.4, label: 'Vesper Escort' },
    cruiser: { radius: 30, speed: 90, orbit: 620, inertia: 0.7,
               shield: 560, sregen: 5, armor: 520, hull: 480,
               gunDmg: 30, gunRof: 2.6, gunRange: 920, pspeed: 800, track: 0.5,
               torpRof: 7, torpDmg: 55, torpSpeed: 310, torpTurn: 1.3,
               torpLife: 14, torpDet: 26,
               lock: 4.5, label: 'Sanguine Vesper' }
  };

  const WAVES = [
    { banner: 'WAVE 1 — SCOUT PICKET',
      sub: 'Fast, fragile. Keep your speed up and they will miss.',
      ships: [['scout'], ['scout'], ['scout']] },
    { banner: 'WAVE 2 — FRIGATE RESPONSE',
      sub: 'Webifiers. If they slow you, everything starts hitting.',
      ships: [['frigate'], ['frigate'], ['frigate'], ['scout']] },
    { banner: 'WAVE 3 — THE SANGUINE VESPER',
      sub: 'Heavy turrets track slowly — get close, orbit fast. Outrun her torpedoes.',
      ships: [['cruiser', 'Sanguine Vesper'], ['escort'], ['escort']] }
  ];

  let S = null;
  let nextId = 1;

  function makeShip(cls, name, x, y) {
    const d = CLS[cls];
    return {
      id: nextId++, cls, name: name || d.label || cls,
      faction: cls === 'player' ? 'player' : 'hostile',
      x, y, px: x, py: y, vx: 0, vy: 0,
      face: cls === 'player' ? -Math.PI / 2 : Math.atan2(-y, -x),
      radius: d.radius,
      shield: d.shield, shieldMax: d.shield,
      armor: d.armor, armorMax: d.armor,
      hull: d.hull, hullMax: d.hull,
      cap: d.cap || 0, capMax: d.cap || 0,
      gunCd: rr(0.4, (d.gunRof || 1) + 0.4), torpCd: 3,
      orbitDir: rng() < 0.5 ? 1 : -1, muzzle: 1,
      alive: true, wreck: false, wreckT: 0, spin: 0
    };
  }

  function reset() {
    rng = mulberry32(0xC0FFEE);      // same seed every run: the site is deterministic
    nextId = 1;
    S = {
      mode: 'intro', t: 0,
      player: null, ships: [], projectiles: [], events: [],
      wave: 0, waveDelay: 0, kills: 0,
      lockTargetId: null, lockProgress: 0, locked: false, lockNeed: 0,
      abOn: false, capEmptyFlash: 0,
      webbedBy: [], wasWebbed: false, torpWarnT: 0,
      stats: { shots: 0, hits: 0, endT: 0 }
    };
    S.player = makeShip('player', 'Your Ship', 0, 0);
    S.ships.push(S.player);
  }

  function spawnWave(i) {
    const w = WAVES[i];
    const baseAng = rr(0, TAU);
    w.ships.forEach((spec, k) => {
      const ang = baseAng + k * (TAU / w.ships.length) + rr(-0.35, 0.35);
      const dist = rr(1050, 1400);
      const sh = makeShip(spec[0], spec[1],
        S.player.x + Math.cos(ang) * dist,
        S.player.y + Math.sin(ang) * dist);
      // arrive out of warp with velocity toward the fight
      sh.vx = -Math.cos(ang) * 220; sh.vy = -Math.sin(ang) * 220;
      S.ships.push(sh);
      S.events.push({ type: 'warpin', x: sh.x, y: sh.y, ang: ang + Math.PI, big: spec[0] === 'cruiser' });
    });
    S.events.push({ type: 'banner', text: w.banner, sub: w.sub });
  }

  const hostiles = () => S.ships.filter(s => s.alive && s.faction === 'hostile');

  function applyDamage(sh, dmg) {
    let left = dmg, layer = 'hull';
    if (sh.shield > 0.5) layer = 'shield';
    else if (sh.armor > 0.5) layer = 'armor';
    if (sh.shield > 0) { const d = Math.min(sh.shield, left); sh.shield -= d; left -= d; }
    if (left > 0 && sh.armor > 0) { const d = Math.min(sh.armor, left); sh.armor -= d; left -= d; }
    if (left > 0) sh.hull -= left;
    S.events.push({ type: 'dmg', x: sh.x, y: sh.y - sh.radius - 8, amount: dmg, layer, target: sh.id });
    S.events.push({ type: 'hit', x: sh.x, y: sh.y, r: sh.radius, layer, player: sh === S.player });
    if (sh.hull <= 0 && sh.alive) {
      sh.alive = false; sh.wreck = true; sh.wreckT = 22;
      sh.vx *= 0.25; sh.vy *= 0.25; sh.spin = rr(-1.2, 1.2);
      S.events.push({ type: 'boom', x: sh.x, y: sh.y, r: sh.radius, big: sh.cls === 'cruiser' });
      if (sh.faction === 'hostile') {
        S.kills++;
        S.events.push({ type: 'kill', name: sh.name });
      }
      if (sh === S.player) { S.mode = 'dead'; S.stats.endT = S.t; }
      if (S.lockTargetId === sh.id) { S.lockTargetId = null; S.locked = false; S.lockProgress = 0; }
    }
  }

  function interceptAngle(sx, sy, t, pSpeed) {
    const rx = t.x - sx, ry = t.y - sy;
    const a = t.vx * t.vx + t.vy * t.vy - pSpeed * pSpeed;
    const b = 2 * (rx * t.vx + ry * t.vy);
    const c = rx * rx + ry * ry;
    let tt = 0;
    if (Math.abs(a) < 1e-6) { if (Math.abs(b) > 1e-6) tt = -c / b; }
    else {
      const disc = b * b - 4 * a * c;
      if (disc >= 0) {
        const sq = Math.sqrt(disc);
        const t1 = (-b - sq) / (2 * a), t2 = (-b + sq) / (2 * a);
        tt = Math.min(t1, t2) > 0 ? Math.min(t1, t2) : Math.max(t1, t2);
      }
    }
    if (!(tt > 0) || tt > 8) tt = 0;
    return Math.atan2(ry + t.vy * tt, rx + t.vx * tt);
  }

  /* EVE-style turret tracking: hit chance falls as the target's angular
     velocity (transversal / distance) exceeds the gun's tracking speed. */
  function rollHit(shooter, target, track) {
    const dx = target.x - shooter.x, dy = target.y - shooter.y;
    const d = Math.max(Math.hypot(dx, dy), 40);
    const nx = dx / d, ny = dy / d;
    const rvx = target.vx - shooter.vx, rvy = target.vy - shooter.vy;
    const transversal = Math.abs(rvx * ny - rvy * nx);
    const angular = transversal / d;
    const chance = clamp(1 - angular / track, 0.08, 0.95);
    return { hit: rng() < chance, chance };
  }

  function fire(sh, target, dmg, speed, range, track) {
    const roll = rollHit(sh, target, track);
    let ang = interceptAngle(sh.x, sh.y, target, speed);
    if (!roll.hit) ang += rr(0.05, 0.13) * (rng() < 0.5 ? 1 : -1);
    else ang += rr(-0.012, 0.012);
    const mx = sh.x + Math.cos(ang) * (sh.radius + 5);
    const my = sh.y + Math.sin(ang) * (sh.radius + 5);
    const dist = Math.hypot(target.x - sh.x, target.y - sh.y);
    S.projectiles.push({
      kind: 'shot',
      x: mx, y: my, px: mx, py: my,
      vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
      dmg, faction: sh.faction, life: range / speed + 0.7,
      hostileShot: sh.faction === 'hostile',
      willHit: roll.hit, targetId: target.id,
      missT: roll.hit ? -1 : dist / speed
    });
    S.events.push({ type: 'muzzle', x: mx, y: my, ang, player: sh === S.player });
    if (sh === S.player) { S.stats.shots++; if (roll.hit) S.stats.hits++; }
    return roll.hit;
  }

  function launchTorp(sh, d) {
    const ang = Math.atan2(S.player.y - sh.y, S.player.x - sh.x);
    S.projectiles.push({
      kind: 'torp',
      x: sh.x, y: sh.y, px: sh.x, py: sh.y,
      vx: Math.cos(ang) * d.torpSpeed, vy: Math.sin(ang) * d.torpSpeed,
      dmg: d.torpDmg, faction: sh.faction, life: d.torpLife,
      hostileShot: true, turn: d.torpTurn, det: d.torpDet, speed: d.torpSpeed
    });
    S.events.push({ type: 'torplaunch', x: sh.x, y: sh.y });
  }

  function steer(sh, tx, ty, maxSpeed, inertia) {
    const dvx = tx * maxSpeed - sh.vx, dvy = ty * maxSpeed - sh.vy;
    const k = 1 - Math.exp(-inertia * TICK);
    sh.vx += dvx * k; sh.vy += dvy * k;
  }

  function setLockTarget(id) {
    if (S.lockTargetId === id) return;
    const t = S.ships.find(s => s.id === id && s.alive && s.faction === 'hostile');
    if (!t) return;
    S.lockTargetId = id; S.locked = false; S.lockProgress = 0;
    S.lockNeed = CLS[t.cls].lock || 2;
  }

  function tickPlayer(cmd) {
    const p = S.player, d = CLS.player;

    // webifiers
    S.webbedBy = [];
    for (const h of hostiles()) {
      const w = CLS[h.cls].web;
      if (w && Math.hypot(h.x - p.x, h.y - p.y) <= w) S.webbedBy.push(h.id);
    }
    const webbed = S.webbedBy.length > 0;
    if (webbed && !S.wasWebbed) S.events.push({ type: 'webbed' });
    S.wasWebbed = webbed;

    // afterburner + thrust
    S.abOn = cmd.ab && p.cap > 0.5;
    if (S.abOn) p.cap = Math.max(0, p.cap - d.abDrain * TICK);
    const maxSpd = (S.abOn ? d.abSpeed : d.speed) * (webbed ? 0.5 : 1);

    let ix = cmd.thrustX, iy = cmd.thrustY;
    const il = Math.hypot(ix, iy);
    if (il > 0) steer(p, ix / il, iy / il, maxSpd, d.inertia);
    else {
      const k = 1 - Math.exp(-0.4 * TICK);
      p.vx -= p.vx * k; p.vy -= p.vy * k;
    }
    if (Math.hypot(p.vx, p.vy) > 8) p.face = Math.atan2(p.vy, p.vx);

    // targeting
    if (cmd.lockId != null) setLockTarget(cmd.lockId);
    if (cmd.clickWorld) {
      let best = null, bd = 70;
      for (const s of hostiles()) {
        const dd = Math.hypot(s.x - cmd.clickWorld.x, s.y - cmd.clickWorld.y) - s.radius;
        if (dd < bd) { bd = dd; best = s; }
      }
      if (best) setLockTarget(best.id);
    }
    if (cmd.tab) {
      const h = hostiles().sort((a, b) =>
        Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y));
      if (h.length) {
        const i = h.findIndex(s => s.id === S.lockTargetId);
        setLockTarget(h[(i + 1) % h.length].id);
      }
    }

    const tgt = S.ships.find(s => s.id === S.lockTargetId && s.alive);
    if (!tgt) { S.lockTargetId = null; S.locked = false; S.lockProgress = 0; }
    else if (!S.locked) {
      S.lockProgress += TICK;
      if (S.lockProgress >= S.lockNeed) { S.locked = true; S.events.push({ type: 'lock' }); }
    }

    // turrets
    p.gunCd -= TICK;
    if (S.locked && tgt && p.gunCd <= 0) {
      const dist = Math.hypot(tgt.x - p.x, tgt.y - p.y);
      if (dist <= d.gunRange) {
        if (p.cap >= d.gunCost) {
          p.cap -= d.gunCost;
          fire(p, tgt, d.gunDmg * rr(0.85, 1.15), d.pspeed, d.gunRange + 200, d.track);
          p.gunCd = d.gunRof;
          p.muzzle = -p.muzzle;
        } else { S.capEmptyFlash = 1.2; p.gunCd = 0.3; }
      }
    }

    p.shield = Math.min(p.shieldMax, p.shield + d.sregen * TICK);
    p.cap = Math.min(p.capMax, p.cap + d.cregen * TICK);
    if (S.capEmptyFlash > 0) S.capEmptyFlash -= TICK;
  }

  function tickHostile(sh) {
    const d = CLS[sh.cls], p = S.player;
    if (!p.alive) {
      steer(sh, Math.cos(sh.face), Math.sin(sh.face), d.speed * 0.35, d.inertia);
    } else {
      const rx = p.x - sh.x, ry = p.y - sh.y;
      const dist = Math.hypot(rx, ry) || 1;
      const nx = rx / dist, ny = ry / dist;
      const tx = -ny * sh.orbitDir, ty = nx * sh.orbitDir;
      let dx, dy;
      if (dist > d.orbit * 1.25)     { dx = nx * 0.9 + tx * 0.3;  dy = ny * 0.9 + ty * 0.3; }
      else if (dist < d.orbit * 0.75){ dx = -nx * 0.6 + tx * 0.8; dy = -ny * 0.6 + ty * 0.8; }
      else                           { dx = tx + nx * 0.05;       dy = ty + ny * 0.05; }
      if (d.jink) {
        const j = Math.sin(S.t * 2.6 + sh.id * 2.1) * d.jink;
        const c = Math.cos(j), s2 = Math.sin(j);
        const ndx = dx * c - dy * s2, ndy = dx * s2 + dy * c;
        dx = ndx; dy = ndy;
      }
      const l = Math.hypot(dx, dy) || 1;
      steer(sh, dx / l, dy / l, d.speed, d.inertia);

      sh.gunCd -= TICK;
      if (sh.gunCd <= 0 && dist <= d.gunRange) {
        fire(sh, p, d.gunDmg * rr(0.85, 1.15), d.pspeed, d.gunRange + 200, d.track);
        sh.gunCd = d.gunRof * rr(0.9, 1.25);
      }
      if (d.torpRof) {
        sh.torpCd -= TICK;
        if (sh.torpCd <= 0 && dist < 1500) { launchTorp(sh, d); sh.torpCd = d.torpRof; }
      }
    }
    if (Math.hypot(sh.vx, sh.vy) > 5) sh.face = Math.atan2(sh.vy, sh.vx);
    sh.shield = Math.min(sh.shieldMax, sh.shield + d.sregen * TICK);
  }

  function tickProjectiles() {
    for (const pr of S.projectiles) {
      pr.px = pr.x; pr.py = pr.y;

      if (pr.kind === 'torp') {
        const p = S.player;
        if (p.alive) {
          const want = Math.atan2(p.y - pr.y, p.x - pr.x);
          let cur = Math.atan2(pr.vy, pr.vx);
          let diff = want - cur;
          while (diff > Math.PI) diff -= TAU;
          while (diff < -Math.PI) diff += TAU;
          cur += clamp(diff, -pr.turn * TICK, pr.turn * TICK);
          pr.vx = Math.cos(cur) * pr.speed; pr.vy = Math.sin(cur) * pr.speed;
        }
        pr.x += pr.vx * TICK; pr.y += pr.vy * TICK;
        pr.life -= TICK;
        if (p.alive && Math.hypot(p.x - pr.x, p.y - pr.y) <= pr.det + p.radius) {
          pr.dead = true;
          S.events.push({ type: 'torpboom', x: pr.x, y: pr.y });
          applyDamage(p, pr.dmg);
        } else if (pr.life <= 0) {
          pr.dead = true;
          S.events.push({ type: 'torpboom', x: pr.x, y: pr.y, fizzle: true });
        }
        continue;
      }

      pr.x += pr.vx * TICK; pr.y += pr.vy * TICK;
      pr.life -= TICK;
      if (pr.life <= 0) { pr.dead = true; continue; }

      if (pr.willHit) {
        // committed hit: light homing so the tracer visibly connects
        const t = S.ships.find(s => s.id === pr.targetId && s.alive);
        if (t) {
          const want = Math.atan2(t.y - pr.y, t.x - pr.x);
          const spd = Math.hypot(pr.vx, pr.vy);
          let cur = Math.atan2(pr.vy, pr.vx);
          let diff = want - cur;
          while (diff > Math.PI) diff -= TAU;
          while (diff < -Math.PI) diff += TAU;
          cur += clamp(diff, -4 * TICK, 4 * TICK);
          pr.vx = Math.cos(cur) * spd; pr.vy = Math.sin(cur) * spd;
          if (Math.hypot(t.x - pr.x, t.y - pr.y) <= t.radius + 5) {
            pr.dead = true;
            applyDamage(t, pr.dmg);
          }
        } else pr.willHit = false;
      } else if (pr.missT >= 0) {
        pr.missT -= TICK;
        if (pr.missT < 0) {
          const t = S.ships.find(s => s.id === pr.targetId && s.alive);
          if (t) S.events.push({ type: 'miss', x: t.x, y: t.y - t.radius - 8, target: t.id });
        }
      }
    }
    S.projectiles = S.projectiles.filter(pr => !pr.dead);

    // torpedo proximity warning ping
    if (S.projectiles.some(pr => pr.kind === 'torp')) {
      S.torpWarnT -= TICK;
      if (S.torpWarnT <= 0) { S.events.push({ type: 'torpwarn' }); S.torpWarnT = 0.9; }
    } else S.torpWarnT = 0;
  }

  function tickWrecks() {
    for (const sh of S.ships) {
      if (!sh.wreck || sh.alive) continue;
      sh.x += sh.vx * TICK; sh.y += sh.vy * TICK;
      sh.face += sh.spin * TICK;
      sh.wreckT -= TICK;
      if (sh.wreckT <= 0) sh.wreck = false;
    }
    S.ships = S.ships.filter(sh => sh.alive || sh.wreck);
  }

  function tickWaves() {
    if (hostiles().length === 0) {
      if (S.wave >= WAVES.length) {
        S.mode = 'victory'; S.stats.endT = S.t;
        S.events.push({ type: 'banner', text: 'SITE SECURED', sub: null });
        return;
      }
      S.waveDelay -= TICK;
      if (S.waveDelay <= 0) { spawnWave(S.wave); S.wave++; S.waveDelay = 2.8; }
    }
  }

  function tick(cmd) {
    if (S.mode === 'intro') {
      if (cmd.anyKey) { S.mode = 'play'; S.waveDelay = 0.4; }
      return;
    }
    if (cmd.restart) { reset(); S.mode = 'play'; S.waveDelay = 0.4; return; }
    if (S.mode !== 'play' && S.mode !== 'dead') return;

    S.t += TICK;
    for (const sh of S.ships) { sh.px = sh.x; sh.py = sh.y; }

    if (S.player.alive) tickPlayer(cmd);
    for (const sh of S.ships) if (sh.alive && sh !== S.player) tickHostile(sh);
    for (const sh of S.ships) if (sh.alive) { sh.x += sh.vx * TICK; sh.y += sh.vy * TICK; }
    tickProjectiles();
    tickWrecks();
    if (S.mode === 'play') tickWaves();
  }

  reset();
  return { tick, state: () => S, drainEvents: () => S.events.splice(0) };
})();

/* =====================================================================
   TRINITY — rendering. Reads Destiny state, never writes it.
   ===================================================================== */
const Trinity = (() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, scale = 0.6, zoomK = 1;
  const cam = { x: 0, y: 0 };

  function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  // ---- pre-rendered glow sprites (additive blending is the whole look)
  function makeGlow(r, g, b) {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const x = c.getContext('2d');
    const gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',1)');
    gr.addColorStop(0.25, 'rgba(' + r + ',' + g + ',' + b + ',0.5)');
    gr.addColorStop(0.6, 'rgba(' + r + ',' + g + ',' + b + ',0.14)');
    gr.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
    x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
    return c;
  }
  const GLOW = {
    cyan: makeGlow(120, 215, 255), blue: makeGlow(70, 130, 255),
    orange: makeGlow(255, 160, 70), red: makeGlow(255, 85, 60),
    gold: makeGlow(255, 210, 110), white: makeGlow(225, 238, 255),
    teal: makeGlow(80, 255, 205), purple: makeGlow(150, 90, 255),
    crimson: makeGlow(220, 50, 60)
  };
  function glow(x, y, r, img, a) {
    if (a <= 0 || r <= 0) return;
    ctx.globalAlpha = Math.min(1, a);
    ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
    ctx.globalAlpha = 1;
  }

  // ---- static space (fixed seed, render-side)
  const stars = [];
  {
    let s = 987654321;
    const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 900; i++) {
      const layer = i < 450 ? 0.22 : i < 750 ? 0.45 : 0.72;
      stars.push({ x: r() * 6000 - 3000, y: r() * 6000 - 3000, z: layer,
                   b: 0.25 + r() * 0.75, tw: r() * TAU });
    }
  }
  const nebulae = [
    { x: -1800, y: -900, r: 1500, img: GLOW.purple, a: 0.10 },
    { x: 1400, y: 600, r: 1800, img: GLOW.blue, a: 0.09 },
    { x: 400, y: -1600, r: 1300, img: GLOW.crimson, a: 0.07 },
    { x: -700, y: 1500, r: 1200, img: GLOW.teal, a: 0.05 },
    { x: 2400, y: -700, r: 1000, img: GLOW.purple, a: 0.07 }
  ];
  const asteroids = [];
  {
    let s = 24680;
    const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 7; i++) {
      const pts = [];
      const n = 8 + Math.floor(r() * 4);
      for (let k = 0; k < n; k++) pts.push(0.7 + r() * 0.45);
      asteroids.push({ x: r() * 5000 - 2500, y: r() * 5000 - 2500,
        r: 25 + r() * 70, rot: r() * TAU, spin: (r() - 0.5) * 0.1, pts });
    }
  }
  const dust = [];
  for (let i = 0; i < 80; i++) dust.push({ x: Math.random() * 4000 - 2000, y: Math.random() * 4000 - 2000 });

  // ---- transient render state
  let particles = [], floaters = [], rings = [], flashes = [], pending = [];
  let killFeed = [], banner = null, shake = 0, redFlash = 0, lockPulse = 0;
  const trails = new Map();
  let lastFrame = performance.now() / 1000;

  const w2sx = x => (x - cam.x) * scale + W / 2;
  const w2sy = y => (y - cam.y) * scale + H / 2;

  function addBoom(x, y, r, big) {
    const n = big ? 90 : 34 + r * 2;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, sp = 40 + Math.random() * (big ? 380 : 240);
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.5 + Math.random() * (big ? 1.6 : 0.9), max: big ? 2 : 1.2,
        kind: 'fire', sz: 2 + Math.random() * (r / 4) });
    }
    for (let i = 0; i < (big ? 26 : 10); i++) {
      const a = Math.random() * TAU, sp = 15 + Math.random() * 70;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1 + Math.random() * 1.6, max: 2.4, kind: 'smoke', sz: 5 + Math.random() * r * 0.5 });
    }
    for (let i = 0; i < (big ? 16 : 7); i++) {
      const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.8 + Math.random() * 1.4, max: 2, kind: 'debris',
        sz: 2 + Math.random() * 4, rot: Math.random() * TAU, spin: (Math.random() - 0.5) * 10 });
    }
    rings.push({ x, y, r: 4, max: (big ? 260 : 60 + r * 3), life: big ? 0.9 : 0.5, t: 0 });
    flashes.push({ x, y, r: (big ? 200 : 40 + r * 3), life: 0.12, max: 0.12, img: GLOW.white });
    shake = Math.min(26, shake + (big ? 22 : r * 0.5));
    if (big) for (let i = 1; i <= 5; i++)
      pending.push({ t: i * 0.16, x: x + (Math.random() - 0.5) * 90, y: y + (Math.random() - 0.5) * 90, r: 9, big: false });
  }

  function handleEvents(evts) {
    const S = Destiny.state();
    for (const e of evts) {
      switch (e.type) {
        case 'boom': addBoom(e.x, e.y, e.r, e.big); break;
        case 'torpboom':
          if (!e.fizzle) addBoom(e.x, e.y, 12, false);
          else flashes.push({ x: e.x, y: e.y, r: 24, life: 0.2, max: 0.2, img: GLOW.orange });
          break;
        case 'hit': {
          const col = e.layer === 'shield' ? 'shieldspark' : 'spark';
          for (let i = 0; i < 6; i++) {
            const a = Math.random() * TAU, sp = 30 + Math.random() * 130;
            particles.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
              life: 0.2 + Math.random() * 0.3, max: 0.5, kind: col, sz: 1.8 });
          }
          if (e.layer === 'shield')
            rings.push({ x: e.x, y: e.y, r: e.r + 6, max: e.r + 16, life: 0.25, t: 0, shield: true });
          if (e.player) redFlash = Math.min(0.55, redFlash + 0.2);
          break;
        }
        case 'dmg':
          if (!(S.player && e.target === S.player.id))
            floaters.push({ x: e.x, y: e.y, txt: String(Math.round(e.amount)), life: 0.9,
              col: e.layer === 'shield' ? '#9fd4ff' : e.layer === 'armor' ? '#ffd9a0' : '#ff9c8a' });
          break;
        case 'miss':
          if (!(S.player && e.target === S.player.id))
            floaters.push({ x: e.x, y: e.y, txt: 'miss', life: 0.7, col: 'rgba(150,165,185,0.8)' });
          break;
        case 'muzzle':
          flashes.push({ x: e.x, y: e.y, r: 14, life: 0.06, max: 0.06,
            img: e.player ? GLOW.gold : GLOW.red });
          break;
        case 'warpin': {
          flashes.push({ x: e.x, y: e.y, r: e.big ? 150 : 80, life: 0.35, max: 0.35, img: GLOW.white });
          rings.push({ x: e.x, y: e.y, r: 6, max: e.big ? 180 : 100, life: 0.5, t: 0, warp: true });
          for (let i = 0; i < 16; i++) {
            const sp = 200 + Math.random() * 300;
            particles.push({ x: e.x, y: e.y,
              vx: Math.cos(e.ang) * sp + (Math.random() - 0.5) * 80,
              vy: Math.sin(e.ang) * sp + (Math.random() - 0.5) * 80,
              life: 0.3 + Math.random() * 0.3, max: 0.6, kind: 'shieldspark', sz: 2 });
          }
          break;
        }
        case 'kill':
          killFeed.unshift({ txt: e.name + ' destroyed', life: 5 });
          if (killFeed.length > 5) killFeed.pop();
          break;
        case 'banner': banner = { text: e.text, sub: e.sub, life: 4.5 }; break;
        case 'lock': lockPulse = 1; break;
      }
    }
  }

  // ---- vector ship art (drawn at origin, nose +x, size r)
  function shipPath(cls, r) {
    if (cls === 'player') {
      ctx.fillStyle = '#232e3d'; ctx.strokeStyle = '#5a7d9e'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(r * 1.5, 0); ctx.lineTo(r * 0.25, r * 0.5); ctx.lineTo(-r * 0.5, r * 1.05);
      ctx.lineTo(-r * 0.95, r * 0.55); ctx.lineTo(-r * 0.7, 0); ctx.lineTo(-r * 0.95, -r * 0.55);
      ctx.lineTo(-r * 0.5, -r * 1.05); ctx.lineTo(r * 0.25, -r * 0.5);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#3d5670';
      ctx.beginPath();
      ctx.moveTo(r * 1.5, 0); ctx.lineTo(r * 0.2, r * 0.32); ctx.lineTo(-r * 0.55, 0);
      ctx.lineTo(r * 0.2, -r * 0.32); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#9fe0ff';
      ctx.beginPath(); ctx.ellipse(r * 0.55, 0, r * 0.3, r * 0.14, 0, 0, TAU); ctx.fill();
    } else if (cls === 'cruiser') {
      ctx.fillStyle = '#331b20'; ctx.strokeStyle = '#a34a50'; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(r * 1.6, 0); ctx.lineTo(r * 0.9, r * 0.4); ctx.lineTo(-r * 0.1, r * 0.55);
      ctx.lineTo(-r * 0.6, r * 0.95); ctx.lineTo(-r * 1.25, r * 0.6); ctx.lineTo(-r * 1.05, 0);
      ctx.lineTo(-r * 1.25, -r * 0.6); ctx.lineTo(-r * 0.6, -r * 0.95); ctx.lineTo(-r * 0.1, -r * 0.55);
      ctx.lineTo(r * 0.9, -r * 0.4);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#63262d';
      ctx.fillRect(-r * 0.85, -r * 0.28, r * 1.7, r * 0.56);
      ctx.fillStyle = '#ff4b4b';
      ctx.fillRect(-r * 0.7, -r * 0.07, r * 1.35, r * 0.14);
      for (const gx of [r * 0.65, 0, -r * 0.62]) {
        ctx.fillStyle = '#7e343b';
        ctx.beginPath(); ctx.arc(gx, 0, r * 0.16, 0, TAU); ctx.fill();
      }
    } else {   // scout / frigate / escort
      const bulky = cls !== 'scout';
      ctx.fillStyle = bulky ? '#3a2026' : '#39232a'; ctx.strokeStyle = '#c25a55'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(r * 1.35, 0); ctx.lineTo(r * 0.1, r * 0.5);
      ctx.lineTo(-r * (bulky ? 0.9 : 0.75), r * (bulky ? 0.8 : 0.6));
      ctx.lineTo(-r * 0.45, 0);
      ctx.lineTo(-r * (bulky ? 0.9 : 0.75), -r * (bulky ? 0.8 : 0.6));
      ctx.lineTo(r * 0.1, -r * 0.5);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e0685f';
      ctx.beginPath();
      ctx.moveTo(r * 1.35, 0); ctx.lineTo(r * 0.1, r * 0.2); ctx.lineTo(r * 0.1, -r * 0.2);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawShip(S, sh, lerp) {
    const x = w2sx(sh.px + (sh.x - sh.px) * lerp);
    const y = w2sy(sh.py + (sh.y - sh.py) * lerp);
    const r = Math.max(7, sh.radius * scale * 1.7);

    if (!sh.alive) {   // wreck
      ctx.save(); ctx.translate(x, y); ctx.rotate(sh.face);
      ctx.globalAlpha = clamp(sh.wreckT / 6, 0, 0.85);
      ctx.fillStyle = '#15181d'; ctx.strokeStyle = '#3a3f47'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(r, 0); ctx.lineTo(-r * 0.4, r * 0.7); ctx.lineTo(-r * 0.8, -r * 0.3);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.globalAlpha = 1; ctx.restore();
      ctx.globalCompositeOperation = 'lighter';
      glow(x, y, r * 1.5, GLOW.orange, 0.06 + 0.05 * Math.sin(sh.wreckT * 7));
      ctx.globalCompositeOperation = 'source-over';
      if (Math.random() < 0.12)
        particles.push({ x: sh.x, y: sh.y, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20,
          life: 1.4, max: 1.4, kind: 'smoke', sz: 4 + Math.random() * 5 });
      return;
    }

    const spd = Math.hypot(sh.vx, sh.vy);
    const isPlayer = sh.cls === 'player';
    const ab = isPlayer && S.abOn;

    // engine glow behind hull (additive)
    ctx.globalCompositeOperation = 'lighter';
    if (spd > 12) {
      const ex = x - Math.cos(sh.face) * r * 0.95;
      const ey = y - Math.sin(sh.face) * r * 0.95;
      const eR = r * (0.7 + spd / 300) * (ab ? 1.8 : 1);
      glow(ex, ey, eR, isPlayer ? (ab ? GLOW.white : GLOW.cyan) : GLOW.orange, ab ? 0.95 : 0.6);
    }
    if (isPlayer) glow(x, y, r * 2.6, GLOW.blue, 0.10);
    else if (sh.cls === 'cruiser') glow(x, y, r * 2.6, GLOW.crimson, 0.14);
    else glow(x, y, r * 2.1, GLOW.red, 0.09);
    ctx.globalCompositeOperation = 'source-over';

    ctx.save(); ctx.translate(x, y); ctx.rotate(sh.face);
    shipPath(sh.cls, r);
    ctx.restore();

    // low-hull smoke
    if (sh.hull < sh.hullMax * 0.4 && Math.random() < 0.25)
      particles.push({ x: sh.x, y: sh.y, vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 0.5) * 30,
        life: 1, max: 1, kind: 'smoke', sz: 3 + Math.random() * 4 });
  }

  function updateTrails(S, lerp, dtF) {
    const now = performance.now() / 1000;
    for (const sh of S.ships) {
      if (!sh.alive) { trails.delete(sh.id); continue; }
      if (Math.hypot(sh.vx, sh.vy) < 25) continue;
      let tr = trails.get(sh.id);
      if (!tr) { tr = []; trails.set(sh.id, tr); }
      tr.push({ x: sh.px + (sh.x - sh.px) * lerp, y: sh.py + (sh.y - sh.py) * lerp, t: now });
      while (tr.length && now - tr[0].t > 0.5) tr.shift();
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const [id, tr] of trails) {
      if (tr.length < 2) continue;
      const sh = S.ships.find(s => s.id === id);
      const isP = sh && sh.cls === 'player';
      const ab = isP && S.abOn;
      for (let i = 1; i < tr.length; i++) {
        const a = i / tr.length;
        ctx.strokeStyle = isP
          ? (ab ? 'rgba(190,235,255,' + (a * 0.55).toFixed(3) + ')' : 'rgba(90,190,255,' + (a * 0.35).toFixed(3) + ')')
          : 'rgba(255,120,70,' + (a * 0.22).toFixed(3) + ')';
        ctx.lineWidth = a * (isP ? (ab ? 5 : 3.4) : 2.4) * scale * 2;
        ctx.beginPath();
        ctx.moveTo(w2sx(tr[i - 1].x), w2sy(tr[i - 1].y));
        ctx.lineTo(w2sx(tr[i].x), w2sy(tr[i].y));
        ctx.stroke();
      }
    }
    ctx.lineWidth = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------------- HUD ----------------
  function arc(cx, cy, r, w, from, sweep, col) {
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.arc(cx, cy, r, from, from + sweep); ctx.stroke();
  }

  function drawCapWheel(S) {
    const p = S.player;
    const cx = W / 2, cy = H - 96, start = Math.PI * 0.75, full = Math.PI * 1.5;
    ctx.globalAlpha = 0.9;
    // backdrop
    ctx.fillStyle = 'rgba(6,10,18,0.55)';
    ctx.beginPath(); ctx.arc(cx, cy, 66, 0, TAU); ctx.fill();
    // dim tracks
    arc(cx, cy, 52, 7, start, full, 'rgba(40,60,85,0.5)');
    arc(cx, cy, 43, 7, start, full, 'rgba(70,58,35,0.5)');
    arc(cx, cy, 34, 7, start, full, 'rgba(75,38,35,0.5)');
    // live arcs
    arc(cx, cy, 52, 7, start, full * clamp(p.shield / p.shieldMax, 0, 1), 'rgba(95,170,255,0.95)');
    arc(cx, cy, 43, 7, start, full * clamp(p.armor / p.armorMax, 0, 1), 'rgba(235,180,90,0.95)');
    arc(cx, cy, 34, 7, start, full * clamp(p.hull / p.hullMax, 0, 1), 'rgba(240,95,80,0.95)');
    // capacitor pips
    const pips = 16, fillN = Math.round(clamp(p.cap / p.capMax, 0, 1) * pips);
    const flash = S.capEmptyFlash > 0 && Math.floor(S.capEmptyFlash * 8) % 2 === 0;
    for (let i = 0; i < pips; i++) {
      const a0 = start + (i + 0.12) * (full / pips), a1 = start + (i + 0.88) * (full / pips);
      ctx.strokeStyle = i < fillN ? (flash ? 'rgba(255,120,60,0.95)' : 'rgba(255,215,120,0.95)')
                                  : 'rgba(60,55,40,0.6)';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(cx, cy, 24, a0, a1); ctx.stroke();
    }
    // speed
    ctx.fillStyle = '#cfe0f0'; ctx.font = 'bold 14px Consolas,monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(Math.round(Math.hypot(p.vx, p.vy))), cx, cy - 2);
    ctx.fillStyle = '#7d93a8'; ctx.font = '9px Consolas,monospace';
    ctx.fillText('m/s', cx, cy + 11);
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;

    // warnings
    let wy = cy - 92;
    const warn = (txt, col) => {
      ctx.fillStyle = col; ctx.font = 'bold 13px Consolas,monospace'; ctx.textAlign = 'center';
      if (Math.floor(performance.now() / 250) % 2 === 0) ctx.fillText(txt, cx, wy);
      wy -= 18;
    };
    if (S.capEmptyFlash > 0) warn('CAPACITOR EMPTY', '#ff8c5a');
    if (S.webbedBy.length) warn('WEBBED — SPEED REDUCED', '#5affc8');
    if (S.projectiles.some(pr => pr.kind === 'torp')) warn('TORPEDO INBOUND', '#ffb35a');
    if (S.abOn) {
      ctx.fillStyle = '#9fe0ff'; ctx.font = 'bold 10px Consolas,monospace'; ctx.textAlign = 'center';
      ctx.fillText('AFTERBURNER', cx, cy + 62);
    }
  }

  const overviewRows = [];

  function drawPanels(S) {
    const p = S.player;
    // target panel
    const tgt = S.ships.find(s => s.id === S.lockTargetId && s.alive);
    const tw = 250, tx = W - tw - 14;
    let panelBottom = 14;
    if (tgt) {
      const ty = 14;
      ctx.fillStyle = 'rgba(7,12,20,0.82)';
      ctx.fillRect(tx, ty, tw, 92);
      ctx.strokeStyle = S.locked ? 'rgba(235,85,70,0.9)' : 'rgba(240,200,90,0.7)';
      ctx.strokeRect(tx + 0.5, ty + 0.5, tw, 92);
      ctx.fillStyle = '#e6edf5'; ctx.font = 'bold 13px Consolas,monospace'; ctx.textAlign = 'left';
      ctx.fillText(tgt.name, tx + 10, ty + 18);
      const dist = Math.hypot(tgt.x - p.x, tgt.y - p.y);
      ctx.font = '11px Consolas,monospace';
      ctx.fillStyle = dist <= 520 ? '#8ee08e' : '#c8a468';
      ctx.fillText(Math.round(dist) + ' m' + (dist <= 520 ? '  IN RANGE' : '  out of range'), tx + 10, ty + 34);
      const bw2 = tw - 20;
      const mini = (yy, frac, col) => {
        ctx.fillStyle = 'rgba(22,30,42,0.9)'; ctx.fillRect(tx + 10, yy, bw2, 8);
        ctx.fillStyle = col; ctx.fillRect(tx + 10, yy, bw2 * clamp(frac, 0, 1), 8);
      };
      mini(ty + 42, tgt.shield / tgt.shieldMax, 'rgba(95,170,255,0.9)');
      mini(ty + 53, tgt.armor / tgt.armorMax, 'rgba(235,180,90,0.9)');
      mini(ty + 64, tgt.hull / tgt.hullMax, 'rgba(240,95,80,0.9)');
      ctx.fillStyle = S.locked ? '#ff6a5a' : '#f0c85a';
      ctx.font = 'bold 10px Consolas,monospace';
      ctx.fillText(S.locked ? '◈ LOCKED — TURRETS ENGAGING' :
        '◇ LOCKING… ' + Math.round(100 * S.lockProgress / S.lockNeed) + '%', tx + 10, ty + 84);
      panelBottom = ty + 104;
    }

    // overview
    overviewRows.length = 0;
    const hs = S.ships.filter(s => s.alive && s.faction === 'hostile')
      .sort((a, b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y));
    if (hs.length) {
      const oy = panelBottom;
      ctx.fillStyle = 'rgba(7,12,20,0.72)';
      ctx.fillRect(tx, oy, tw, 22 + hs.length * 18);
      ctx.strokeStyle = 'rgba(110,140,170,0.3)';
      ctx.strokeRect(tx + 0.5, oy + 0.5, tw, 22 + hs.length * 18);
      ctx.fillStyle = '#7d93a8'; ctx.font = 'bold 10px Consolas,monospace'; ctx.textAlign = 'left';
      ctx.fillText('OVERVIEW · ' + hs.length + ' hostile' + (hs.length > 1 ? 's' : '') + '   [Tab] cycle', tx + 8, oy + 15);
      hs.forEach((s, i) => {
        const ry = oy + 22 + i * 18;
        if (s.id === S.lockTargetId) {
          ctx.fillStyle = S.locked ? 'rgba(235,85,70,0.22)' : 'rgba(240,200,90,0.15)';
          ctx.fillRect(tx + 1, ry, tw - 2, 17);
        }
        ctx.fillStyle = s.cls === 'cruiser' ? '#ff7d70' : '#d8a0a0';
        ctx.font = '11px Consolas,monospace'; ctx.textAlign = 'left';
        ctx.fillText((s.cls === 'cruiser' ? '◆ ' : '▲ ') + s.name, tx + 8, ry + 13);
        ctx.fillStyle = '#8fa4b8'; ctx.textAlign = 'right';
        ctx.fillText(Math.round(Math.hypot(s.x - p.x, s.y - p.y)) + ' m', tx + tw - 8, ry + 13);
        overviewRows.push({ x: tx, y: ry, w: tw, h: 17, id: s.id });
      });
    }

    // top-left status + kill feed
    ctx.textAlign = 'left';
    ctx.fillStyle = '#8fa4b8'; ctx.font = 'bold 12px Consolas,monospace';
    ctx.fillText('WAVE ' + Math.min(S.wave, 3) + '/3', 16, 26);
    ctx.fillStyle = '#7d93a8'; ctx.font = '11px Consolas,monospace';
    ctx.fillText('KILLS ' + S.kills + '   ' + fmtTime(S.t), 16, 42);
    ctx.fillStyle = 'rgba(110,130,150,0.75)'; ctx.font = '10px Consolas,monospace';
    ctx.fillText('[WASD] thrust · [Shift] burn · [Tab/click] lock · [R] restart', 16, 58);
    let ky = 78;
    for (const k of killFeed) {
      ctx.globalAlpha = clamp(k.life, 0, 1);
      ctx.fillStyle = '#e08a7a'; ctx.font = '11px Consolas,monospace';
      ctx.fillText('✚ ' + k.txt, 16, ky);
      ky += 15;
    }
    ctx.globalAlpha = 1;
  }

  function drawRadar(S) {
    const p = S.player, R = 74, cx = W - R - 20, cy = H - R - 20, range = 2200;
    ctx.fillStyle = 'rgba(7,12,20,0.7)';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(110,140,170,0.35)';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(110,140,170,0.15)';
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.5, 0, TAU); ctx.stroke();
    const put = (wx, wy) => {
      const dx = (wx - p.x) / range * R, dy = (wy - p.y) / range * R;
      const d = Math.hypot(dx, dy);
      const k = d > R - 4 ? (R - 4) / d : 1;
      return [cx + dx * k, cy + dy * k];
    };
    for (const s of S.ships) {
      if (!s.alive || s.faction !== 'hostile') continue;
      const [bx, by] = put(s.x, s.y);
      ctx.fillStyle = s.id === S.lockTargetId ? '#ffdf80' : '#ff6a5a';
      if (s.cls === 'cruiser') ctx.fillRect(bx - 3, by - 3, 6, 6);
      else { ctx.beginPath(); ctx.arc(bx, by, 2.4, 0, TAU); ctx.fill(); }
    }
    for (const pr of S.projectiles) {
      if (pr.kind !== 'torp') continue;
      if (Math.floor(performance.now() / 160) % 2 === 0) continue;
      const [bx, by] = put(pr.x, pr.y);
      ctx.fillStyle = '#ffb35a';
      ctx.fillRect(bx - 1.5, by - 1.5, 3, 3);
    }
    ctx.fillStyle = '#bfe0ff';
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, TAU); ctx.fill();
    const sp = Math.hypot(p.vx, p.vy);
    if (sp > 20) {
      const a = Math.atan2(p.vy, p.vx);
      ctx.strokeStyle = 'rgba(190,225,255,0.7)';
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * 10, cy + Math.sin(a) * 10); ctx.stroke();
    }
  }

  function drawLockUI(S, lerp) {
    const tgt = S.ships.find(s => s.id === S.lockTargetId && s.alive);
    if (!tgt) return;
    const x = w2sx(tgt.px + (tgt.x - tgt.px) * lerp);
    const y = w2sy(tgt.py + (tgt.y - tgt.py) * lerp);
    const r = Math.max(16, tgt.radius * scale * 2.4);
    if (!S.locked) {
      ctx.strokeStyle = 'rgba(240,200,90,0.85)'; ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 5]);
      ctx.lineDashOffset = -performance.now() / 22;
      ctx.beginPath(); ctx.arc(x, y, r + 6, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(x, y, r + 12, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(S.lockProgress / S.lockNeed, 0, 1));
      ctx.stroke();
    } else {
      const pulse = 1 + lockPulse * 0.8;
      ctx.strokeStyle = 'rgba(235,85,70,' + (0.9 - lockPulse * 0.3).toFixed(2) + ')';
      ctx.lineWidth = 1.8;
      const rr2 = r * pulse, c = rr2 * 0.45;
      for (const [sx2, sy2] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        ctx.beginPath();
        ctx.moveTo(x + sx2 * rr2, y + sy2 * rr2 - sy2 * c);
        ctx.lineTo(x + sx2 * rr2, y + sy2 * rr2);
        ctx.lineTo(x + sx2 * rr2 - sx2 * c, y + sy2 * rr2);
        ctx.stroke();
      }
    }
    ctx.lineWidth = 1;
  }

  function drawOffscreen(S) {
    const p = S.player;
    for (const s of S.ships) {
      if (!s.alive || s.faction !== 'hostile') continue;
      const sx = w2sx(s.x), sy = w2sy(s.y);
      if (sx > -20 && sx < W + 20 && sy > -20 && sy < H + 20) continue;
      const ang = Math.atan2(s.y - p.y, s.x - p.x);
      const m = 30;
      const ax = clamp(sx, m, W - m), ay = clamp(sy, m, H - m);
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang);
      ctx.fillStyle = s.cls === 'cruiser' ? 'rgba(255,90,80,0.9)' : 'rgba(220,110,100,0.7)';
      ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, 6); ctx.lineTo(-6, -6);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function fmtTime(t) {
    const m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function overlay(S) {
    if (S.mode === 'intro') {
      ctx.fillStyle = 'rgba(2,4,9,0.55)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.save();
      ctx.shadowColor = 'rgba(100,180,255,0.9)'; ctx.shadowBlur = 30;
      ctx.fillStyle = '#eaf2fa'; ctx.font = 'bold 54px Consolas,monospace';
      ctx.fillText('CARBON SKIRMISH', W / 2, H * 0.36);
      ctx.restore();
      ctx.fillStyle = '#8fa4b8'; ctx.font = '14px Consolas,monospace';
      ctx.fillText('Destiny simulates. Trinity draws. You fly.', W / 2, H * 0.36 + 34);
      ctx.fillStyle = '#c3d2e0'; ctx.font = '13px Consolas,monospace';
      const ly = H * 0.36 + 78;
      const lines = [
        'WASD — thrust (you keep inertia; feather it)',
        'Shift — afterburner · burns capacitor · outruns torpedoes',
        'Tab or click — lock target · turrets fire on their own inside 520 m',
        'Speed is armor: fast transversal makes enemy turrets miss'
      ];
      lines.forEach((l, i) => ctx.fillText(l, W / 2, ly + i * 22));
      if (Math.floor(performance.now() / 500) % 2 === 0) {
        ctx.fillStyle = '#eaf2fa'; ctx.font = 'bold 16px Consolas,monospace';
        ctx.fillText('— press any key to warp in —', W / 2, ly + lines.length * 22 + 34);
      }
    } else if (S.mode === 'dead') {
      ctx.fillStyle = 'rgba(24,4,4,0.45)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.save();
      ctx.shadowColor = 'rgba(255,80,60,0.8)'; ctx.shadowBlur = 24;
      ctx.fillStyle = '#f5e0dc'; ctx.font = 'bold 40px Consolas,monospace';
      ctx.fillText('SHIP LOST', W / 2, H * 0.4);
      ctx.restore();
      ctx.fillStyle = '#c89898'; ctx.font = '13px Consolas,monospace';
      ctx.fillText('Your pod drifts among the wreckage. ' + S.kills + ' kills in ' + fmtTime(S.stats.endT) + '.', W / 2, H * 0.4 + 30);
      ctx.fillStyle = '#eaf2fa'; ctx.font = 'bold 14px Consolas,monospace';
      ctx.fillText('press R to refit and warp back', W / 2, H * 0.4 + 58);
    } else if (S.mode === 'victory') {
      ctx.fillStyle = 'rgba(3,14,8,0.4)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.save();
      ctx.shadowColor = 'rgba(120,255,180,0.8)'; ctx.shadowBlur = 24;
      ctx.fillStyle = '#e2f5e4'; ctx.font = 'bold 40px Consolas,monospace';
      ctx.fillText('SITE SECURED', W / 2, H * 0.4);
      ctx.restore();
      const acc = S.stats.shots ? Math.round(100 * S.stats.hits / S.stats.shots) : 0;
      ctx.fillStyle = '#9cc8a0'; ctx.font = '13px Consolas,monospace';
      ctx.fillText('The Sanguine Vesper is dust. ' + fmtTime(S.stats.endT) + ' · ' + S.kills + ' kills · ' + acc + '% turret accuracy', W / 2, H * 0.4 + 30);
      ctx.fillStyle = '#eaf2fa'; ctx.font = 'bold 14px Consolas,monospace';
      ctx.fillText('press R to fly it again', W / 2, H * 0.4 + 58);
    }
  }

  function render(lerp, evts) {
    handleEvents(evts);
    const S = Destiny.state();
    const p = S.player;
    const now = performance.now() / 1000;
    const dtF = clamp(now - lastFrame, 0.001, 0.05);
    lastFrame = now;

    // camera: lead ahead of velocity so motion reads instantly
    const ptx = p.px + (p.x - p.px) * lerp, pty = p.py + (p.y - p.py) * lerp;
    const lead = S.mode === 'play' || S.mode === 'dead' ? 0.55 : 0;
    cam.x += (ptx + p.vx * lead - cam.x) * (1 - Math.exp(-3.2 * dtF));
    cam.y += (pty + p.vy * lead - cam.y) * (1 - Math.exp(-3.2 * dtF));
    const zoomT = S.abOn ? 0.86 : 1;
    zoomK += (zoomT - zoomK) * (1 - Math.exp(-2.5 * dtF));
    scale = (H / 1350) * zoomK;

    if (shake > 0.3) {
      cam.x += (Math.random() - 0.5) * shake / scale * 0.35;
      cam.y += (Math.random() - 0.5) * shake / scale * 0.35;
      shake *= Math.exp(-6 * dtF);
    }
    if (lockPulse > 0) lockPulse = Math.max(0, lockPulse - dtF * 3);

    // ---------- space ----------
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const bg = ctx.createRadialGradient(W / 2, H / 2, H * 0.1, W / 2, H / 2, H);
    bg.addColorStop(0, '#0a1020'); bg.addColorStop(0.6, '#050810'); bg.addColorStop(1, '#02040a');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    // distant sun
    glow(w2sx(cam.x * 0.95 - 2600), w2sy(cam.y * 0.95 - 1500), 300 * scale + 120, GLOW.gold, 0.5);
    glow(w2sx(cam.x * 0.95 - 2600), w2sy(cam.y * 0.95 - 1500), 90 * scale + 40, GLOW.white, 0.9);
    // nebulae (deep parallax)
    for (const nb of nebulae) {
      const nx = (nb.x - cam.x * 0.07) * scale + W / 2;
      const ny = (nb.y - cam.y * 0.07) * scale + H / 2;
      glow(nx, ny, nb.r * scale, nb.img, nb.a);
    }
    ctx.globalCompositeOperation = 'source-over';

    // stars
    for (const st of stars) {
      const px = ((st.x - cam.x * st.z) % 6000 + 9000) % 6000 - 3000;
      const py = ((st.y - cam.y * st.z) % 6000 + 9000) % 6000 - 3000;
      const sx = px * scale + W / 2, sy = py * scale + H / 2;
      if (sx < -2 || sx > W + 2 || sy < -2 || sy > H + 2) continue;
      const tw = 0.75 + 0.25 * Math.sin(now * 2 + st.tw);
      ctx.fillStyle = 'rgba(195,210,230,' + (st.b * tw * 0.9).toFixed(2) + ')';
      const s2 = st.z > 0.6 ? 1.8 : st.z > 0.35 ? 1.3 : 1;
      ctx.fillRect(sx, sy, s2, s2);
    }

    // near-field dust — streaks with your velocity: THE motion cue
    const spd = Math.hypot(p.vx, p.vy);
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(170,200,235,0.4)';
    for (const d of dust) {
      // wrap dust into a box around the camera
      const bx2 = (W / scale) * 0.75, by2 = (H / scale) * 0.75;
      let dx = d.x - cam.x; dx = ((dx % (bx2 * 2)) + bx2 * 3) % (bx2 * 2) - bx2;
      let dy = d.y - cam.y; dy = ((dy % (by2 * 2)) + by2 * 3) % (by2 * 2) - by2;
      const sx = dx * scale + W / 2, sy = dy * scale + H / 2;
      const len = clamp(spd * 0.045, 0.8, 46) * scale;
      const a = spd > 30 ? Math.atan2(p.vy, p.vx) : 0;
      ctx.globalAlpha = clamp(0.12 + spd / 900, 0.12, 0.5);
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx - Math.cos(a) * len, sy - Math.sin(a) * len);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // asteroids
    for (const as of asteroids) {
      const ax = w2sx(as.x), ay = w2sy(as.y);
      const ar = as.r * scale;
      if (ax < -ar - 40 || ax > W + ar + 40 || ay < -ar - 40 || ay > H + ar + 40) continue;
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(as.rot + now * as.spin);
      ctx.fillStyle = '#191d24'; ctx.strokeStyle = '#333b47';
      ctx.beginPath();
      as.pts.forEach((k, i) => {
        const a = i / as.pts.length * TAU;
        const x2 = Math.cos(a) * ar * k, y2 = Math.sin(a) * ar * k;
        i === 0 ? ctx.moveTo(x2, y2) : ctx.lineTo(x2, y2);
      });
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    // derelict relay
    {
      const bx3 = w2sx(-380), by3 = w2sy(-260);
      ctx.strokeStyle = 'rgba(90,110,135,0.55)';
      ctx.beginPath(); ctx.arc(bx3, by3, 30 * scale, 0, TAU); ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        const a = i * 2.09 + 0.5;
        ctx.moveTo(bx3, by3);
        ctx.lineTo(bx3 + Math.cos(a) * 52 * scale, by3 + Math.sin(a) * 52 * scale);
      }
      ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      glow(bx3, by3, 10 * scale + 4, GLOW.teal, 0.4 + 0.4 * Math.sin(now * 2.2));
      ctx.globalCompositeOperation = 'source-over';
    }

    // ---------- world actors ----------
    updateTrails(S, lerp, dtF);

    // webifier beams
    if (S.webbedBy.length && p.alive) {
      ctx.globalCompositeOperation = 'lighter';
      for (const id of S.webbedBy) {
        const h = S.ships.find(s => s.id === id && s.alive);
        if (!h) continue;
        const x1 = w2sx(h.x), y1 = w2sy(h.y), x2 = w2sx(ptx), y2 = w2sy(pty);
        ctx.strokeStyle = 'rgba(90,255,200,' + (0.35 + 0.25 * Math.sin(now * 30)).toFixed(2) + ')';
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(x1, y1);
        const segs = 7;
        for (let i = 1; i <= segs; i++) {
          const t = i / segs;
          const jx = (Math.random() - 0.5) * 10 * (i < segs ? 1 : 0);
          const jy = (Math.random() - 0.5) * 10 * (i < segs ? 1 : 0);
          ctx.lineTo(x1 + (x2 - x1) * t + jx, y1 + (y2 - y1) * t + jy);
        }
        ctx.stroke();
        glow(x1, y1, 12, GLOW.teal, 0.5);
      }
      ctx.lineWidth = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // projectiles
    ctx.globalCompositeOperation = 'lighter';
    for (const pr of S.projectiles) {
      const x = w2sx(pr.px + (pr.x - pr.px) * lerp), y = w2sy(pr.py + (pr.y - pr.py) * lerp);
      if (pr.kind === 'torp') {
        glow(x, y, 14, GLOW.orange, 0.9);
        ctx.fillStyle = '#ffe9c8';
        ctx.beginPath(); ctx.arc(x, y, 2.6, 0, TAU); ctx.fill();
        if (Math.random() < 0.6)
          particles.push({ x: pr.x, y: pr.y, vx: (Math.random() - 0.5) * 25, vy: (Math.random() - 0.5) * 25,
            life: 0.5, max: 0.5, kind: 'smoke', sz: 3.5 });
      } else {
        const l = 0.016;
        ctx.strokeStyle = pr.hostileShot ? 'rgba(255,105,80,0.95)' : 'rgba(255,238,180,0.95)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - pr.vx * l * scale, y - pr.vy * l * scale);
        ctx.stroke();
        glow(x, y, 5, pr.hostileShot ? GLOW.red : GLOW.gold, 0.5);
      }
    }
    ctx.lineWidth = 1;
    ctx.globalCompositeOperation = 'source-over';

    // ships & wrecks
    for (const sh of S.ships) drawShip(S, sh, lerp);

    // ---------- transient FX ----------
    for (const pd of pending) pd.t -= dtF;
    pending = pending.filter(pd => { if (pd.t <= 0) { addBoom(pd.x, pd.y, pd.r, pd.big); return false; } return true; });

    ctx.globalCompositeOperation = 'lighter';
    particles = particles.filter(pt => (pt.life -= dtF) > 0);
    for (const pt of particles) {
      pt.x += pt.vx * dtF; pt.y += pt.vy * dtF;
      const a = clamp(pt.life / pt.max, 0, 1);
      const x = w2sx(pt.x), y = w2sy(pt.y);
      if (pt.kind === 'fire') {
        glow(x, y, pt.sz * scale * 3.5, a > 0.6 ? GLOW.gold : GLOW.orange, a * 0.9);
      } else if (pt.kind === 'spark') {
        glow(x, y, pt.sz * scale * 2.5, GLOW.orange, a);
      } else if (pt.kind === 'shieldspark') {
        glow(x, y, pt.sz * scale * 2.5, GLOW.cyan, a);
      } else if (pt.kind === 'debris') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.save(); ctx.translate(x, y); ctx.rotate(pt.rot += pt.spin * dtF);
        ctx.fillStyle = 'rgba(70,62,58,' + a.toFixed(2) + ')';
        const s3 = pt.sz * scale;
        ctx.beginPath(); ctx.moveTo(s3, 0); ctx.lineTo(-s3 * 0.6, s3 * 0.7); ctx.lineTo(-s3 * 0.4, -s3 * 0.6);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        ctx.globalCompositeOperation = 'lighter';
      } else { // smoke
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(40,44,52,' + (a * 0.4).toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(x, y, pt.sz * scale * (1.6 - a * 0.6), 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = 'lighter';
      }
    }
    // shockwave rings
    rings = rings.filter(rg => (rg.t += dtF) < rg.life);
    for (const rg of rings) {
      const k = rg.t / rg.life;
      const rr3 = (rg.r + (rg.max - rg.r) * (1 - Math.pow(1 - k, 2.2))) * scale;
      ctx.strokeStyle = rg.shield ? 'rgba(110,190,255,' + (0.7 * (1 - k)).toFixed(2) + ')'
        : rg.warp ? 'rgba(200,230,255,' + (0.8 * (1 - k)).toFixed(2) + ')'
        : 'rgba(255,190,120,' + (0.75 * (1 - k)).toFixed(2) + ')';
      ctx.lineWidth = rg.shield ? 1.5 : 2.5 * (1 - k) + 0.5;
      ctx.beginPath(); ctx.arc(w2sx(rg.x), w2sy(rg.y), rr3, 0, TAU); ctx.stroke();
    }
    ctx.lineWidth = 1;
    // flashes
    flashes = flashes.filter(f => (f.life -= dtF) > 0);
    for (const f of flashes)
      glow(w2sx(f.x), w2sy(f.y), f.r * scale, f.img, f.life / f.max);
    ctx.globalCompositeOperation = 'source-over';

    // floating text
    floaters = floaters.filter(f => (f.life -= dtF) > 0);
    for (const f of floaters) {
      f.y -= 34 * dtF;
      ctx.globalAlpha = clamp(f.life * 2, 0, 1);
      ctx.fillStyle = f.col; ctx.font = 'bold 12px Consolas,monospace'; ctx.textAlign = 'center';
      ctx.fillText(f.txt, w2sx(f.x), w2sy(f.y));
    }
    ctx.globalAlpha = 1;

    drawLockUI(S, lerp);
    drawOffscreen(S);

    // turret range ring
    if (S.mode === 'play' && p.alive) {
      ctx.strokeStyle = 'rgba(90,140,190,0.13)';
      ctx.setLineDash([3, 7]);
      ctx.beginPath(); ctx.arc(w2sx(ptx), w2sy(pty), 520 * scale, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }

    // damage vignette
    if (redFlash > 0.01) {
      const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.75);
      vg.addColorStop(0, 'rgba(180,30,20,0)');
      vg.addColorStop(1, 'rgba(180,30,20,' + (redFlash * 0.8).toFixed(2) + ')');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
      redFlash *= Math.exp(-3.5 * dtF);
    }
    // low hull heartbeat
    if (p.alive && p.hull < p.hullMax * 0.3) {
      const beat = 0.5 + 0.5 * Math.sin(now * 6);
      const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.8);
      vg.addColorStop(0, 'rgba(160,20,15,0)');
      vg.addColorStop(1, 'rgba(160,20,15,' + (0.18 * beat).toFixed(2) + ')');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    }

    // kill feed decay
    for (const k of killFeed) k.life -= dtF;
    killFeed = killFeed.filter(k => k.life > 0);

    // banner
    if (banner) {
      banner.life -= dtF;
      if (banner.life <= 0) banner = null;
      else {
        const a = clamp(Math.min(banner.life, 4.5 - banner.life) / 0.5, 0, 1);
        ctx.globalAlpha = a;
        ctx.save();
        ctx.shadowColor = 'rgba(120,180,255,0.7)'; ctx.shadowBlur = 18;
        ctx.fillStyle = '#e8eef5'; ctx.font = 'bold 30px Consolas,monospace'; ctx.textAlign = 'center';
        ctx.fillText(banner.text, W / 2, H * 0.22);
        ctx.restore();
        if (banner.sub) {
          ctx.fillStyle = '#93a8bd'; ctx.font = '13px Consolas,monospace'; ctx.textAlign = 'center';
          ctx.fillText(banner.sub, W / 2, H * 0.22 + 26);
        }
        ctx.globalAlpha = 1;
      }
    }

    if (S.mode === 'play' || S.mode === 'dead') {
      if (p.alive) drawCapWheel(S);
      drawPanels(S);
      drawRadar(S);
    }
    overlay(S);
  }

  return {
    render,
    screenToWorld: (x, y) => ({ x: (x - W / 2) / scale + cam.x, y: (y - H / 2) / scale + cam.y }),
    overviewHit: (x, y) => {
      for (const r of overviewRows)
        if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r.id;
      return null;
    }
  };
})();

/* =====================================================================
   AURA — WebAudio, driven by sim events
   ===================================================================== */
const Aura = (() => {
  let ac = null, master = null, noiseBuf = null, abGain = null;

  function ensure() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
        const len = ac.sampleRate;
        noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        // ambient drone
        const o1 = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
        o1.frequency.value = 55; o2.frequency.value = 55.7;
        o1.type = 'sine'; o2.type = 'sine';
        g.gain.value = 0.02;
        o1.connect(g); o2.connect(g); g.connect(master);
        o1.start(); o2.start();
        // afterburner noise loop
        const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.7;
        abGain = ac.createGain(); abGain.gain.value = 0;
        src.connect(bp); bp.connect(abGain); abGain.connect(master);
        src.start();
      } catch (e) {}
    }
    if (ac && ac.state === 'suspended') ac.resume();
  }

  function blip(freq, dur, type, vol, slide) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(ac.currentTime + dur);
  }

  function noise(dur, vol, freq, slide) {
    if (!ac) return;
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) f.frequency.exponentialRampToValueAtTime(Math.max(30, slide), ac.currentTime + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(); src.stop(ac.currentTime + dur);
  }

  function handle(evts) {
    if (!ac) return;
    for (const e of evts) {
      switch (e.type) {
        case 'muzzle': if (e.player) { blip(600, 0.08, 'square', 0.045, 200); noise(0.05, 0.03, 3500, 800); } break;
        case 'hit': e.layer === 'shield' ? blip(950, 0.07, 'triangle', 0.04, 500) : noise(0.12, 0.06, 900, 200); break;
        case 'boom': noise(e.big ? 1.4 : 0.6, e.big ? 0.5 : 0.3, 900, 50); blip(70, e.big ? 1 : 0.5, 'sine', 0.2, 28); break;
        case 'torpboom': if (!e.fizzle) { noise(0.8, 0.4, 700, 40); blip(60, 0.7, 'sine', 0.25, 25); } break;
        case 'torplaunch': noise(0.4, 0.1, 500, 1800); break;
        case 'torpwarn': blip(880, 0.1, 'sine', 0.05); break;
        case 'lock': blip(1150, 0.09, 'sine', 0.07); blip(1450, 0.12, 'sine', 0.06); break;
        case 'webbed': blip(220, 0.35, 'sawtooth', 0.05, 90); break;
        case 'warpin': noise(0.45, 0.18, 300, 4200); break;
        case 'kill': blip(500, 0.15, 'triangle', 0.05, 700); break;
        case 'banner': blip(340, 0.25, 'sine', 0.05, 420); break;
      }
    }
  }

  function update(S) {
    if (!ac || !abGain) return;
    const target = S.abOn ? 0.06 : 0;
    abGain.gain.setTargetAtTime(target, ac.currentTime, 0.08);
  }

  return { ensure, handle, update };
})();

/* =====================================================================
   Input + main loop (glue)
   ===================================================================== */
const Input = (() => {
  const held = new Set();
  let tab = false, restart = false, anyKey = false, click = null;
  const ALIAS = { arrowup: 'w', arrowdown: 's', arrowleft: 'a', arrowright: 'd', z: 'w', q: 'a' };

  window.addEventListener('keydown', e => {
    if (e.key === 'Tab' || e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
    if (e.repeat) return;
    Aura.ensure();
    anyKey = true;
    let k = e.key.toLowerCase();
    if (ALIAS[k]) k = ALIAS[k];
    held.add(k);
    if (e.key === 'Tab') tab = true;
    if (k === 'r') restart = true;
  });
  window.addEventListener('keyup', e => {
    let k = e.key.toLowerCase();
    if (ALIAS[k]) k = ALIAS[k];
    held.delete(k);
  });
  window.addEventListener('blur', () => held.clear());

  document.getElementById('cv').addEventListener('mousedown', e => {
    Aura.ensure();
    anyKey = true;
    const rect = e.target.getBoundingClientRect();
    click = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  });

  function consume() {
    let tx = 0, ty = 0;
    if (held.has('w')) ty -= 1;
    if (held.has('s')) ty += 1;
    if (held.has('a')) tx -= 1;
    if (held.has('d')) tx += 1;
    const cmd = {
      thrustX: tx, thrustY: ty,
      ab: held.has('shift'),
      tab, restart, anyKey,
      clickWorld: null, lockId: null
    };
    if (click) {
      const id = Trinity.overviewHit(click.x, click.y);
      if (id != null) cmd.lockId = id;
      else cmd.clickWorld = Trinity.screenToWorld(click.x, click.y);
    }
    tab = false; restart = false; anyKey = false; click = null;
    return cmd;
  }
  return { consume };
})();

(function main() {
  let last = performance.now() / 1000, acc = 0;
  function frame() {
    const now = performance.now() / 1000;
    acc += Math.min(now - last, 0.25);
    last = now;
    const evts = [];
    while (acc >= TICK) {
      Destiny.tick(Input.consume());
      evts.push(...Destiny.drainEvents());
      acc -= TICK;
    }
    Aura.handle(evts);
    Aura.update(Destiny.state());
    Trinity.render(acc / TICK, evts);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

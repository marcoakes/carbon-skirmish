<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CARBON SKIRMISH</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#020409;overflow:hidden;height:100%}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
"use strict";
/* =====================================================================
   CARBON SKIRMISH v8 — FLEET COMMAND
   A structural homage to CCP's open-sourced Carbon engine.
   You fly a space battleship in the spirit of the Yamato — complete
   with a Wave Motion Gun — and you are the FC of a five-ship wing.
   Your fleet shoots what you lock. Primary the logi. o7

   - Destiny : deterministic fixed-tick world simulation. Physics, AI,
               ballistics (transversal tracking!), webifiers, torpedoes,
               target locks, waves. The only writer of state.
   - Trinity : rendering layer. Reads sim state, never writes it.
               Procedural nebulae + planet, pre-rendered ship sprites,
               additive lighting, full-scene bloom, film grain.
   - Aura    : WebAudio. Driven by sim events.

   Zero dependencies. One file.
   ===================================================================== */

const TICK = 1 / 60;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* =====================================================================
   DESTINY — simulation
   ===================================================================== */
const Destiny = (() => {

  function mulberry32(seed) {
    let s = seed | 0;
    return function () {
      s = s + 0x6D2B79F5 | 0;
      let t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  let rng = mulberry32(0xC0FFEE);
  const rr = (a, b) => a + (b - a) * rng();

  /* metres, m/s, seconds. track = turret tracking in rad/s: your hit
     chance collapses as the target's angular velocity beats it. */
  const CLS = {
    player:  { radius: 13, speed: 240, abSpeed: 430, inertia: 2.2, turnRate: 2.4,
               shield: 330, sregen: 8, armor: 300, hull: 260,
               cap: 130, cregen: 8.5, abDrain: 15,
               gunDmg: 12, gunRof: 0.4, gunRange: 520, gunCost: 3,
               pspeed: 1200, track: 1.6,
               wmgDmg: 1300, wmgRange: 2600, wmgWidth: 80, wmgCharge: 2.6, wmgCd: 45, wmgDur: 0.75,
               mslDmg: 90, mslSpeed: 480, mslTurn: 2.5, mslCd: 1.2, mslLife: 9 },
    scout:   { radius: 9, speed: 265, orbit: 310, inertia: 3.2,
               shield: 35, sregen: 1.5, armor: 30, hull: 30,
               gunDmg: 5, gunRof: 1.1, gunRange: 470, pspeed: 900, track: 2.6,
               lock: 1.4, jink: 0.6, label: 'Blood Raider Scout' },
    frigate: { radius: 12, speed: 230, orbit: 250, inertia: 2.0,
               shield: 90, sregen: 2, armor: 100, hull: 75,
               gunDmg: 10, gunRof: 1.5, gunRange: 520, pspeed: 950, track: 1.7,
               web: 260, lock: 2.2, label: 'Blood Raider Webifier' },
    escort:  { radius: 12, speed: 240, orbit: 270, inertia: 2.0,
               shield: 110, sregen: 2.4, armor: 120, hull: 90,
               gunDmg: 11, gunRof: 1.4, gunRange: 540, pspeed: 950, track: 1.8,
               web: 260, lock: 2.4, label: 'Vesper Escort' },
    // ---- your fleet ----
    tackle:  { radius: 10, speed: 300, orbit: 200, inertia: 3.0,
               shield: 60, sregen: 2.5, armor: 50, hull: 45,
               gunDmg: 4, gunRof: 1.2, gunRange: 420, pspeed: 900, track: 2.4,
               web: 240, label: 'tackle' },
    dps:     { radius: 12, speed: 250, orbit: 350, inertia: 2.2,
               shield: 90, sregen: 2.2, armor: 90, hull: 80,
               gunDmg: 9, gunRof: 0.8, gunRange: 520, pspeed: 1000, track: 1.7, label: 'destroyer' },
    logi:    { radius: 14, speed: 230, orbit: 380, inertia: 1.8,
               shield: 140, sregen: 3.5, armor: 120, hull: 100,
               repRate: 28, repRange: 560, label: 'logistics' },
    // ---- their logistics ----
    hlogi:   { radius: 13, speed: 220, orbit: 700, inertia: 1.6,
               shield: 120, sregen: 3, armor: 110, hull: 90,
               repRate: 30, repRange: 700, lock: 2.2, label: 'Blood Raider Mender' },
    cruiser: { radius: 30, speed: 90, orbit: 620, inertia: 0.7,
               shield: 560, sregen: 5, armor: 520, hull: 480,
               gunDmg: 30, gunRof: 2.6, gunRange: 920, pspeed: 800, track: 0.5,
               torpRof: 7, torpDmg: 55, torpSpeed: 310, torpTurn: 1.3,
               torpLife: 14, torpDet: 26,
               lock: 4.5, label: 'Sanguine Vesper' }
  };

  const WAVES = [
    { banner: 'WAVE 1 — SCOUT PICKET',
      sub: 'Call targets — your fleet shoots what you lock.',
      ships: [['scout'], ['scout'], ['scout'], ['scout']] },
    { banner: 'WAVE 2 — FRIGATE RESPONSE',
      sub: 'They brought a Mender. Kill the logistics FIRST.',
      ships: [['frigate'], ['frigate'], ['frigate'], ['scout'], ['scout'], ['hlogi']] },
    { banner: 'WAVE 3 — THE SANGUINE VESPER',
      sub: 'A Mender is keeping her alive. Primary the logi, then get under her guns.',
      ships: [['cruiser', 'Sanguine Vesper'], ['escort'], ['escort'], ['hlogi'], ['scout'], ['scout']] }
  ];

  const FLEET = [['tackle', 'Talon'], ['tackle', 'Grip'], ['dps', 'Hammer'], ['dps', 'Anvil'], ['logi', 'Mercy']];
  const ORDERS = ['focus', 'defend', 'free', 'regroup'];

  // salvaged fittings, drafted between waves — stackable
  const MODS = [
    { id: 'track', name: 'Tracking Computer', desc: '+25% turret tracking' },
    { id: 'gun', name: 'Gyrostabilizer', desc: '+15% turret damage' },
    { id: 'rep', name: 'Armor Repairer', desc: '+3 armor/s passive repair' },
    { id: 'cap', name: 'Cap Battery', desc: '+30% capacitor regen' },
    { id: 'speed', name: 'Overdrive Injector', desc: '+12% max speed' },
    { id: 'msl', name: 'Expanded Missile Bay', desc: '+2 missile rack (and +2 now)' },
    { id: 'wmg', name: 'WMG Condenser', desc: 'Wave Motion Gun cooldown −10s' },
    { id: 'lock', name: 'Sensor Booster', desc: 'Target locks 35% faster' }
  ];

  let S = null;
  let nextId = 1;

  function makeShip(cls, name, x, y) {
    const d = CLS[cls];
    return {
      id: nextId++, cls, name: name || d.label || cls,
      faction: cls === 'player' ? 'player' : 'hostile',
      x, y, px: x, py: y, vx: 0, vy: 0,
      face: cls === 'player' ? -Math.PI / 2 : Math.atan2(-y, -x),
      radius: d.radius,
      shield: d.shield, shieldMax: d.shield,
      armor: d.armor, armorMax: d.armor,
      hull: d.hull, hullMax: d.hull,
      cap: d.cap || 0, capMax: d.cap || 0,
      gunCd: rr(0.4, (d.gunRof || 1) + 0.4), torpCd: 3,
      msl: cls === 'player' ? 6 : 0, mslCd: 0,
      bossPhase: 0, lance: null, lanceCd: 0, lanceTick: 0,
      wing: false, aimId: null, aimT: 0, webbedT: 0, repTargetId: null, webbingId: null,
      orbitDir: rng() < 0.5 ? 1 : -1, muzzle: 1,
      alive: true, wreck: false, wreckT: 0, spin: 0
    };
  }

  function reset() {
    rng = mulberry32(0xC0FFEE);      // same seed every run: the site is deterministic
    nextId = 1;
    S = {
      mode: 'intro', t: 0,
      player: null, ships: [], projectiles: [], events: [],
      wave: 0, waveDelay: 0, kills: 0,
      lockTargetId: null, lockProgress: 0, locked: false, lockNeed: 0,
      abOn: false, capEmptyFlash: 0,
      webbedBy: [], wasWebbed: false, torpWarnT: 0,
      paused: false, clearedAnnounced: 0, waveStartT: 0, deathInfo: null,
      wmg: { charge: 0, charging: false, cd: 0 },
      beamT: 0, beamTickN: 0,
      pickups: [], score: 0, combo: 0, comboT: 0,
      overtime: false, otWave: 0, otCleared: 0, waveHullStart: 260,
      fleetOrder: 'focus', fleetLost: [], waveWingLost: false,
      mods: {}, draft: null, killsBy: {}, heatOn: false, heatUsed: false, wmgCdMax: 45,
      stats: { shots: 0, hits: 0, endT: 0 }
    };
    S.player = makeShip('player', 'Your Ship', 0, 0);
    S.ships.push(S.player);
  }

  function spawnWave(i) {
    const w = WAVES[i];
    S.waveStartT = S.t;
    const baseAng = rr(0, TAU);
    w.ships.forEach((spec, k) => {
      const ang = baseAng + k * (TAU / w.ships.length) + rr(-0.35, 0.35);
      const dist = rr(1050, 1400);
      const sh = makeShip(spec[0], spec[1],
        S.player.x + Math.cos(ang) * dist,
        S.player.y + Math.sin(ang) * dist);
      // arrive out of warp with velocity toward the fight
      sh.vx = -Math.cos(ang) * 220; sh.vy = -Math.sin(ang) * 220;
      S.ships.push(sh);
      S.events.push({ type: 'warpin', x: sh.x, y: sh.y, ang: ang + Math.PI, big: spec[0] === 'cruiser' });
    });
    S.events.push({ type: 'banner', text: w.banner, sub: w.sub });
  }

  const hostiles = () => S.ships.filter(s => s.alive && s.faction === 'hostile');
  const friendlies = () => S.ships.filter(s => s.alive && s.faction === 'player');

  function spawnWing(role, name) {
    const ang = rr(0, TAU);
    const sh = makeShip(role, name,
      S.player.x + Math.cos(ang) * rr(120, 220), S.player.y + Math.sin(ang) * rr(120, 220));
    sh.faction = 'player';
    sh.wing = true;
    S.ships.push(sh);
    S.events.push({ type: 'warpin', x: sh.x, y: sh.y, ang: ang + Math.PI, big: false });
    return sh;
  }
  function spawnFleet() { for (const [r, n] of FLEET) spawnWing(r, n); }

  // sticky enemy target selection: nearest friendly, mild bias toward the FC
  function pickAim(sh) {
    const cur = S.ships.find(s => s.id === sh.aimId && s.alive && s.faction === 'player');
    sh.aimT -= TICK;
    if (cur && sh.aimT > 0) return cur;
    sh.aimT = 3 + rng() * 2;
    let best = null, bd = Infinity;
    for (const f of friendlies()) {
      let dd = Math.hypot(f.x - sh.x, f.y - sh.y);
      if (f === S.player) dd *= 0.85;
      if (dd < bd) { bd = dd; best = f; }
    }
    sh.aimId = best ? best.id : null;
    return best;
  }

  function orbitMove(sh, t, orbit, d) {
    const rx = t.x - sh.x, ry = t.y - sh.y;
    const dist = Math.hypot(rx, ry) || 1;
    const nx = rx / dist, ny = ry / dist;
    const tx = -ny * sh.orbitDir, ty = nx * sh.orbitDir;
    let dx, dy;
    if (dist > orbit * 1.25)      { dx = nx * 0.9 + tx * 0.3;  dy = ny * 0.9 + ty * 0.3; }
    else if (dist < orbit * 0.75) { dx = -nx * 0.6 + tx * 0.8; dy = -ny * 0.6 + ty * 0.8; }
    else                          { dx = tx + nx * 0.05;       dy = ty + ny * 0.05; }
    if (d.jink) {
      const j = Math.sin(S.t * 2.6 + sh.id * 2.1) * d.jink;
      const c = Math.cos(j), s2 = Math.sin(j);
      const ndx = dx * c - dy * s2, ndy = dx * s2 + dy * c;
      dx = ndx; dy = ndy;
    }
    const l = Math.hypot(dx, dy) || 1;
    steer(sh, dx / l, dy / l, d.speed * (sh.webbedT > 0 ? 0.5 : 1), d.inertia);
  }

  // logistics: repair the most damaged friend in range (shield first, then armor)
  function tickRepair(sh, d, friends) {
    sh.repTargetId = null;
    let best = null, bestFrac = 0.999;
    for (const f of friends) {
      if (!f.alive || f === sh) continue;
      if (Math.hypot(f.x - sh.x, f.y - sh.y) > d.repRange) continue;
      const frac = (f.shield + f.armor + f.hull) / (f.shieldMax + f.armorMax + f.hullMax);
      if (frac < bestFrac) { bestFrac = frac; best = f; }
    }
    if (best) {
      sh.repTargetId = best.id;
      if (best.shield < best.shieldMax) best.shield = Math.min(best.shieldMax, best.shield + d.repRate * TICK);
      else best.armor = Math.min(best.armorMax, best.armor + d.repRate * TICK);
    }
  }

  const modN = id => S.mods[id] || 0;
  const mslMax = () => 8 + 2 * modN('msl');

  function offerDraft() {
    const pool = MODS.slice();
    S.draft = [];
    for (let i = 0; i < 3; i++)
      S.draft.push(pool.splice((rng() * pool.length) | 0, 1)[0]);
    S.events.push({ type: 'draftoffer' });
  }

  function pickDraft(i) {
    const m = S.draft && S.draft[i];
    if (!m) return;
    S.mods[m.id] = (S.mods[m.id] || 0) + 1;
    if (m.id === 'msl') S.player.msl = Math.min(mslMax(), S.player.msl + 2);
    S.draft = null;
    S.events.push({ type: 'fitted', name: m.name });
  }

  function applyDamage(sh, dmg, srcCls, srcName) {
    let left = dmg, layer = 'hull';
    if (sh.shield > 0.5) layer = 'shield';
    else if (sh.armor > 0.5) layer = 'armor';
    if (sh.shield > 0) { const d = Math.min(sh.shield, left); sh.shield -= d; left -= d; }
    if (left > 0 && sh.armor > 0) { const d = Math.min(sh.armor, left); sh.armor -= d; left -= d; }
    if (left > 0) sh.hull -= left;
    S.events.push({ type: 'dmg', x: sh.x, y: sh.y - sh.radius - 8, amount: dmg, layer, target: sh.id });
    S.events.push({ type: 'hit', x: sh.x, y: sh.y, r: sh.radius, layer, player: sh === S.player, target: sh.id });
    if (sh.hull <= 0 && sh.alive) {
      sh.alive = false; sh.wreck = true; sh.wreckT = 22;
      sh.vx *= 0.25; sh.vy *= 0.25; sh.spin = rr(-1.2, 1.2);
      S.events.push({ type: 'boom', x: sh.x, y: sh.y, r: sh.radius, big: sh.cls === 'cruiser' });
      if (sh.faction === 'hostile') {
        S.kills++;
        const credit = srcName ? (srcName === 'Your Ship' ? 'FC' : srcName) : 'FC';
        S.killsBy[credit] = (S.killsBy[credit] || 0) + 1;
        // score, with a 6-second kill-chain multiplier
        const base = { scout: 100, frigate: 250, escort: 300, cruiser: 1500 }[sh.cls] || 100;
        S.combo = S.comboT > 0 ? S.combo + 1 : 1;
        S.comboT = 6;
        const pts = base * S.combo;
        S.score += pts;
        S.events.push({ type: 'kill', name: sh.name, combo: S.combo });
        S.events.push({ type: 'score', x: sh.x, y: sh.y - sh.radius - 24, pts, combo: S.combo });
        // wrecks drop salvage worth flying into the fight for
        if (rng() < 0.55) {
          const roll = rng();
          S.pickups.push({
            type: roll < 0.3 ? 'cap' : roll < 0.62 ? 'armor' : roll < 0.84 ? 'ammo' : 'wmg',
            x: sh.x, y: sh.y, px: sh.x, py: sh.y,
            vx: sh.vx * 0.3 + rr(-15, 15), vy: sh.vy * 0.3 + rr(-15, 15),
            life: 12
          });
        }
      }
      if (sh === S.player) {
        S.mode = 'dead'; S.stats.endT = S.t;
        S.deathInfo = { webbed: S.webbedBy.length > 0, src: srcCls || 'gun' };
      } else if (sh.faction === 'player') {
        S.fleetLost.push([sh.cls, sh.name]);
        S.waveWingLost = true;
        S.events.push({ type: 'wingdown', name: sh.name });
      }
      if (S.lockTargetId === sh.id) { S.lockTargetId = null; S.locked = false; S.lockProgress = 0; }
    }
  }

  function interceptAngle(sx, sy, t, pSpeed) {
    const rx = t.x - sx, ry = t.y - sy;
    const a = t.vx * t.vx + t.vy * t.vy - pSpeed * pSpeed;
    const b = 2 * (rx * t.vx + ry * t.vy);
    const c = rx * rx + ry * ry;
    let tt = 0;
    if (Math.abs(a) < 1e-6) { if (Math.abs(b) > 1e-6) tt = -c / b; }
    else {
      const disc = b * b - 4 * a * c;
      if (disc >= 0) {
        const sq = Math.sqrt(disc);
        const t1 = (-b - sq) / (2 * a), t2 = (-b + sq) / (2 * a);
        tt = Math.min(t1, t2) > 0 ? Math.min(t1, t2) : Math.max(t1, t2);
      }
    }
    if (!(tt > 0) || tt > 8) tt = 0;
    return Math.atan2(ry + t.vy * tt, rx + t.vx * tt);
  }

  /* EVE-style turret tracking: hit chance falls as the target's angular
     velocity (transversal / distance) exceeds the gun's tracking speed. */
  function rollHit(shooter, target, track) {
    const dx = target.x - shooter.x, dy = target.y - shooter.y;
    const d = Math.max(Math.hypot(dx, dy), 40);
    const nx = dx / d, ny = dy / d;
    const rvx = target.vx - shooter.vx, rvy = target.vy - shooter.vy;
    const transversal = Math.abs(rvx * ny - rvy * nx);
    const angular = transversal / d;
    const chance = clamp(1 - angular / track, 0.08, 0.95);
    return { hit: rng() < chance, chance };
  }

  function fire(sh, target, dmg, speed, range, track) {
    const roll = rollHit(sh, target, track);
    let ang = interceptAngle(sh.x, sh.y, target, speed);
    if (!roll.hit) ang += rr(0.05, 0.13) * (rng() < 0.5 ? 1 : -1);
    else ang += rr(-0.012, 0.012);
    const mx = sh.x + Math.cos(ang) * (sh.radius + 5);
    const my = sh.y + Math.sin(ang) * (sh.radius + 5);
    const dist = Math.hypot(target.x - sh.x, target.y - sh.y);
    S.projectiles.push({
      kind: 'shot',
      x: mx, y: my, px: mx, py: my,
      vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
      dmg, faction: sh.faction, life: range / speed + 0.7,
      hostileShot: sh.faction === 'hostile', srcCls: sh.cls, srcName: sh.name,
      willHit: roll.hit, targetId: target.id,
      missT: roll.hit ? -1 : dist / speed
    });
    S.events.push({ type: 'muzzle', x: mx, y: my, ang, player: sh === S.player });
    if (sh === S.player) { S.stats.shots++; if (roll.hit) S.stats.hits++; }
    return roll.hit;
  }

  function launchTorp(sh, d, angOff) {
    const ang = Math.atan2(S.player.y - sh.y, S.player.x - sh.x) + (angOff || 0);
    S.projectiles.push({
      kind: 'torp',
      x: sh.x, y: sh.y, px: sh.x, py: sh.y,
      vx: Math.cos(ang) * d.torpSpeed, vy: Math.sin(ang) * d.torpSpeed,
      dmg: d.torpDmg, faction: sh.faction, life: d.torpLife,
      hostileShot: true, turn: d.torpTurn, det: d.torpDet, speed: d.torpSpeed
    });
    S.events.push({ type: 'torplaunch', x: sh.x, y: sh.y });
  }

  function steer(sh, tx, ty, maxSpeed, inertia) {
    const dvx = tx * maxSpeed - sh.vx, dvy = ty * maxSpeed - sh.vy;
    const k = 1 - Math.exp(-inertia * TICK);
    sh.vx += dvx * k; sh.vy += dvy * k;
  }

  /* the Wave Motion Gun: a sustained beam anchored to the bow. For
     wmgDur seconds, everything in a 2600 m corridor ahead ceases to
     exist — and the beam sweeps as the ship swings her bow. */
  function fireWMG() {
    const p = S.player, d = CLS.player;
    S.wmg.charging = false; S.wmg.charge = 0;
    S.wmgCdMax = Math.max(15, d.wmgCd - 10 * modN('wmg'));
    S.wmg.cd = S.wmgCdMax;
    S.beamT = d.wmgDur; S.beamTickN = 0;
    const ang = p.face;
    S.events.push({ type: 'wmgfire',
      x: p.x + Math.cos(ang) * p.radius * 3, y: p.y + Math.sin(ang) * p.radius * 3, ang });
  }

  function tickBeam() {
    if (S.beamT <= 0) return;
    const p = S.player, d = CLS.player;
    if (!p.alive) { S.beamT = 0; return; }
    S.beamT -= TICK;
    S.beamTickN++;
    const ang = p.face, dx = Math.cos(ang), dy = Math.sin(ang);
    const ox = p.x + dx * p.radius * 3, oy = p.y + dy * p.radius * 3;
    // damage lands in 0.1 s pulses so the event stream stays sane
    if (S.beamTickN % 6 === 0) {
      const pulse = d.wmgDmg * (6 * TICK) / d.wmgDur;
      for (const sh of S.ships) {
        if (!sh.alive || sh.faction !== 'hostile') continue;
        const rx = sh.x - ox, ry = sh.y - oy;
        const along = rx * dx + ry * dy;
        if (along < 0 || along > d.wmgRange) continue;
        const perp = Math.abs(rx * dy - ry * dx);
        if (perp <= d.wmgWidth + sh.radius) applyDamage(sh, pulse, 'wmg', 'Your Ship');
      }
    }
    // hostile fire entering the beam is vaporized continuously
    let removed = false;
    for (const pr of S.projectiles) {
      if (!pr.hostileShot) continue;
      const rx = pr.x - ox, ry = pr.y - oy;
      const along = rx * dx + ry * dy;
      const perp = Math.abs(rx * dy - ry * dx);
      if (along >= 0 && along <= d.wmgRange && perp <= d.wmgWidth) {
        pr.dead = true; removed = true;
        if (pr.kind === 'torp') S.events.push({ type: 'torpboom', x: pr.x, y: pr.y, fizzle: true });
      }
    }
    if (removed) S.projectiles = S.projectiles.filter(pr => !pr.dead);
  }

  function setLockTarget(id) {
    if (S.lockTargetId === id) return;
    const t = S.ships.find(s => s.id === id && s.alive && s.faction === 'hostile');
    if (!t) return;
    S.lockTargetId = id; S.locked = false; S.lockProgress = 0;
    S.lockNeed = (CLS[t.cls].lock || 2) * Math.pow(0.65, modN('lock'));
  }

  function tickPlayer(cmd) {
    const p = S.player, d = CLS.player;

    // fitting draft is modal on the number keys while open
    if (S.draft) {
      if (cmd.pick >= 1 && cmd.pick <= S.draft.length) pickDraft(cmd.pick - 1);
    } else if (cmd.order && ORDERS.indexOf(cmd.order) >= 0 && S.fleetOrder !== cmd.order) {
      S.fleetOrder = cmd.order;
      S.events.push({ type: 'order', order: cmd.order });
    }

    // overheat: push the ship past redline, burning your own hull
    S.heatOn = !!cmd.heat && p.hull > 16;
    if (S.heatOn) {
      p.hull -= 4 * TICK;
      if (!S.heatUsed) { S.heatUsed = true; S.events.push({ type: 'heaton' }); }
    }

    // webifiers
    S.webbedBy = [];
    for (const h of hostiles()) {
      const w = CLS[h.cls].web;
      if (w && Math.hypot(h.x - p.x, h.y - p.y) <= w) S.webbedBy.push(h.id);
    }
    const webbed = S.webbedBy.length > 0;
    if (webbed && !S.wasWebbed) S.events.push({ type: 'webbed' });
    S.wasWebbed = webbed;

    // wave motion gun: hold to charge; needs a nearly full capacitor
    const wm = S.wmg;
    wm.cd = Math.max(0, wm.cd - TICK);
    if (cmd.wmg && wm.cd <= 0 && (wm.charging || p.cap >= p.capMax * 0.9)) {
      if (!wm.charging) { wm.charging = true; wm.charge = 0; S.events.push({ type: 'wmgstart' }); }
      wm.charge += TICK / d.wmgCharge;
      p.cap = Math.max(0, p.cap - p.capMax * 0.85 * TICK / d.wmgCharge);
      if (wm.charge >= 1) fireWMG();
    } else if (wm.charging) {
      wm.charging = false; wm.charge = 0;
      S.events.push({ type: 'wmgcancel' });
    }

    // afterburner + thrust
    S.abOn = cmd.ab && p.cap > 0.5 && !wm.charging;
    if (S.abOn) p.cap = Math.max(0, p.cap - d.abDrain * TICK);
    let maxSpd = (S.abOn ? d.abSpeed : d.speed) * (webbed ? 0.5 : 1);
    maxSpd *= 1 + 0.12 * modN('speed');
    if (S.heatOn) maxSpd *= 1.3;
    if (wm.charging) maxSpd *= 0.35;        // braced for firing
    else if (S.beamT > 0) maxSpd *= 0.5;    // holding the beam steady

    let ix = cmd.thrustX, iy = cmd.thrustY;
    const il = Math.hypot(ix, iy);
    if (il > 0) steer(p, ix / il, iy / il, maxSpd, d.inertia);
    else {
      const k = 1 - Math.exp(-0.4 * TICK);
      p.vx -= p.vx * k; p.vy -= p.vy * k;
    }
    // a battleship swings her bow with real inertia
    if (Math.hypot(p.vx, p.vy) > 8) {
      const want = Math.atan2(p.vy, p.vx);
      let diff = want - p.face;
      while (diff > Math.PI) diff -= TAU;
      while (diff < -Math.PI) diff += TAU;
      p.face += clamp(diff, -d.turnRate * TICK, d.turnRate * TICK);
    }

    // targeting
    if (cmd.lockId != null) setLockTarget(cmd.lockId);
    if (cmd.clickWorld) {
      let best = null, bd = 70;
      for (const s of hostiles()) {
        const dd = Math.hypot(s.x - cmd.clickWorld.x, s.y - cmd.clickWorld.y) - s.radius;
        if (dd < bd) { bd = dd; best = s; }
      }
      if (best) setLockTarget(best.id);
    }
    if (cmd.tab) {
      const h = hostiles().sort((a, b) =>
        Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y));
      if (h.length) {
        const i = h.findIndex(s => s.id === S.lockTargetId);
        setLockTarget(h[(i + 1) % h.length].id);
      }
    }

    const tgt = S.ships.find(s => s.id === S.lockTargetId && s.alive);
    if (!tgt) { S.lockTargetId = null; S.locked = false; S.lockProgress = 0; }
    else if (!S.locked) {
      S.lockProgress += TICK;
      if (S.lockProgress >= S.lockNeed) { S.locked = true; S.events.push({ type: 'lock' }); }
    }

    // turrets
    p.gunCd -= TICK;
    if (S.locked && tgt && p.gunCd <= 0) {
      const dist = Math.hypot(tgt.x - p.x, tgt.y - p.y);
      if (dist <= d.gunRange) {
        if (p.cap >= d.gunCost) {
          p.cap -= d.gunCost;
          fire(p, tgt, d.gunDmg * (1 + 0.15 * modN('gun')) * rr(0.85, 1.15),
            d.pspeed, d.gunRange + 200, d.track * (1 + 0.25 * modN('track')));
          p.gunCd = d.gunRof / (S.heatOn ? 1.5 : 1);
          p.muzzle = -p.muzzle;
        } else { S.capEmptyFlash = 1.2; p.gunCd = 0.3; }
      }
    }

    // missiles: fire-and-forget at the locked target
    p.mslCd -= TICK;
    if (cmd.missile && p.mslCd <= 0 && p.msl > 0 && S.locked && tgt) {
      p.msl--;
      p.mslCd = d.mslCd;
      const ang = p.face;
      const mx = p.x + Math.cos(ang) * p.radius * 1.5;
      const my = p.y + Math.sin(ang) * p.radius * 1.5;
      S.projectiles.push({
        kind: 'missile', x: mx, y: my, px: mx, py: my,
        vx: Math.cos(ang) * d.mslSpeed * 0.6 + p.vx * 0.4,
        vy: Math.sin(ang) * d.mslSpeed * 0.6 + p.vy * 0.4,
        speed: d.mslSpeed, turn: d.mslTurn, dmg: d.mslDmg,
        faction: 'player', hostileShot: false, life: d.mslLife, targetId: tgt.id
      });
      S.events.push({ type: 'mlaunch', x: mx, y: my });
    }

    p.shield = Math.min(p.shieldMax, p.shield + d.sregen * TICK);
    if (modN('rep')) p.armor = Math.min(p.armorMax, p.armor + 3 * modN('rep') * TICK);
    p.cap = Math.min(p.capMax, p.cap + d.cregen * (1 + 0.3 * modN('cap')) * TICK);
    if (S.capEmptyFlash > 0) S.capEmptyFlash -= TICK;
  }

  function tickHostile(sh) {
    const d = CLS[sh.cls], p = S.player;
    if (sh.webbedT > 0) sh.webbedT -= TICK;
    const t = pickAim(sh);
    if (!t) {
      steer(sh, Math.cos(sh.face), Math.sin(sh.face), d.speed * 0.35, d.inertia);
    } else {
      const dist = Math.hypot(t.x - sh.x, t.y - sh.y) || 1;
      const distP = Math.hypot(p.x - sh.x, p.y - sh.y) || 1;

      // ---- boss phases: the Sanguine Vesper escalates as she burns ----
      // her heavy hardware always hunts the FC personally
      let lanceBusy = false;
      if (sh.cls === 'cruiser' && p.alive) {
        if (sh.bossPhase === 0) sh.bossPhase = 1;
        if (sh.bossPhase < 2 && sh.shield <= 1 && sh.armor < sh.armorMax * 0.5) {
          sh.bossPhase = 2;
          S.events.push({ type: 'banner', text: 'THE VESPER OPENS HER TUBES',
            sub: 'Torpedo salvos — keep the afterburner warm' });
        }
        if (sh.bossPhase < 3 && sh.hull < sh.hullMax * 0.6) {
          sh.bossPhase = 3; sh.lanceCd = 3;
          S.events.push({ type: 'banner', text: 'SPINAL LANCE POWERING UP',
            sub: 'When she locks her firing line — BREAK OFF IT' });
        }
        if (sh.bossPhase >= 3) {
          if (!sh.lance) sh.lance = { mode: 'idle', t: 0, ang: 0 };
          const L = sh.lance;
          if (L.mode === 'idle') {
            sh.lanceCd -= TICK;
            if (sh.lanceCd <= 0 && distP < 1400) {
              L.mode = 'charge'; L.t = 3;
              L.ang = Math.atan2(p.y - sh.y, p.x - sh.x);   // locked NOW — dodge by leaving the line
              S.events.push({ type: 'bosslance', phase: 'charge', x: sh.x, y: sh.y });
            }
          } else if (L.mode === 'charge') {
            L.t -= TICK;
            if (L.t <= 0) {
              L.mode = 'fire'; L.t = 1.2; sh.lanceTick = 0;
              S.events.push({ type: 'bosslance', phase: 'fire', x: sh.x, y: sh.y });
            }
          } else if (L.mode === 'fire') {
            L.t -= TICK;
            sh.lanceTick++;
            if (sh.lanceTick % 6 === 0) {
              const ldx = Math.cos(L.ang), ldy = Math.sin(L.ang);
              const prx = p.x - sh.x, pry = p.y - sh.y;
              const along = prx * ldx + pry * ldy;
              const perp = Math.abs(prx * ldy - pry * ldx);
              if (along > 0 && along < 1800 && perp < 45 + p.radius) applyDamage(p, 45, 'cruiser');
            }
            if (L.t <= 0) { L.mode = 'idle'; sh.lanceCd = 12; }
          }
          lanceBusy = L.mode !== 'idle';
        }
      }

      if (lanceBusy) steer(sh, 0, 0, 0, d.inertia * 2);   // holds position, bow on the line
      else orbitMove(sh, t, d.orbit, d);

      if (d.gunDmg) {
        sh.gunCd -= TICK;
        if (sh.gunCd <= 0 && dist <= d.gunRange) {
          fire(sh, t, d.gunDmg * rr(0.85, 1.15), d.pspeed, d.gunRange + 200, d.track);
          sh.gunCd = d.gunRof * rr(0.9, 1.25);
        }
      }
      if (d.torpRof && p.alive) {
        sh.torpCd -= TICK;
        if (sh.torpCd <= 0 && distP < 1500) {
          const salvo = sh.bossPhase >= 2 ? 4 : 1;
          for (let i = 0; i < salvo; i++)
            launchTorp(sh, d, salvo > 1 ? (i - (salvo - 1) / 2) * 0.22 : 0);
          sh.torpCd = sh.bossPhase >= 2 ? 9 : d.torpRof;
        }
      }
      if (d.repRate) tickRepair(sh, d, hostiles());
    }
    if (sh.lance && sh.lance.mode !== 'idle') sh.face = sh.lance.ang;
    else if (Math.hypot(sh.vx, sh.vy) > 5) sh.face = Math.atan2(sh.vy, sh.vx);
    sh.shield = Math.min(sh.shieldMax, sh.shield + d.sregen * TICK);
  }

  // ---- your wingmen: obey the broadcast, shoot the called target ----
  function tickFleet(sh) {
    const d = CLS[sh.cls], p = S.player;
    if (sh.webbedT > 0) sh.webbedT -= TICK;
    const order = S.fleetOrder;
    const hs = hostiles();
    let tgt = null;
    if (order !== 'regroup' && hs.length) {
      if (order === 'focus')
        tgt = S.ships.find(s => s.id === S.lockTargetId && s.alive && s.faction === 'hostile') || null;
      else if (order === 'defend') {
        let bd = Infinity;
        for (const h of hs) {
          const dd = Math.hypot(h.x - p.x, h.y - p.y);
          if (dd < bd) { bd = dd; tgt = h; }
        }
        if (bd > 900) tgt = null;
      }
      if (!tgt && order !== 'defend') {
        let bd = Infinity;
        for (const h of hs) {
          const dd = Math.hypot(h.x - sh.x, h.y - sh.y);
          if (dd < bd) { bd = dd; tgt = h; }
        }
      }
    }
    // logistics anchors the FC; combat ships orbit their target
    const anchor = (sh.cls === 'logi' || !tgt) ? p : tgt;
    const orbitR = sh.cls === 'logi' ? 380 : !tgt ? (order === 'regroup' ? 420 : 260) : d.orbit;
    orbitMove(sh, anchor, orbitR, d);

    sh.webbingId = null;
    if (tgt && d.gunDmg) {
      const dist = Math.hypot(tgt.x - sh.x, tgt.y - sh.y);
      sh.gunCd -= TICK;
      if (sh.gunCd <= 0 && dist <= d.gunRange) {
        fire(sh, tgt, d.gunDmg * rr(0.85, 1.15), d.pspeed, d.gunRange + 200, d.track);
        sh.gunCd = d.gunRof * rr(0.9, 1.25);
      }
      if (d.web && dist <= d.web) { tgt.webbedT = 0.3; sh.webbingId = tgt.id; }
    }
    if (d.repRate) tickRepair(sh, d, friendlies());
    if (Math.hypot(sh.vx, sh.vy) > 5) sh.face = Math.atan2(sh.vy, sh.vx);
    sh.shield = Math.min(sh.shieldMax, sh.shield + d.sregen * TICK);
  }

  function tickProjectiles() {
    for (const pr of S.projectiles) {
      pr.px = pr.x; pr.py = pr.y;

      if (pr.kind === 'torp') {
        const p = S.player;
        if (p.alive) {
          const want = Math.atan2(p.y - pr.y, p.x - pr.x);
          let cur = Math.atan2(pr.vy, pr.vx);
          let diff = want - cur;
          while (diff > Math.PI) diff -= TAU;
          while (diff < -Math.PI) diff += TAU;
          cur += clamp(diff, -pr.turn * TICK, pr.turn * TICK);
          pr.vx = Math.cos(cur) * pr.speed; pr.vy = Math.sin(cur) * pr.speed;
        }
        pr.x += pr.vx * TICK; pr.y += pr.vy * TICK;
        pr.life -= TICK;
        if (p.alive && Math.hypot(p.x - pr.x, p.y - pr.y) <= pr.det + p.radius) {
          pr.dead = true;
          S.events.push({ type: 'torpboom', x: pr.x, y: pr.y });
          applyDamage(p, pr.dmg, 'torp');
        } else if (pr.life <= 0) {
          pr.dead = true;
          S.events.push({ type: 'torpboom', x: pr.x, y: pr.y, fizzle: true });
        }
        continue;
      }

      if (pr.kind === 'missile') {
        const t = S.ships.find(s => s.id === pr.targetId && s.alive);
        if (t) {
          const want = Math.atan2(t.y - pr.y, t.x - pr.x);
          let cur = Math.atan2(pr.vy, pr.vx);
          let diff = want - cur;
          while (diff > Math.PI) diff -= TAU;
          while (diff < -Math.PI) diff += TAU;
          cur += clamp(diff, -pr.turn * TICK, pr.turn * TICK);
          pr.vx = Math.cos(cur) * pr.speed; pr.vy = Math.sin(cur) * pr.speed;
        }
        pr.x += pr.vx * TICK; pr.y += pr.vy * TICK;
        pr.life -= TICK;
        if (t && Math.hypot(t.x - pr.x, t.y - pr.y) <= t.radius + 8) {
          pr.dead = true;
          S.events.push({ type: 'boom', x: pr.x, y: pr.y, r: 6 });
          applyDamage(t, pr.dmg, 'missile', 'Your Ship');
        } else if (pr.life <= 0) pr.dead = true;
        continue;
      }

      pr.x += pr.vx * TICK; pr.y += pr.vy * TICK;
      pr.life -= TICK;
      if (pr.life <= 0) { pr.dead = true; continue; }

      if (pr.willHit) {
        // committed hit: light homing so the tracer visibly connects
        const t = S.ships.find(s => s.id === pr.targetId && s.alive);
        if (t) {
          const want = Math.atan2(t.y - pr.y, t.x - pr.x);
          const spd = Math.hypot(pr.vx, pr.vy);
          let cur = Math.atan2(pr.vy, pr.vx);
          let diff = want - cur;
          while (diff > Math.PI) diff -= TAU;
          while (diff < -Math.PI) diff += TAU;
          cur += clamp(diff, -4 * TICK, 4 * TICK);
          pr.vx = Math.cos(cur) * spd; pr.vy = Math.sin(cur) * spd;
          if (Math.hypot(t.x - pr.x, t.y - pr.y) <= t.radius + 5) {
            pr.dead = true;
            applyDamage(t, pr.dmg, pr.srcCls, pr.srcName);
          }
        } else pr.willHit = false;
      } else if (pr.missT >= 0) {
        pr.missT -= TICK;
        if (pr.missT < 0) {
          const t = S.ships.find(s => s.id === pr.targetId && s.alive);
          if (t) S.events.push({ type: 'miss', x: t.x, y: t.y - t.radius - 8, target: t.id });
        }
      }
    }
    S.projectiles = S.projectiles.filter(pr => !pr.dead);

    // torpedo proximity warning ping
    if (S.projectiles.some(pr => pr.kind === 'torp')) {
      S.torpWarnT -= TICK;
      if (S.torpWarnT <= 0) { S.events.push({ type: 'torpwarn' }); S.torpWarnT = 0.9; }
    } else S.torpWarnT = 0;
  }

  function tickWrecks() {
    for (const sh of S.ships) {
      if (!sh.wreck || sh.alive) continue;
      sh.x += sh.vx * TICK; sh.y += sh.vy * TICK;
      sh.face += sh.spin * TICK;
      sh.wreckT -= TICK;
      if (sh.wreckT <= 0) sh.wreck = false;
    }
    S.ships = S.ships.filter(sh => sh.alive || sh.wreck);
  }

  function tickPickups() {
    if (S.comboT > 0) S.comboT -= TICK;
    const p = S.player;
    for (const pk of S.pickups) {
      pk.px = pk.x; pk.py = pk.y;
      pk.x += pk.vx * TICK; pk.y += pk.vy * TICK;
      pk.life -= TICK;
      if (pk.life <= 0) { pk.dead = true; continue; }
      if (p.alive && Math.hypot(p.x - pk.x, p.y - pk.y) <= p.radius + 20) {
        pk.dead = true;
        if (pk.type === 'cap') p.cap = Math.min(p.capMax, p.cap + 40);
        else if (pk.type === 'armor') p.armor = Math.min(p.armorMax, p.armor + 60);
        else if (pk.type === 'ammo') p.msl = Math.min(mslMax(), p.msl + 2);
        else S.wmg.cd = Math.max(0, S.wmg.cd - 15);
        S.events.push({ type: 'pickup', x: pk.x, y: pk.y, ptype: pk.type });
      }
    }
    S.pickups = S.pickups.filter(pk => !pk.dead);
  }

  function spawnOvertimeWave() {
    S.otWave++;
    S.waveStartT = S.t;
    const n = Math.min(3 + S.otWave, 8);
    const boost = 1 + 0.07 * S.otWave;
    const baseAng = rr(0, TAU);
    for (let k = 0; k < n; k++) {
      let cls = rng() < 0.45 ? 'scout' : rng() < 0.75 ? 'frigate' : 'escort';
      if (S.otWave % 3 === 0 && k === 0) cls = 'cruiser';
      if (k === 1 && S.otWave >= 2) cls = 'hlogi';
      const ang = baseAng + k * (TAU / n) + rr(-0.35, 0.35);
      const dist = rr(1050, 1400);
      const sh = makeShip(cls, null,
        S.player.x + Math.cos(ang) * dist, S.player.y + Math.sin(ang) * dist);
      sh.shield *= boost; sh.shieldMax = sh.shield;
      sh.armor *= boost; sh.armorMax = sh.armor;
      sh.hull *= boost; sh.hullMax = sh.hull;
      sh.vx = -Math.cos(ang) * 220; sh.vy = -Math.sin(ang) * 220;
      S.ships.push(sh);
      S.events.push({ type: 'warpin', x: sh.x, y: sh.y, ang: ang + Math.PI, big: cls === 'cruiser' });
    }
    S.events.push({ type: 'banner', text: 'OVERTIME — WAVE ' + S.otWave,
      sub: 'Reinforcements at +' + Math.round((boost - 1) * 100) + '% strength. Survive.' });
    S.waveHullStart = S.player.hull;
  }

  function tickWaves() {
    if (hostiles().length !== 0) return;
    if (!S.overtime && S.wave >= WAVES.length) {
      if (S.mode === 'play') {
        S.mode = 'victory'; S.stats.endT = S.t;
        S.score += 2000;
        S.events.push({ type: 'banner', text: 'SITE SECURED', sub: '+2000 site bonus' });
      }
      return;
    }
    if (!S.overtime && S.wave > 0 && S.clearedAnnounced < S.wave) {
      S.clearedAnnounced = S.wave;
      let bonus = 500 * S.wave, sub = '+' + bonus + ' clear bonus';
      if (S.player.hull >= S.waveHullStart) { bonus += 750; sub += ' · +750 untouched hull'; }
      if (!S.waveWingLost) { bonus += 500; sub += ' · +500 fleet intact'; }
      S.score += bonus;
      S.events.push({ type: 'banner', text: 'WAVE ' + S.wave + ' CLEARED',
        sub: sub + ' — next wave warping in' });
      if (S.fleetLost.length) {
        const [wr, wn] = S.fleetLost.shift();
        spawnWing(wr, wn);
        S.events.push({ type: 'wingback', name: wn });
      }
      offerDraft();
    }
    if (S.overtime && S.otCleared < S.otWave) {
      S.otCleared = S.otWave;
      let bonus = 400 + 300 * S.otWave;
      if (!S.waveWingLost) bonus += 500;
      S.score += bonus;
      S.events.push({ type: 'banner', text: 'OVERTIME WAVE ' + S.otWave + ' CLEARED',
        sub: '+' + bonus + ' — more incoming' });
      if (S.fleetLost.length) {
        const [wr, wn] = S.fleetLost.shift();
        spawnWing(wr, wn);
        S.events.push({ type: 'wingback', name: wn });
      }
      offerDraft();
    }
    if (S.draft) return;   // holding the grid while you fit modules
    S.waveDelay -= TICK;
    if (S.waveDelay <= 0) {
      if (S.overtime) spawnOvertimeWave();
      else { spawnWave(S.wave); S.wave++; S.waveHullStart = S.player.hull; }
      S.waveWingLost = false;
      S.waveDelay = 2.8;
    }
  }

  function tick(cmd) {
    if (S.mode === 'intro') {
      if (cmd.anyKey) {
        S.mode = 'play'; S.waveDelay = 0.4; spawnFleet();
        S.events.push({ type: 'warpin', x: S.player.x, y: S.player.y, ang: -Math.PI / 2, big: true, fc: true });
      }
      return;
    }
    if (cmd.restart) {
      reset(); S.mode = 'play'; S.waveDelay = 0.4; spawnFleet();
      S.events.push({ type: 'warpin', x: S.player.x, y: S.player.y, ang: -Math.PI / 2, big: true, fc: true });
      return;
    }
    if (S.mode === 'victory' && cmd.overtime) {
      S.mode = 'play'; S.overtime = true; S.waveDelay = 1.5;
    }
    if (S.mode !== 'play' && S.mode !== 'dead') return;
    if (cmd.pause && S.mode === 'play') S.paused = !S.paused;
    if (S.paused && S.mode === 'play') return;

    S.t += TICK;
    for (const sh of S.ships) { sh.px = sh.x; sh.py = sh.y; }

    if (S.player.alive) tickPlayer(cmd);
    for (const sh of S.ships) {
      if (!sh.alive || sh === S.player) continue;
      if (sh.faction === 'player') tickFleet(sh);
      else tickHostile(sh);
    }
    for (const sh of S.ships) if (sh.alive) { sh.x += sh.vx * TICK; sh.y += sh.vy * TICK; }
    tickBeam();
    tickProjectiles();
    tickWrecks();
    tickPickups();
    if (S.mode === 'play') tickWaves();
  }

  reset();
  return { tick, state: () => S, drainEvents: () => S.events.splice(0) };
})();

/* =====================================================================
   TRINITY — rendering. Reads Destiny state, never writes it.
   World is drawn to an offscreen buffer, then composited to screen
   with bloom, chromatic shake, grain and vignette.
   ===================================================================== */
const Trinity = (() => {
  const cv = document.getElementById('cv');
  const sctx = cv.getContext('2d');
  const worldCv = document.createElement('canvas');
  const g = worldCv.getContext('2d');
  const bloomA = document.createElement('canvas');
  const bloomB = document.createElement('canvas');

  /* ---------------- procedural texture kitchen ---------------- */
  function mulberry32(seed) {
    let s = seed | 0;
    return function () {
      s = s + 0x6D2B79F5 | 0;
      let t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function valueNoise(seed, grid) {
    const rand = mulberry32(seed);
    const n = new Float32Array(grid * grid);
    for (let i = 0; i < n.length; i++) n[i] = rand();
    return (x, y) => {
      let xi = Math.floor(x), yi = Math.floor(y);
      const fx = x - xi, fy = y - yi;
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      xi = ((xi % grid) + grid) % grid; yi = ((yi % grid) + grid) % grid;
      const x1 = (xi + 1) % grid, y1 = (yi + 1) % grid;
      const a = n[yi * grid + xi], b = n[yi * grid + x1];
      const c = n[y1 * grid + xi], d = n[y1 * grid + x1];
      return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
    };
  }
  function fbm(nz, x, y, oct) {
    let v = 0, amp = 0.5, f = 1, tot = 0;
    for (let o = 0; o < oct; o++) {
      v += amp * nz(x * f, y * f);
      tot += amp; amp *= 0.55; f *= 2.1;
    }
    return v / tot;
  }

  function buildNebula(size, seed, freq, colA, colB, gain) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    const img = x.createImageData(size, size);
    const d = img.data;
    const nz = valueNoise(seed, 64);
    const half = size / 2;
    for (let py = 0; py < size; py++) {
      for (let px = 0; px < size; px++) {
        const n = fbm(nz, px / size * freq, py / size * freq, 5);
        const dx = (px - half) / half, dy = (py - half) / half;
        const fall = clamp(1 - (dx * dx + dy * dy), 0, 1);
        const t = clamp((n - 0.42) / 0.58, 0, 1);
        const a = Math.pow(t, 1.5) * fall * fall * gain * 255;
        const i = (py * size + px) * 4;
        d[i]     = colA[0] + (colB[0] - colA[0]) * t;
        d[i + 1] = colA[1] + (colB[1] - colA[1]) * t;
        d[i + 2] = colA[2] + (colB[2] - colA[2]) * t;
        d[i + 3] = a;
      }
    }
    x.putImageData(img, 0, 0);
    return c;
  }

  function buildPlanet(size, seed) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    const img = x.createImageData(size, size);
    const d = img.data;
    const nz = valueNoise(seed, 64);
    const R = size / 2 - 3, cx = size / 2, cy = size / 2;
    // light from upper-left, matching the sun
    const Lx = -0.62, Ly = -0.5, Lz = 0.6;
    for (let py = 0; py < size; py++) {
      for (let px = 0; px < size; px++) {
        const dx = px - cx, dy = py - cy;
        const dd = dx * dx + dy * dy;
        const i = (py * size + px) * 4;
        if (dd > R * R) { d[i + 3] = 0; continue; }
        const nx = dx / R, ny = dy / R;
        const nzv = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
        const diff = Math.max(0, nx * Lx + ny * Ly + nzv * Lz);
        // gas giant bands + turbulence
        const turb = fbm(nz, nx * 1.4 + 7, ny * 1.4 + 3, 4);
        const band = 0.5 + 0.5 * Math.sin(ny * 9 + turb * 5.5 + 1.2);
        const r0 = 46 + band * 130 + turb * 40;
        const g0 = 34 + band * 88 + turb * 30;
        const b0 = 66 + band * 70 + turb * 24;
        const li = 0.16 + 0.9 * diff;
        d[i] = r0 * li; d[i + 1] = g0 * li; d[i + 2] = b0 * li;
        d[i + 3] = 255;
      }
    }
    x.putImageData(img, 0, 0);
    // atmosphere rim
    const rim = x.createRadialGradient(cx, cy, R * 0.86, cx, cy, R + 3);
    rim.addColorStop(0, 'rgba(130,150,255,0)');
    rim.addColorStop(0.85, 'rgba(140,160,255,0.25)');
    rim.addColorStop(1, 'rgba(160,180,255,0)');
    x.fillStyle = rim;
    x.beginPath(); x.arc(cx, cy, R + 3, 0, TAU); x.fill();
    return c;
  }

  function buildBand(w, h, seed) {   // milky-way strip
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d');
    const img = x.createImageData(w, h);
    const d = img.data;
    const nz = valueNoise(seed, 64);
    for (let py = 0; py < h; py++) {
      for (let px = 0; px < w; px++) {
        const dy = (py - h / 2) / (h / 2);
        const n = fbm(nz, px / 90, py / 60, 4);
        const a = Math.exp(-dy * dy * 5) * Math.pow(n, 1.6) * 120;
        const i = (py * w + px) * 4;
        d[i] = 185; d[i + 1] = 200; d[i + 2] = 235; d[i + 3] = a;
      }
    }
    x.putImageData(img, 0, 0);
    return c;
  }

    gr.addColorStop(0.6, 'rgba(' + r + ',' + gg + ',' + b + ',0.14)');
    gr.addColorStop(1, 'rgba(' + r + ',' + gg + ',' + b + ',0)');
    x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
    return c;
  }

        : [[1.45, 0], [0.15, 0.42], [-0.8, 0.66], [-0.5, 0.1], [-0.5, -0.1], [-0.8, -0.66], [0.15, -0.42]]);
      x.fillStyle = grad(-U * 0.8, U * 0.8, [[0, '#63333c'], [0.5, '#3c1c24'], [1, '#200e13']]);
      x.fill();
      x.strokeStyle = '#c25a55'; x.lineWidth = U * 0.05; x.stroke();
      // bone-white stripe (Blood Raider flavour)
      x.fillStyle = cls === 'escort' ? '#d8cfc0' : '#b8a898';
      poly([[1.35, 0], [0.3, 0.14], [-0.4, 0.08], [-0.4, -0.08], [0.3, -0.14]]);
      x.fill();
      // engine
      x.fillStyle = '#170b0e';
      x.beginPath(); x.ellipse(-0.6 * U, 0, 0.18 * U, 0.2 * U, 0, 0, TAU); x.fill();
      x.fillStyle = 'rgba(255,130,80,0.9)';
      x.beginPath(); x.ellipse(-0.72 * U, 0, 0.07 * U, 0.11 * U, 0, 0, TAU); x.fill();
      // panel lines
      x.strokeStyle = 'rgba(10,6,8,0.55)'; x.lineWidth = U * 0.04;
      x.beginPath();
      x.moveTo(0.5 * U, 0.2 * U); x.lineTo(-0.5 * U, 0.45 * U);
      x.moveTo(0.5 * U, -0.2 * U); x.lineTo(-0.5 * U, -0.45 * U);
      x.stroke();
      if (cls === 'escort') {   // red chevrons
        x.fillStyle = '#e04848';
        poly([[0.05, 0.3], [-0.2, 0.45], [-0.3, 0.32], [-0.05, 0.2]]); x.fill();
        poly([[0.05, -0.3], [-0.2, -0.45], [-0.3, -0.32], [-0.05, -0.2]]); x.fill();
      }
    }
    return { cv: c, U, size };
  }

  function handleEvents(evts) {

          break;

          rings.push({ x: e.x, y: e.y, r: 6, max: e.big ? 200 : 110, life: 0.5, t: 0, warp: true });

  /* ---------------- world drawing ---------------- */
  function drawShip(S, sh, lerp, now) {
    const x = w2sx(sh.px + (sh.x - sh.px) * lerp);
    const y = w2sy(sh.py + (sh.y - sh.py) * lerp);
    const rPx = Math.max(7, sh.radius * scale * (sh.cls === 'player' ? 2.2 : 1.7));
    const spr = SPR[sh.cls] || SPR.scout;
    const drawSize = (rPx / spr.U) * spr.size;

    if (!sh.alive) {   // drifting charred wreck
      const wspr = WRECK[sh.cls] || WRECK.scout;
      g.save(); g.translate(x, y); g.rotate(sh.face);
      g.globalAlpha = clamp(sh.wreckT / 6, 0, 0.9);
      g.drawImage(wspr.cv, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
      g.globalAlpha = 1; g.restore();
      g.globalCompositeOperation = 'lighter';
      glow(x, y, rPx * 1.4, GLOW.orange, 0.07 + 0.05 * Math.sin(sh.wreckT * 7));
      g.globalCompositeOperation = 'source-over';
      if (Math.random() < 0.14)
        particles.push({ x: sh.x, y: sh.y, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20,
          life: 1.4, max: 1.4, kind: 'smoke', sz: 4 + Math.random() * 5 });
      if (Math.random() < 0.05)
        particles.push({ x: sh.x, y: sh.y, vx: (Math.random() - 0.5) * 45, vy: (Math.random() - 0.5) * 45,
          life: 0.9, max: 0.9, kind: 'ember', sz: 1.3, ph: Math.random() * TAU });
      return;
    }

    const spd = Math.hypot(sh.vx, sh.vy);
    const isPlayer = sh.cls === 'player';
    const isFleet = sh.faction === 'player';
    const ab = isPlayer && S.abOn;

    // engine glow + exhaust cone behind hull
    g.globalCompositeOperation = 'lighter';
    const tail = rPx * (isPlayer ? 1.9 : sh.cls === 'cruiser' ? 1.45 : 0.8);
    if (spd > 12) {
      const ex = x - Math.cos(sh.face) * tail;
      const ey = y - Math.sin(sh.face) * tail;
      const eR = rPx * (0.7 + spd / 300) * (ab ? 1.9 : 1);
      glow(ex, ey, eR, isFleet ? (ab ? GLOW.white : GLOW.cyan) : GLOW.orange, ab ? 0.95 : 0.6);
      // exhaust cone
      const flick = 0.75 + Math.random() * 0.5;
      const fl = rPx * (1.2 + spd / 160) * flick * (ab ? 1.9 : 1);
      g.save(); g.translate(x, y); g.rotate(sh.face);
      const eg = g.createLinearGradient(-tail, 0, -tail - fl, 0);
      eg.addColorStop(0, isFleet ? (ab ? 'rgba(220,245,255,0.85)' : 'rgba(120,210,255,0.6)') : 'rgba(255,170,90,0.55)');
      eg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = eg;
      g.beginPath();
      g.moveTo(-tail, rPx * 0.3); g.lineTo(-tail - fl, 0); g.lineTo(-tail, -rPx * 0.3);
      g.closePath(); g.fill();
      g.restore();
      // thruster sparks
      if (isPlayer && Math.random() < (ab ? 0.9 : 0.4)) {
        const ba = sh.face + Math.PI + (Math.random() - 0.5) * 0.5;
        particles.push({ x: sh.x - Math.cos(sh.face) * sh.radius, y: sh.y - Math.sin(sh.face) * sh.radius,
          vx: Math.cos(ba) * (60 + Math.random() * 120) + sh.vx * 0.3,
          vy: Math.sin(ba) * (60 + Math.random() * 120) + sh.vy * 0.3,
          life: 0.25 + Math.random() * 0.25, max: 0.5, kind: 'shieldspark', sz: 1.4 });
      }
    }
    // hull ambient glow
    if (isPlayer) glow(x, y, rPx * 2.6, GLOW.blue, 0.10);
    else if (isFleet) glow(x, y, rPx * 2.1, GLOW.blue, 0.08);
    else if (sh.cls === 'cruiser') glow(x, y, rPx * 2.6, GLOW.crimson, 0.16 + 0.05 * Math.sin(now * 2.2));
    else glow(x, y, rPx * 2.1, GLOW.red, 0.09);
    g.globalCompositeOperation = 'source-over';

    // hull sprite
    g.save(); g.translate(x, y); g.rotate(sh.face);
    g.drawImage(spr.cv, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
    g.restore();

    // overheat: the hull glows angry and sheds sparks
    if (isPlayer && S.heatOn) {
      g.globalCompositeOperation = 'lighter';
      glow(x, y, rPx * 1.9, GLOW.orange, 0.3 + 0.15 * Math.sin(now * 25));
      g.globalCompositeOperation = 'source-over';
      if (Math.random() < 0.5)
        particles.push({ x: sh.x, y: sh.y, vx: (Math.random() - 0.5) * 70, vy: (Math.random() - 0.5) * 70,
          life: 0.3, max: 0.3, kind: 'spark', sz: 1.5 });
    }

    // nav lights
    const nav = NAV[sh.cls];
    if (nav) {
      g.globalCompositeOperation = 'lighter';
      for (const [lx, ly, col, ph] of nav) {
        if (Math.sin(now * 2.5 + ph) < 0.55) continue;
        const ca = Math.cos(sh.face), sa = Math.sin(sh.face);
        const px2 = x + (lx * ca - ly * sa) * rPx, py2 = y + (lx * sa + ly * ca) * rPx;
        g.fillStyle = col;
        g.fillRect(px2 - 1, py2 - 1, 2, 2);
        glow(px2, py2, 6, col === '#ff6a5a' ? GLOW.red : col === '#6aff9a' ? GLOW.teal : GLOW.gold, 0.5);
      }
      g.globalCompositeOperation = 'source-over';
    }

    // hex shield flare
    const fx = shieldFx.get(sh.id);
    if (fx) {
      const a = clamp(fx.t / 0.45, 0, 1);
      const sR = rPx * 1.75;
      g.save();
      g.globalCompositeOperation = 'lighter';
      g.beginPath(); g.arc(x, y, sR, 0, TAU); g.clip();
      g.globalAlpha = a * 0.55;
      g.drawImage(hexCv, x - sR, y - sR, sR * 2, sR * 2);
      g.restore();
      g.globalCompositeOperation = 'lighter';
      g.strokeStyle = 'rgba(120,205,255,' + (a * 0.8).toFixed(2) + ')';
      g.lineWidth = 1.5;
      g.beginPath(); g.arc(x, y, sR, 0, TAU); g.stroke();
      g.lineWidth = 1;
      g.globalCompositeOperation = 'source-over';
    }

    // low-hull smoke
    if (sh.hull < sh.hullMax * 0.4 && Math.random() < 0.25)
      particles.push({ x: sh.x, y: sh.y, vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 0.5) * 30,
        life: 1, max: 1, kind: 'smoke', sz: 3 + Math.random() * 4 });
  }

  function updateTrails(S, lerp) {
    const now = performance.now() / 1000;
    for (const sh of S.ships) {
      if (!sh.alive) { trails.delete(sh.id); continue; }
      if (Math.hypot(sh.vx, sh.vy) < 25) continue;
      let tr = trails.get(sh.id);
      if (!tr) { tr = []; trails.set(sh.id, tr); }
      tr.push({ x: sh.px + (sh.x - sh.px) * lerp, y: sh.py + (sh.y - sh.py) * lerp, t: now });
      while (tr.length && now - tr[0].t > 0.5) tr.shift();
    }
    g.globalCompositeOperation = 'lighter';
    for (const [id, tr] of trails) {
      if (tr.length < 2) continue;
      const sh = S.ships.find(s => s.id === id);
      const isP = sh && sh.cls === 'player';
      const isF = sh && sh.faction === 'player';
      const ab = isP && S.abOn;
      for (let i = 1; i < tr.length; i++) {
        const a = i / tr.length;
        g.strokeStyle = isP
          ? (ab ? 'rgba(190,235,255,' + (a * 0.6).toFixed(3) + ')' : 'rgba(90,190,255,' + (a * 0.38).toFixed(3) + ')')
          : isF ? 'rgba(110,190,255,' + (a * 0.2).toFixed(3) + ')'
          : 'rgba(255,120,70,' + (a * 0.24).toFixed(3) + ')';
        g.lineWidth = a * (isP ? (ab ? 5.5 : 3.6) : 2.6) * scale * 2;
        g.beginPath();
        g.moveTo(w2sx(tr[i - 1].x), w2sy(tr[i - 1].y));
        g.lineTo(w2sx(tr[i].x), w2sy(tr[i].y));
        g.stroke();
      }
    }
    g.lineWidth = 1;
    g.globalCompositeOperation = 'source-over';
  }

  function drawWorld(S, lerp, now, dtF) {
    const p = S.player;
    const ptx = p.px + (p.x - p.px) * lerp, pty = p.py + (p.y - p.py) * lerp;

    // deep space base
    g.setTransform(1, 0, 0, 1, 0, 0);
    const bg = g.createRadialGradient(W / 2, H / 2, H * 0.1, W / 2, H / 2, H * 1.05);
    bg.addColorStop(0, '#0b1122'); bg.addColorStop(0.55, '#050811'); bg.addColorStop(1, '#02040a');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);

    // milky-way band (deepest parallax)
    g.globalCompositeOperation = 'lighter';
    g.save();
    g.translate((0 - cam.x * 0.02) * scale + W / 2, (0 - cam.y * 0.02) * scale + H / 2);
    g.rotate(-0.42);
    g.globalAlpha = 0.55;
    g.drawImage(BAND, -2600 * scale, -800 * scale, 5200 * scale, 1600 * scale);
    g.globalAlpha = 1;
    g.restore();

    // nebulae
    const nebs = [
      [NEB1, -1700, -850, 2300, 0.06],
      [NEB2, 1500, 700, 2600, 0.08],
      [NEB3, 300, -1700, 1900, 0.05],
      [NEB2, -900, 1600, 1700, 0.045]
    ];
    for (const [img, nx, ny, sz, pz] of nebs) {
      const sx2 = (nx - cam.x * pz) * scale + W / 2;
      const sy2 = (ny - cam.y * pz) * scale + H / 2;
      g.globalAlpha = 0.85;
      g.drawImage(img, sx2 - sz * scale / 2, sy2 - sz * scale / 2, sz * scale, sz * scale);
    }
    g.globalAlpha = 1;

    // sun
    {
      const sx2 = (-2600 - cam.x * 0.04) * scale + W / 2;
      const sy2 = (-1500 - cam.y * 0.04) * scale + H / 2;
      glow(sx2, sy2, 340 * scale + 130, GLOW.gold, 0.55);
      glow(sx2, sy2, 110 * scale + 46, GLOW.white, 0.95);
    }
    g.globalCompositeOperation = 'source-over';

    // planet
    {
      const pz = 0.07;
      const sx2 = (2400 - cam.x * pz) * scale + W / 2;
      const sy2 = (1500 - cam.y * pz) * scale + H / 2;
      const pr = 560 * scale;
      g.drawImage(PLANET, sx2 - pr / 2, sy2 - pr / 2, pr, pr);
    }

    // stars
    for (const st of stars) {
      const px2 = ((st.x - cam.x * st.z) % 6000 + 9000) % 6000 - 3000;
      const py2 = ((st.y - cam.y * st.z) % 6000 + 9000) % 6000 - 3000;
      const sx2 = px2 * scale + W / 2, sy2 = py2 * scale + H / 2;
      if (sx2 < -3 || sx2 > W + 3 || sy2 < -3 || sy2 > H + 3) continue;
      const tw = 0.72 + 0.28 * Math.sin(now * 2 + st.tw);
      const al = st.b * tw;
      g.fillStyle = 'rgba(195,210,232,' + (al * 0.9).toFixed(2) + ')';
      const s2 = st.z > 0.6 ? 1.9 : st.z > 0.35 ? 1.3 : 1;
      g.fillRect(sx2, sy2, s2, s2);
      if (st.big) {   // sparkle cross on the brightest few
        g.fillStyle = 'rgba(200,220,245,' + (al * 0.32).toFixed(2) + ')';
        g.fillRect(sx2 - 3, sy2, 7, 1);
        g.fillRect(sx2, sy2 - 3, 1, 7);
      }
    }

    // near-field dust — streaks with your velocity
    const spd = Math.hypot(p.vx, p.vy);
    g.globalCompositeOperation = 'lighter';
    for (const d of dust) {
      const bx2 = (W / scale) * 0.75, by2 = (H / scale) * 0.75;
      let dx = (d.x - cam.x * d.z); dx = ((dx % (bx2 * 2)) + bx2 * 3) % (bx2 * 2) - bx2;
      let dy = (d.y - cam.y * d.z); dy = ((dy % (by2 * 2)) + by2 * 3) % (by2 * 2) - by2;
      const sx2 = dx * scale + W / 2, sy2 = dy * scale + H / 2;
      const len = clamp(spd * 0.05, 0.8, 55) * scale * d.z;
      const a = spd > 30 ? Math.atan2(p.vy, p.vx) : 0;
      g.strokeStyle = S.abOn ? 'rgba(190,220,250,0.5)' : 'rgba(170,200,235,0.4)';
      g.globalAlpha = clamp(0.10 + spd / 800, 0.10, 0.55) * d.z;
      g.beginPath();
      g.moveTo(sx2, sy2);
      g.lineTo(sx2 - Math.cos(a) * len, sy2 - Math.sin(a) * len);
      g.stroke();
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';

    // asteroids (shaded, cratered)
    for (const as of asteroids) {
      const ax = w2sx(as.x), ay = w2sy(as.y);
      const ar = as.r * scale;
      if (ax < -ar - 40 || ax > W + ar + 40 || ay < -ar - 40 || ay > H + ar + 40) continue;
      g.save(); g.translate(ax, ay); g.rotate(as.rot + now * as.spin);
      const ag = g.createRadialGradient(-ar * 0.4, -ar * 0.4, ar * 0.1, 0, 0, ar * 1.2);
      ag.addColorStop(0, '#3a4250'); ag.addColorStop(0.6, '#20252e'); ag.addColorStop(1, '#0e1116');
      g.fillStyle = ag; g.strokeStyle = '#39414d';
      g.beginPath();
      as.pts.forEach((k, i) => {
        const a = i / as.pts.length * TAU;
        const x2 = Math.cos(a) * ar * k, y2 = Math.sin(a) * ar * k;
        i === 0 ? g.moveTo(x2, y2) : g.lineTo(x2, y2);
      });
      g.closePath(); g.fill(); g.stroke();
      g.fillStyle = 'rgba(8,10,14,0.5)';
      for (const [crx, cry, crr] of as.craters) {
        g.beginPath(); g.arc(crx * ar * 0.8, cry * ar * 0.8, crr * ar, 0, TAU); g.fill();
      }
      g.restore();
    }

    // derelict relay
    {
      const bx3 = w2sx(-380), by3 = w2sy(-260);
      g.strokeStyle = 'rgba(95,115,140,0.6)';
      g.lineWidth = 2;
      g.beginPath(); g.arc(bx3, by3, 30 * scale, 0, TAU); g.stroke();
      g.lineWidth = 1;
      g.strokeStyle = 'rgba(80,100,125,0.45)';
      g.beginPath();
      for (let i = 0; i < 3; i++) {
        const a = i * 2.09 + 0.5 + now * 0.04;
        g.moveTo(bx3, by3);
        g.lineTo(bx3 + Math.cos(a) * 52 * scale, by3 + Math.sin(a) * 52 * scale);
      }
      g.stroke();
      g.globalCompositeOperation = 'lighter';
      glow(bx3, by3, 10 * scale + 5, GLOW.teal, 0.4 + 0.4 * Math.sin(now * 2.2));
      g.globalCompositeOperation = 'source-over';
    }

    // trails
    updateTrails(S, lerp);

    // webifier beams
    if (S.webbedBy.length && p.alive) {
      g.globalCompositeOperation = 'lighter';
      for (const id of S.webbedBy) {
        const h = S.ships.find(s => s.id === id && s.alive);
        if (!h) continue;
        const x1 = w2sx(h.x), y1 = w2sy(h.y), x2 = w2sx(ptx), y2 = w2sy(pty);
        g.strokeStyle = 'rgba(90,255,200,' + (0.35 + 0.25 * Math.sin(now * 30)).toFixed(2) + ')';
        g.lineWidth = 1.8;
        g.beginPath(); g.moveTo(x1, y1);
        const segs = 8;
        for (let i = 1; i <= segs; i++) {
          const t = i / segs;
          const jx = i < segs ? (Math.random() - 0.5) * 11 : 0;
          const jy = i < segs ? (Math.random() - 0.5) * 11 : 0;
          g.lineTo(x1 + (x2 - x1) * t + jx, y1 + (y2 - y1) * t + jy);
        }
        g.stroke();
        glow(x1, y1, 13, GLOW.teal, 0.55);
        glow(x2, y2, 16, GLOW.teal, 0.3);
      }
      g.lineWidth = 1;
      g.globalCompositeOperation = 'source-over';
    }

    // logistics repair beams & fleet tackle webs (read-only from sim state)
    g.globalCompositeOperation = 'lighter';
    for (const sh of S.ships) {
      if (!sh.alive) continue;
      if (sh.repTargetId) {
        const rt = S.ships.find(s => s.id === sh.repTargetId && s.alive);
        if (rt) {
          const x1 = w2sx(sh.x), y1 = w2sy(sh.y), x2 = w2sx(rt.x), y2 = w2sy(rt.y);
          const friendly = sh.faction === 'player';
          g.strokeStyle = friendly
            ? 'rgba(120,255,150,' + (0.28 + 0.2 * Math.sin(now * 18)).toFixed(2) + ')'
            : 'rgba(255,140,60,' + (0.28 + 0.2 * Math.sin(now * 18)).toFixed(2) + ')';
          g.lineWidth = 2;
          g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
          glow(x2, y2, 15, friendly ? GLOW.teal : GLOW.orange, 0.35);
        }
      }
      if (sh.webbingId && sh.faction === 'player') {
        const wt = S.ships.find(s => s.id === sh.webbingId && s.alive);
        if (wt) {
          g.strokeStyle = 'rgba(90,255,200,' + (0.25 + 0.15 * Math.sin(now * 26)).toFixed(2) + ')';
          g.lineWidth = 1.4;
          g.beginPath(); g.moveTo(w2sx(sh.x), w2sy(sh.y)); g.lineTo(w2sx(wt.x), w2sy(wt.y)); g.stroke();
        }
      }
    }
    g.lineWidth = 1;
    g.globalCompositeOperation = 'source-over';

    // boss spinal lance: telegraph line during charge, red beam on fire
    for (const sh of S.ships) {
      if (sh.cls !== 'cruiser' || !sh.alive || !sh.lance || sh.lance.mode === 'idle') continue;
      const L = sh.lance;
      const x1 = w2sx(sh.px + (sh.x - sh.px) * lerp), y1 = w2sy(sh.py + (sh.y - sh.py) * lerp);
      const dxl = Math.cos(L.ang), dyl = Math.sin(L.ang);
      const x2 = x1 + dxl * 1800 * scale, y2 = y1 + dyl * 1800 * scale;
      g.globalCompositeOperation = 'lighter';
      if (L.mode === 'charge') {
        const kk = 1 - L.t / 3;
        g.strokeStyle = 'rgba(255,70,60,' + (0.15 + 0.45 * kk).toFixed(2) + ')';
        g.setLineDash([8, 10]);
        g.lineDashOffset = -performance.now() / 16;
        g.lineWidth = 2 + 3 * kk;
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
        g.setLineDash([]);
        glow(x1 + dxl * 40 * scale, y1 + dyl * 40 * scale,
          (12 + 46 * kk) * (1 + 0.2 * Math.sin(now * 30)), GLOW.crimson, 0.4 + 0.6 * kk);
      } else {
        const env = Math.min(1, L.t * 4);
        for (const [w2, col] of [[100, 'rgba(255,60,50,' + (0.25 * env).toFixed(2) + ')'],
                                 [44, 'rgba(255,120,90,' + (0.55 * env).toFixed(2) + ')'],
                                 [15, 'rgba(255,235,220,' + (0.9 * env).toFixed(2) + ')']]) {
          g.strokeStyle = col; g.lineWidth = Math.max(1, w2 * scale);
          g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
        }
        glow(x1, y1, 130 * scale * env + 20, GLOW.crimson, env);
        shake = Math.min(30, shake + 22 * dtF);
      }
      g.lineWidth = 1;
      g.globalCompositeOperation = 'source-over';
    }

    // salvage pickups: fly into the debris field to collect
    if (S.pickups && S.pickups.length) {
      g.globalCompositeOperation = 'lighter';
      for (const pk of S.pickups) {
        if (pk.life < 3 && Math.floor(now * 6) % 2 === 0) continue;   // expiring blink
        const x = w2sx(pk.px + (pk.x - pk.px) * lerp), y = w2sy(pk.py + (pk.y - pk.py) * lerp);
        const img = pk.type === 'cap' ? GLOW.gold : pk.type === 'armor' ? GLOW.orange
          : pk.type === 'ammo' ? GLOW.teal : GLOW.cyan;
        glow(x, y, 15 + 3 * Math.sin(now * 5 + pk.x), img, 0.7);
        g.save(); g.translate(x, y); g.rotate(now * 2);
        g.fillStyle = pk.type === 'cap' ? '#ffe9a8' : pk.type === 'armor' ? '#ffc890'
          : pk.type === 'ammo' ? '#b8ffe0' : '#a8e8ff';
        g.fillRect(-3.5, -3.5, 7, 7);
        g.restore();
      }
      g.globalCompositeOperation = 'source-over';
    }

    // projectiles
    g.globalCompositeOperation = 'lighter';
    for (const pr of S.projectiles) {
      const x = w2sx(pr.px + (pr.x - pr.px) * lerp), y = w2sy(pr.py + (pr.y - pr.py) * lerp);
      if (pr.kind === 'torp') {
        const pulse = 0.8 + 0.3 * Math.sin(now * 14);
        glow(x, y, 16 * pulse, GLOW.orange, 0.95);
        g.fillStyle = '#fff0d0';
        g.beginPath(); g.arc(x, y, 2.8, 0, TAU); g.fill();
        if (Math.random() < 0.7)
          particles.push({ x: pr.x, y: pr.y, vx: (Math.random() - 0.5) * 25, vy: (Math.random() - 0.5) * 25,
            life: 0.55, max: 0.55, kind: 'smoke', sz: 3.5 });
      } else if (pr.kind === 'missile') {
        glow(x, y, 11, GLOW.teal, 0.85);
        g.fillStyle = '#d8fff0';
        g.beginPath(); g.arc(x, y, 2, 0, TAU); g.fill();
        if (Math.random() < 0.55)
          particles.push({ x: pr.x, y: pr.y, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20,
            life: 0.4, max: 0.4, kind: 'smoke', sz: 2.5 });
      } else {
        const l = 0.018;
        // outer colour glow + hot core line
        g.strokeStyle = pr.hostileShot ? 'rgba(255,80,55,0.5)' : 'rgba(255,215,120,0.5)';
        g.lineWidth = 3.5;
        g.beginPath(); g.moveTo(x, y);
        g.lineTo(x - pr.vx * l * scale, y - pr.vy * l * scale); g.stroke();
        g.strokeStyle = pr.hostileShot ? 'rgba(255,200,180,0.95)' : 'rgba(255,250,225,0.95)';
        g.lineWidth = 1.4;
        g.beginPath(); g.moveTo(x, y);
        g.lineTo(x - pr.vx * l * 0.7 * scale, y - pr.vy * l * 0.7 * scale); g.stroke();
        glow(x, y, 6, pr.hostileShot ? GLOW.red : GLOW.gold, 0.6);
      }
    }
    g.lineWidth = 1;
    g.globalCompositeOperation = 'source-over';

    // ships & wrecks
    for (const sh of S.ships) drawShip(S, sh, lerp, now);

    // ---- wave motion gun: charge-up at the bow, then the beam ----
    const wm = S.wmg;
    if (wm && wm.charging && p.alive) {
      const bowD = p.radius * 4.3;
      const bwx = ptx + Math.cos(p.face) * bowD, bwy = pty + Math.sin(p.face) * bowD;
      const bx4 = w2sx(bwx), by4 = w2sy(bwy);
      g.globalCompositeOperation = 'lighter';
      // aim corridor
      g.strokeStyle = 'rgba(120,215,255,' + (0.15 + 0.3 * wm.charge).toFixed(2) + ')';
      g.setLineDash([10, 14]);
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(bx4, by4);
      g.lineTo(bx4 + Math.cos(p.face) * 2600 * scale, by4 + Math.sin(p.face) * 2600 * scale);
      g.stroke();
      g.setLineDash([]);
      // energy gathering at the muzzle
      glow(bx4, by4, (10 + 52 * wm.charge) * (1 + 0.15 * Math.sin(now * 40)), GLOW.cyan, 0.35 + 0.65 * wm.charge);
      glow(bx4, by4, 8 + 22 * wm.charge, GLOW.white, wm.charge);
      g.strokeStyle = 'rgba(150,225,255,0.7)';
      for (let i = 0; i < 6; i++) {
        const a = Math.random() * TAU;
        const d0 = (14 + 70 * (1 - wm.charge)) * scale + 8;
        g.beginPath();
        g.moveTo(bx4 + Math.cos(a) * d0, by4 + Math.sin(a) * d0);
        g.lineTo(bx4 + Math.cos(a) * d0 * 0.35, by4 + Math.sin(a) * d0 * 0.35);
        g.stroke();
      }
      const cr = (80 * (1 - wm.charge) + 14) * scale;
      g.strokeStyle = 'rgba(140,220,255,' + (0.3 + 0.5 * wm.charge).toFixed(2) + ')';
      g.beginPath(); g.arc(bx4, by4, cr, 0, TAU); g.stroke();
      g.lineWidth = 1;
      g.globalCompositeOperation = 'source-over';
    }
    if (S.beamT > 0 && p.alive) {
      g.globalCompositeOperation = 'lighter';
      const dur = 0.75;
      const prog = 1 - S.beamT / dur;
      const env = Math.min(1, prog * 10 + 0.15, S.beamT * 2.8);
      const x1 = w2sx(ptx + Math.cos(p.face) * p.radius * 3);
      const y1 = w2sy(pty + Math.sin(p.face) * p.radius * 3);
      const dxb = Math.cos(p.face), dyb = Math.sin(p.face);
      const x2 = x1 + dxb * 2600 * scale, y2 = y1 + dyb * 2600 * scale;
      for (const [w, cr2, cg2, cb2, a] of [[170, 90, 170, 255, 0.2], [90, 140, 210, 255, 0.4], [40, 210, 240, 255, 0.75], [14, 255, 255, 255, 0.95]]) {
        g.strokeStyle = 'rgba(' + cr2 + ',' + cg2 + ',' + cb2 + ',' + (a * env).toFixed(3) + ')';
        g.lineWidth = Math.max(1, w * scale * (0.6 + 0.4 * env));
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
      }
      // spiral energy strands
      g.lineWidth = Math.max(1, 5 * scale);
      for (const ph of [0, Math.PI]) {
        g.strokeStyle = 'rgba(180,235,255,' + (0.55 * env).toFixed(3) + ')';
        g.beginPath();
        for (let s4 = 0; s4 <= 2600; s4 += 65) {
          const off = Math.sin(s4 * 0.02 + ph + now * 34) * 34 * scale * env;
          const px4 = x1 + dxb * s4 * scale - dyb * off;
          const py4 = y1 + dyb * s4 * scale + dxb * off;
          s4 === 0 ? g.moveTo(px4, py4) : g.lineTo(px4, py4);
        }
        g.stroke();
      }
      glow(x1, y1, (170 * env + 30) * scale + 20, GLOW.cyan, env);
      glow(x1, y1, (70 * env + 14) * scale + 10, GLOW.white, env);
      shake = Math.min(30, shake + 40 * dtF);
      g.lineWidth = 1;
      g.globalCompositeOperation = 'source-over';
    }

    // ---- transient FX ----
    for (const pd of pending) pd.t -= dtF;
    pending = pending.filter(pd => { if (pd.t <= 0) { addBoom(pd.x, pd.y, pd.r, pd.big); return false; } return true; });

    g.globalCompositeOperation = 'lighter';
    particles = particles.filter(pt => (pt.life -= dtF) > 0);
    for (const pt of particles) {
      pt.x += pt.vx * dtF; pt.y += pt.vy * dtF;
      const a = clamp(pt.life / pt.max, 0, 1);
      const x = w2sx(pt.x), y = w2sy(pt.y);
      if (pt.kind === 'fire') {
        const img = a > 0.62 ? FIRE1 : a > 0.3 ? FIRE2 : FIRE3;
        const r = pt.sz * scale * (3 + (1 - a) * 2.4);
        g.globalAlpha = a;
        g.drawImage(img, x - r, y - r, r * 2, r * 2);
        g.globalAlpha = 1;
      } else if (pt.kind === 'spark') {
        glow(x, y, pt.sz * scale * 2.6, GLOW.orange, a);
      } else if (pt.kind === 'shieldspark') {
        glow(x, y, pt.sz * scale * 2.6, GLOW.cyan, a);
      } else if (pt.kind === 'ember') {
        const fl = 0.55 + 0.45 * Math.sin(performance.now() / 28 + pt.ph);
        glow(x, y, pt.sz * scale * 3, GLOW.gold, a * fl);
      } else if (pt.kind === 'debris') {
        g.globalCompositeOperation = 'source-over';
        g.save(); g.translate(x, y); g.rotate(pt.rot += pt.spin * dtF);
        g.fillStyle = 'rgba(72,64,60,' + a.toFixed(2) + ')';
        const s3 = pt.sz * scale;
        g.beginPath(); g.moveTo(s3, 0); g.lineTo(-s3 * 0.6, s3 * 0.7); g.lineTo(-s3 * 0.4, -s3 * 0.6);
        g.closePath(); g.fill();
        g.restore();
        g.globalCompositeOperation = 'lighter';
      } else { // smoke
        g.globalCompositeOperation = 'source-over';
        g.fillStyle = 'rgba(38,42,50,' + (a * 0.4).toFixed(2) + ')';
        g.beginPath(); g.arc(x, y, pt.sz * scale * (1.7 - a * 0.7), 0, TAU); g.fill();
        g.globalCompositeOperation = 'lighter';
      }
    }
    // shockwave rings
    rings = rings.filter(rg => (rg.t += dtF) < rg.life);
    for (const rg of rings) {
      const k = rg.t / rg.life;
      const rr3 = (rg.r + (rg.max - rg.r) * (1 - Math.pow(1 - k, 2.2))) * scale;
      g.strokeStyle = rg.shield ? 'rgba(110,190,255,' + (0.7 * (1 - k)).toFixed(2) + ')'
        : rg.warp ? 'rgba(200,230,255,' + (0.8 * (1 - k)).toFixed(2) + ')'
        : 'rgba(255,190,120,' + (0.75 * (1 - k)).toFixed(2) + ')';
      g.lineWidth = rg.shield ? 1.5 : 2.6 * (1 - k) + 0.6;
      g.beginPath(); g.arc(w2sx(rg.x), w2sy(rg.y), rr3, 0, TAU); g.stroke();
    }
    g.lineWidth = 1;
    // flashes (+ 4-point star for muzzle)
    flashes = flashes.filter(f => (f.life -= dtF) > 0);
    for (const f of flashes) {
      const a = f.life / f.max;
      glow(w2sx(f.x), w2sy(f.y), f.r * scale, f.img, a);
      if (f.star) {
        const x = w2sx(f.x), y = w2sy(f.y), L = f.r * scale * 1.6 * a;
        g.strokeStyle = 'rgba(255,246,220,' + (a * 0.9).toFixed(2) + ')';
        g.lineWidth = 1.4;
        g.beginPath();
        g.moveTo(x - L, y); g.lineTo(x + L, y);
        g.moveTo(x, y - L); g.lineTo(x, y + L);
        g.stroke();
      }
    }
    g.lineWidth = 1;
    g.globalCompositeOperation = 'source-over';
  }

  /* ---------------- HUD (drawn on screen ctx, post-bloom) ---------------- */
  function arcS(cx, cy, r, w, from, sweep, col) {
    sctx.strokeStyle = col; sctx.lineWidth = w;
    sctx.beginPath(); sctx.arc(cx, cy, r, from, from + sweep); sctx.stroke();
  }

  function drawCapWheel(S) {
    const p = S.player;
    const cx = W / 2, cy = H - 96, start = Math.PI * 0.75, full = Math.PI * 1.5;
    sctx.globalAlpha = 0.92;
    sctx.fillStyle = 'rgba(6,10,18,0.6)';
    sctx.beginPath(); sctx.arc(cx, cy, 66, 0, TAU); sctx.fill();
    arcS(cx, cy, 52, 7, start, full, 'rgba(40,60,85,0.5)');
    arcS(cx, cy, 43, 7, start, full, 'rgba(70,58,35,0.5)');
    arcS(cx, cy, 34, 7, start, full, 'rgba(75,38,35,0.5)');
    arcS(cx, cy, 52, 7, start, full * clamp(p.shield / p.shieldMax, 0, 1), 'rgba(95,170,255,0.95)');
    arcS(cx, cy, 43, 7, start, full * clamp(p.armor / p.armorMax, 0, 1), 'rgba(235,180,90,0.95)');
    arcS(cx, cy, 34, 7, start, full * clamp(p.hull / p.hullMax, 0, 1), 'rgba(240,95,80,0.95)');
    const pips = 16, fillN = Math.round(clamp(p.cap / p.capMax, 0, 1) * pips);
    const flash = S.capEmptyFlash > 0 && Math.floor(S.capEmptyFlash * 8) % 2 === 0;
    for (let i = 0; i < pips; i++) {
      const a0 = start + (i + 0.12) * (full / pips), a1 = start + (i + 0.88) * (full / pips);
      sctx.strokeStyle = i < fillN ? (flash ? 'rgba(255,120,60,0.95)' : 'rgba(255,215,120,0.95)')
                                   : 'rgba(60,55,40,0.6)';
      sctx.lineWidth = 5;
      sctx.beginPath(); sctx.arc(cx, cy, 24, a0, a1); sctx.stroke();
    }
    sctx.fillStyle = '#cfe0f0'; sctx.font = 'bold 14px Consolas,monospace';
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(String(Math.round(Math.hypot(p.vx, p.vy))), cx, cy - 2);
    sctx.fillStyle = '#7d93a8'; sctx.font = '9px Consolas,monospace';
    sctx.fillText('m/s', cx, cy + 11);
    sctx.textBaseline = 'alphabetic';
    sctx.globalAlpha = 1;

    let wy = cy - 92;
    const warn = (txt, col) => {
      sctx.fillStyle = col; sctx.font = 'bold 13px Consolas,monospace'; sctx.textAlign = 'center';
      if (Math.floor(performance.now() / 250) % 2 === 0) sctx.fillText(txt, cx, wy);
      wy -= 18;
    };
    if (S.heatOn) warn('OVERHEATING — HULL BURNING', '#ff9c5a');
    if (S.capEmptyFlash > 0) warn('CAPACITOR EMPTY', '#ff8c5a');
    if (S.webbedBy.length) warn('WEBBED — SPEED REDUCED', '#5affc8');
    if (S.projectiles.some(pr => pr.kind === 'torp')) warn('TORPEDO INBOUND', '#ffb35a');
    if (S.ships.some(s => s.alive && s.cls === 'cruiser' && s.lance && s.lance.mode === 'charge'))
      warn('SPINAL LANCE — BREAK OFF HER LINE', '#ff6a5a');
    if (S.abOn) {
      sctx.fillStyle = '#9fe0ff'; sctx.font = 'bold 10px Consolas,monospace'; sctx.textAlign = 'center';
      sctx.fillText('AFTERBURNER', cx, cy + 62);
    }
  }

    }
    // broadcast bar

    }
    // comms chatter
    if (S.mode === 'play' && !S.paused) {
      lowWingT -= dtF;
      if (lowWingT <= 0) {

        if (burning) { say('Mercy > ' + burning.name + ' is burning — reps overheating!'); lowWingT = 9; }
        else lowWingT = 1;

      sctx.fillText(c.txt, 16, cy2);

  const CLS_LABEL = { tackle: 'TACKLE', dps: 'DPS', logi: 'LOGI' };

  // ---- fitting draft: pick 1 of 3 salvaged modules between waves ----
  const draftRects = [];
  function drawDraft(S) {
    draftRects.length = 0;

    sctx.shadowColor = 'rgba(255,215,120,0.7)'; sctx.shadowBlur = 16;
    sctx.fillStyle = '#ffe9b0'; sctx.font = 'bold 20px Consolas,monospace'; sctx.textAlign = 'center';
    sctx.fillText('SALVAGED FITTINGS — CHOOSE ONE', W / 2, y0 - 26);
    sctx.restore();
    S.draft.forEach((m, i) => {
      const x = x0 + i * (cw2 + gap2);
      sctx.fillStyle = 'rgba(10,16,26,0.92)';
      roundRectPath(sctx, x, y0, cw2, chh, 10); sctx.fill();
      sctx.strokeStyle = 'rgba(255,215,120,' + (0.35 + 0.25 * Math.sin(performance.now() / 300 + i * 2)).toFixed(2) + ')';
      sctx.lineWidth = 1.5; sctx.stroke(); sctx.lineWidth = 1;
      drawKey(x + 12, y0 + 12, String(i + 1));
      sctx.fillStyle = '#e6edf5'; sctx.font = 'bold 13px Consolas,monospace'; sctx.textAlign = 'left';

        line += wd + ' ';

      if (owned) {
        sctx.fillStyle = '#ffd978'; sctx.font = 'bold 10px Consolas,monospace';

      sctx.textAlign = 'right';

      sctx.textAlign = 'left';

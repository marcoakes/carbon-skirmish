<!DOCTYPE html>

<meta charset="utf-8">
<title>LEVIATHANS — a capital carrier duel</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#030509;overflow:hidden;height:100%}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
"use strict";
/* =====================================================================
   LEVIATHANS — a capital-class carrier duel  [build v3.0-whole-game]
   (companion piece to STAR BLAZERS: Carbon Skirmish — same DNA:
    a fixed-tick simulation that owns all state, a renderer that only
    reads it, and WebAudio synthesis for every sound. One file, no deps.)

   SYSTEMS INDEX
     [1] constants & helpers
     [2] SIM — carriers, subsystems, power, fighters, squadrons,
               projectiles, point defense, repair bays, enemy admiral AI
     [3] RENDER — procedural carrier hulls, starfield, bloom compositor,
               effects, command-bridge HUD, minimap, overlays
     [4] AUDIO — procedural weapons, alarms, chimes, tension layer
     [5] INPUT & MAIN LOOP
   ===================================================================== */

/* ============================ [1] CORE ============================ */
const TICK = 1 / 60, TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const wrapA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const dist = (a, b, c, d) => Math.hypot(c - a, d - b);

/* ============================ [2] SIM ============================ */
const Sim = (() => {

  // ---- subsystem layout (hull-local, nose = +x, carrier ~460m long) ----
  const SUBS = {
    hangar:    { x: -40, y: 40, r: 46, label: 'HANGAR' },
    engines:   { x: -195, y: 0, r: 44, label: 'ENGINES' },
    shieldgen: { x: 55, y: -40, r: 40, label: 'SHIELD GEN' },
    weapons:   { x: 130, y: 26, r: 40, label: 'WEAPONS' }
  };
  const SUBKEYS = ['hangar', 'engines', 'shieldgen', 'weapons'];
  const PD_MOUNTS = [[150, 50], [150, -50], [0, 58], [0, -58], [-125, 52], [-125, -52]];
  const BROADSIDE = [[110, 46], [40, 48], [-40, 48], [-115, 46]];   // mirrored for port

  // ---- squadron doctrine: three wings, three jobs ----
  const ROLES = {
    INT: { hp: 70, spd: 375, turn: 4.6, dmgF: 8, dmgC: 3, range: 180, rof: 0.32, ammo: 34, label: 'INTERCEPTOR' },
    BMB: { hp: 92, spd: 275, turn: 3.1, dmgF: 2, dmgC: 15, range: 290, rof: 0.85, ammo: 18, label: 'BOMBER' },
    DEF: { hp: 108, spd: 330, turn: 4.0, dmgF: 6, dmgC: 2, range: 200, rof: 0.42, ammo: 30, label: 'DEFENDER' }
  };
  const SQUADS = ['INT', 'BMB', 'DEF'];

  const DIFF = [
    { name: 'ENSIGN', think: 1.3, repair: 0.8, aggro: 0.8, pdAcc: 0.38, dmgMul: 0.6, ehull: 2500 },
    { name: 'CAPTAIN', think: 0.8, repair: 1.0, aggro: 1.0, pdAcc: 0.52, dmgMul: 0.85, ehull: 2900 },
    { name: 'ADMIRAL', think: 0.45, repair: 1.25, aggro: 1.25, pdAcc: 0.58, dmgMul: 0.95, ehull: 3200 }
  ];

  let S = null, nextId = 1;
  const R = Math.random;   // no replay requirement here: honest dice

  // ---- service record: rank, best score, career totals (localStorage) ----
  const RANKS = [['CADET', 0], ['ENSIGN', 2000], ['LIEUTENANT', 4000], ['CAPTAIN', 6500],
                 ['COMMODORE', 10000], ['ADMIRAL OF THE FLEET', 15000]];
  const rankFor = best => { let r = RANKS[0][0]; for (const [n, th] of RANKS) if (best >= th) r = n; return r; };
  const nextRank = best => { for (const [n, th] of RANKS) if (best < th) return [n, th]; return null; };
  function loadRecord() {
    try {
      const r = JSON.parse(localStorage.getItem('lev_record') || 'null');
      if (r && typeof r.battles === 'number') return r;
    } catch (e) {}
    return { battles: 0, wins: [0, 0, 0], best: 0, saved: 0, lost: 0, perfect: 0 };
  }

  function makeCarrier(side, x, y, face) {
    const c = {
      side, x, y, vx: 0, vy: 0, face, radius: 150,
      hull: 2200, hullMax: 2200, shield: 800, shieldMax: 800,
      subs: {}, power: { shields: 2, weapons: 2, engines: 2, hangar: 2 },
      broadCd: 0, spinalCd: 0, launchCd: 0, missCd: 0, pdCds: PD_MOUNTS.map(() => R() * 0.5),
      wmg: { charge: 0, charging: false, cd: 0 },
      targetSub: 'hangar',   // which enemy subsystem the capital guns hammer
      dead: false
    };
    for (const k of SUBKEYS) c.subs[k] = { hp: 350, max: 350, disabled: false };
    return c;
  }

  function makeFighter(side, squad, slot) {
    const role = ROLES[SQUADS[squad]];
    const hp = Math.round(role.hp * (side === 'P' ? 1.25 : 1));   // veteran crews
    return {
      id: nextId++, side, squad, slot, role: SQUADS[squad],
      x: 0, y: 0, vx: 0, vy: 0, face: 0,
      hp, max: hp, ammo: role.ammo, ammoMax: role.ammo,
      state: 'docked', order: 'defend', gunCd: R(), runT: 0, tId: 0,
      repairing: false, alive: true
    };
  }

  function reset(diffIdx) {
    nextId = 1;
    const di = clamp(diffIdx == null ? 1 : diffIdx, 0, 2);
    S = {
      mode: 'title', t: 0, diff: DIFF[di], diffIdx: di,
      P: makeCarrier('P', -900, 0, 0),
      E: makeCarrier('E', 900, 0, Math.PI),
      // she has no Wave Motion Gun; she brings armor instead
      _: null,
      fighters: [], projectiles: [], events: [],
      sel: 0,                              // selected squadron (0..2), 3 = all
      aiThinkT: 0, aiRecallT: 0,
      stats: { lost: 0, saved: 0, dealt: 0, taken: 0, sorties: 0 },
      paused: false, winner: null, endT: 0,
      beamT: 0, beamN: 0,
      stage: 1, stage2T: 0,
      score: 0, perfect: false, newBest: false, record: loadRecord(),
      frigates: [],
      tut: 0, tutT: 0, tutFly: 0, tutSkip: false
    };
    S.E.hull = S.E.hullMax = DIFF[di].ehull;
    for (let sq = 0; sq < 3; sq++) {
      for (let sl = 0; sl < 8; sl++) S.fighters.push(makeFighter('P', sq, sl));
      for (let sl = 0; sl < 6; sl++) S.fighters.push(makeFighter('E', sq, sl));
    }
    for (const sd of ['P', 'E']) for (let i = 0; i < 2; i++) S.frigates.push(makeFrigate(sd, i));
    return S;
  }

  const foeOf = c => (c.side === 'P' ? S.E : S.P);
  const carrierOf = f => (f.side === 'P' ? S.P : S.E);
  const evt = e => S.events.push(e);
  const subWorld = (c, k) => {
    const o = SUBS[k], ca = Math.cos(c.face), sa = Math.sin(c.face);
    return { x: c.x + o.x * ca - o.y * sa, y: c.y + o.x * sa + o.y * ca };
  };

  // ---- damage into a carrier: shield, then the nearest subsystem, then hull ----
  function hitCarrier(c, dmg, x, y, forceSub, pierce) {
    if (c.dead) return;
    if (c.side === 'P') { dmg *= S.diff.dmgMul; S.stats.taken += dmg; }
    else S.stats.dealt += dmg;
    if (c.shield > 0) {
      if (pierce) {   // torpedoes detonate on contact: shields only blunt them
        c.shield = Math.max(0, c.shield - dmg * 0.6);
        dmg *= 0.4;
        evt({ type: 'shield', c, ang: Math.atan2(y - c.y, x - c.x) });
      } else {
        c.shield = Math.max(0, c.shield - dmg);
        evt({ type: 'shield', c, ang: Math.atan2(y - c.y, x - c.x) });
        return;
      }
    }
    let key = forceSub || null;
    if (!key) {
      let bd = 85;
      for (const k of SUBKEYS) {
        const p = subWorld(c, k);
        const d = dist(p.x, p.y, x, y);
        if (d < bd) { bd = d; key = k; }
      }
    }
    if (key && !c.subs[key].disabled) {
      const sub = c.subs[key];
      sub.hp = Math.max(0, sub.hp - dmg * (forceSub ? 0.95 : 0.6));
      c.hull -= dmg * 0.6;
      if (sub.hp <= 0 && !sub.disabled) {
        sub.disabled = true;
        evt({ type: 'subdown', side: c.side, key, x, y });
      }
    } else c.hull -= dmg;
    evt({ type: 'armorhit', x, y, big: dmg > 40 });
    if (c.hull <= 0 && !c.dead) {
      c.dead = true; c.hull = 0;
      evt({ type: 'carrierdeath', c });
      if (c.side === 'E' && S.stage === 1 && S.diffIdx >= 1) {
        S.stage = 2; S.stage2T = 18;   // CAPTAIN+: a second contact is inbound — brace
      } else {
        S.winner = c.side === 'E' ? 'P' : 'E';
        S.endT = S.t;
      }
    }
  }

  // ---- power: 8 pips over 4 systems; presets are the tactical dial ----
  const PRESETS = {
    weapons: { shields: 1, weapons: 4, engines: 1, hangar: 2 },
    balanced: { shields: 2, weapons: 2, engines: 2, hangar: 2 },
    shields: { shields: 4, weapons: 1, engines: 1, hangar: 2 },
    hangar: { shields: 2, weapons: 1, engines: 1, hangar: 4 }
  };
  const pw = (c, k) => 0.55 + 0.225 * c.power[k];   // 0 pips ≈ 55%, 4 pips ≈ 145%

  // ---- carrier per-tick upkeep: shields, repairs, PD ----
  function tickCarrier(c) {
    if (c.dead) return;
    const foe = foeOf(c);
    // shields recharge only while the generator lives
    if (!c.subs.shieldgen.disabled)
      c.shield = Math.min(c.shieldMax, c.shield + 5 * pw(c, 'shields') * TICK);
    // disabled subsystems slowly patch back toward action if the hangar crews live
    for (const k of SUBKEYS) {
      const sub = c.subs[k];
      if (sub.hp < sub.max * 0.6 && !c.subs.hangar.disabled)
        sub.hp += 1.3 * pw(c, 'hangar') * (c.side === 'E' ? S.diff.repair : 1) * TICK;
      if (sub.disabled && sub.hp > sub.max * 0.28) {
        sub.disabled = false;
        evt({ type: 'subup', side: c.side, key: k });
      }
    }
    // hangar repair bays: docked fighters healed concurrently (triage = dock order)
    if (!c.subs.hangar.disabled) {
      let bays = c.side === 'P' ? 6 : 5;
      for (const f of S.fighters) {
        if (!f.alive || f.side !== c.side || f.state !== 'docked') continue;
        f.repairing = false;
        if (bays > 0 && (f.hp < f.max || f.ammo < f.ammoMax)) {
          bays--;
          f.repairing = true;
          const rate = 7 * pw(c, 'hangar') * (c.side === 'E' ? S.diff.repair : 1);
          const was = f.hp;
          f.hp = Math.min(f.max, f.hp + rate * TICK);
          f.ammo = Math.min(f.ammoMax, f.ammo + 6 * TICK);
          if (was < f.max && f.hp >= f.max && f.ammo >= f.ammoMax)
            evt({ type: 'ready', side: c.side });
        }
      }
    }
    // point defense: auto-fire at nearby enemy fighters and torpedoes
    if (!c.subs.weapons.disabled) {
      const rate = 0.6 / pw(c, 'weapons');
      const acc = (c.side === 'E' ? S.diff.pdAcc : 0.55) * 0.72 * (0.75 + 0.12 * c.power.weapons);
      for (let m = 0; m < PD_MOUNTS.length; m++) {
        c.pdCds[m] -= TICK;
        if (c.pdCds[m] > 0) continue;
        const ca = Math.cos(c.face), sa = Math.sin(c.face);
        const mx = c.x + PD_MOUNTS[m][0] * ca - PD_MOUNTS[m][1] * sa;
        const my = c.y + PD_MOUNTS[m][0] * sa + PD_MOUNTS[m][1] * ca;
        let tgt = null, bd = 370, isTorp = false;
        for (const pr of S.projectiles)
          if ((pr.kind === 'storp' || pr.kind === 'miss') && pr.side !== c.side) {
            const d = dist(mx, my, pr.x, pr.y);
            if (d < bd) { bd = d; tgt = pr; isTorp = true; }
          }
        if (!tgt) for (const f of S.fighters) {
          if (!f.alive || f.side === c.side || f.state === 'docked') continue;
          const d = dist(mx, my, f.x, f.y);
          if (d < bd) { bd = d; tgt = f; isTorp = false; }
        }
        if (tgt) {
          c.pdCds[m] = rate * (0.7 + R() * 0.6);
          evt({ type: 'pd', x: mx, y: my, tx: tgt.x, ty: tgt.y });
          if (R() < acc) {
            if (isTorp) { tgt.hp -= 8; if (tgt.hp <= 0) { tgt.dead = true; evt({ type: 'boom', x: tgt.x, y: tgt.y, r: 10 }); } }
            else {
              tgt.hp -= 4;
              evt({ type: 'fhit', x: tgt.x, y: tgt.y });
              if (tgt.hp <= 0) killFighter(tgt);
            }
          }
        } else c.pdCds[m] = 0.2;
      }
    }
    c.broadCd -= TICK; c.spinalCd -= TICK; c.launchCd -= TICK; c.missCd -= TICK;
  }

  function killFighter(f) {
    f.alive = false; f.state = 'dead';
    evt({ type: 'boom', x: f.x, y: f.y, r: 12 });
    evt({ type: 'fighterdown', side: f.side });
    if (f.side === 'P') S.stats.lost++;
  }

  // ---- escort frigates: two pickets per side — a screen, not a fleet ----
  function makeFrigate(side, i) {
    const c = side === 'P' ? S.P : S.E;
    const perp = i ? 1 : -1;
    return {
      side, i,
      x: c.x - Math.cos(c.face) * 120 - Math.sin(c.face) * perp * 260,
      y: c.y - Math.sin(c.face) * 120 + Math.cos(c.face) * perp * 260,
      vx: 0, vy: 0, face: c.face, hp: 560, max: 560, radius: 55,
      gunCd: 1 + R() * 2, pdCd: R() * 0.6, dead: false
    };
  }
  function hitFrigate(fr, dmg, x, y) {
    if (fr.dead) return;
    fr.hp -= dmg;
    if (fr.hp <= 0) {
      fr.dead = true;
      evt({ type: 'boom', x: fr.x, y: fr.y, r: 30, big: true });
      evt({ type: 'frigatedown', side: fr.side, x: fr.x, y: fr.y });
    }
  }
  function tickFrigate(fr) {
    if (fr.dead) return;
    const own = fr.side === 'P' ? S.P : S.E, foe = foeOf(own);
    // hold station between our carrier and theirs — a screening picket
    const toFoe = Math.atan2(foe.y - own.y, foe.x - own.x);
    const perp = fr.i ? 1 : -1;
    const stx = own.x + Math.cos(toFoe) * 300 - Math.sin(toFoe) * perp * 190;
    const sty = own.y + Math.sin(toFoe) * 300 + Math.cos(toFoe) * perp * 190;
    const d2 = dist(fr.x, fr.y, stx, sty) || 1;
    const spd = Math.min(165, d2 * 0.8);
    const k = 1 - Math.exp(-1.6 * TICK);
    fr.vx += ((stx - fr.x) / d2 * spd - fr.vx) * k;
    fr.vy += ((sty - fr.y) / d2 * spd - fr.vy) * k;
    fr.x += fr.vx * TICK; fr.y += fr.vy * TICK;
    fr.face = toFoe;
    fr.gunCd -= TICK; fr.pdCd -= TICK;
    // light turret: duel enemy pickets first, then harass their carrier
    if (fr.gunCd <= 0) {
      let tv = null, bfd = 950;
      for (const g2 of S.frigates)
        if (!g2.dead && g2.side !== fr.side) {
          const dd = dist(fr.x, fr.y, g2.x, g2.y);
          if (dd < bfd) { bfd = dd; tv = g2; }
        }
      if (!tv && !foe.dead && dist(fr.x, fr.y, foe.x, foe.y) < 1200) tv = foe;
      if (tv) {
        const tof = dist(fr.x, fr.y, tv.x, tv.y) / 620;
        const a = Math.atan2(tv.y + tv.vy * tof - fr.y, tv.x + tv.vx * tof - fr.x) + (R() - 0.5) * 0.05;
        S.projectiles.push({
          kind: 'shell', side: fr.side, x: fr.x, y: fr.y,
          vx: Math.cos(a) * 620, vy: Math.sin(a) * 620, dmg: 16, life: 2.0
        });
        evt({ type: 'pew', x: fr.x, y: fr.y, side: fr.side });
        fr.gunCd = 3.2 + R() * 0.6;
      }
    }
    // one PD mount: torpedoes first, then fighters
    if (fr.pdCd <= 0) {
      let tgt = null, bd2 = 320, isTorp = false;
      for (const pr of S.projectiles)
        if ((pr.kind === 'storp' || pr.kind === 'miss') && pr.side !== fr.side) {
          const dd = dist(fr.x, fr.y, pr.x, pr.y);
          if (dd < bd2) { bd2 = dd; tgt = pr; isTorp = true; }
        }
      if (!tgt) for (const f of S.fighters) {
        if (!f.alive || f.side === fr.side || f.state === 'docked') continue;
        const dd = dist(fr.x, fr.y, f.x, f.y);
        if (dd < bd2) { bd2 = dd; tgt = f; isTorp = false; }
      }
      if (tgt) {
        fr.pdCd = 0.8 + R() * 0.5;
        evt({ type: 'pd', x: fr.x, y: fr.y, tx: tgt.x, ty: tgt.y });
        if (R() < 0.42) {
          if (isTorp) { tgt.hp -= 8; if (tgt.hp <= 0) { tgt.dead = true; evt({ type: 'boom', x: tgt.x, y: tgt.y, r: 10 }); } }
          else { tgt.hp -= 4; evt({ type: 'fhit', x: tgt.x, y: tgt.y }); if (tgt.hp <= 0) killFighter(tgt); }
        }
      } else fr.pdCd = 0.25;
    }
  }

  // ---- fighter brains: steering + role behaviors ----
  function steer(f, tx, ty, arrive, spdMul) {
    const role = ROLES[f.role];
    let dx = tx - f.x, dy = ty - f.y;
    const d = Math.hypot(dx, dy) || 1;
    let spd = role.spd * (spdMul || 1);
    if (arrive && d < 180) spd *= d / 180;
    dx = dx / d * spd; dy = dy / d * spd;
    const k = 1 - Math.exp(-2.6 * TICK);
    f.vx += (dx - f.vx) * k; f.vy += (dy - f.vy) * k;
    f.x += f.vx * TICK; f.y += f.vy * TICK;
    if (Math.hypot(f.vx, f.vy) > 12) f.face = Math.atan2(f.vy, f.vx);
  }
  function separation(f) {
    let ox = 0, oy = 0;
    for (const g of S.fighters) {
      if (g === f || !g.alive || g.side !== f.side || g.state === 'docked') continue;
      const d = dist(f.x, f.y, g.x, g.y);
      if (d < 34 && d > 0.01) { ox += (f.x - g.x) / d * (34 - d) * 3; oy += (f.y - g.y) / d * (34 - d) * 3; }
    }
    return [ox, oy];
  }
  function fireF(f, tx, ty, dmg, kind) {
    const a = Math.atan2(ty - f.y, tx - f.x) + (R() - 0.5) * 0.09;
    S.projectiles.push({
      kind, side: f.side, x: f.x, y: f.y,
      vx: Math.cos(a) * 880 + f.vx * 0.3, vy: Math.sin(a) * 880 + f.vy * 0.3,
      dmg, life: 0.55
    });
    f.ammo--; f.gunCd = ROLES[f.role].rof;
    evt({ type: 'pew', x: f.x, y: f.y, side: f.side });
  }

  function tickFighter(f) {
    const own = carrierOf(f), foe = foeOf(own);
    const role = ROLES[f.role];
    if (f.state === 'docked') { f.x = own.x; f.y = own.y; return; }
    f.gunCd -= TICK;

    // recall: fly home and survive the trip — the signature tension
    if (f.state === 'recall') {
      const h = subWorld(own, 'hangar');
      steer(f, h.x, h.y, true, 1.15);
      if (dist(f.x, f.y, h.x, h.y) < 52 && !own.subs.hangar.disabled) {
        f.state = 'docked'; f.vx = f.vy = 0;
        evt({ type: 'dock', side: f.side, x: h.x, y: h.y });
        if (f.side === 'P') S.stats.saved++;
      }
      return;
    }
    if (f.state === 'launch') {
      f.runT -= TICK;
      const a = own.face + (f.side === 'P' ? 0.9 : -0.9);
      steer(f, own.x + Math.cos(a) * 420, own.y + Math.sin(a) * 420, false, 1);
      if (f.runT <= 0) f.state = f.order;
      return;
    }

    // wing discipline: crippled or dry birds break off and run for the bays
    if (f.side === 'P' && (f.hp < f.max * 0.45 || f.ammo <= 0) && f.state !== 'recall') {
      f.state = 'recall';
      evt({ type: 'rtb', side: 'P', x: f.x, y: f.y });
      return;
    }

    // out of ammo: no teeth — loiter defensively so the commander notices
    const dry = f.ammo <= 0;
    const [sx, sy] = separation(f);

    // pick a dogfight target — spread the wing's fire so no one gets deleted
    let tgtF = null;
    {
      const bd = f.role === 'BMB' ? 260 : 900, cand = [];
      for (const g of S.fighters) {
        if (!g.alive || g.side === f.side || g.state === 'docked') continue;
        const d = dist(f.x, f.y, g.x, g.y);
        if (d < bd) cand.push([d, g]);
      }
      cand.sort((a, b) => a[0] - b[0]);
      if (cand.length) tgtF = cand[Math.min(f.slot % 3, cand.length - 1)][1];
    }

    let goalX = own.x, goalY = own.y, engaged = false;
    const orderNow = f.order;
    if (orderNow === 'strike' && !dry) {
      // strafe the ordered enemy subsystem: run in, unload, break away
      const tp = subWorld(foe, own.targetSub);
      if (f.runT > 0) {   // breakaway leg
        f.runT -= TICK;
        goalX = f.x + Math.cos(f.face) * 500; goalY = f.y + Math.sin(f.face) * 500;
      } else {
        goalX = tp.x; goalY = tp.y;
        const d = dist(f.x, f.y, tp.x, tp.y);
        if (d < role.range + 60 && f.gunCd <= 0) {
          fireF(f, tp.x, tp.y, role.dmgC, 'cslug');
          if (R() < 0.3) f.runT = 1.6;   // peel off after the pass
        }
      }
      engaged = true;
      // interceptors harass anyone in the way
      if (f.role !== 'BMB' && tgtF && dist(f.x, f.y, tgtF.x, tgtF.y) < role.range && f.gunCd <= 0)
        fireF(f, tgtF.x + tgtF.vx * 0.15, tgtF.y + tgtF.vy * 0.15, role.dmgF, 'fslug');
    } else if (orderNow === 'intercept' && !dry) {
      if (tgtF) {
        goalX = tgtF.x + tgtF.vx * 0.25; goalY = tgtF.y + tgtF.vy * 0.25;
        engaged = true;
        if (dist(f.x, f.y, tgtF.x, tgtF.y) < role.range && f.gunCd <= 0)
          fireF(f, goalX, goalY, role.dmgF, 'fslug');
      } else {
        // nothing on the scope: sweep the space between the carriers, hunting
        const cx2 = (own.x + foe.x) / 2, cy2 = (own.y + foe.y) / 2;
        const ha = (f.id * 2.399) % TAU;
        goalX = cx2 + Math.cos(ha + S.t * 0.25) * 380;
        goalY = cy2 + Math.sin(ha + S.t * 0.25) * 380;
      }
    } else if (orderNow === 'defend') {
      // hold a screen around our own carrier; engage what comes close
      const ha = (f.id * 2.399) % TAU;
      goalX = own.x + Math.cos(ha + S.t * 0.15) * 300;
      goalY = own.y + Math.sin(ha + S.t * 0.15) * 300;
      if (tgtF && dist(own.x, own.y, tgtF.x, tgtF.y) < 720 && !dry) {
        goalX = tgtF.x; goalY = tgtF.y;
        if (dist(f.x, f.y, tgtF.x, tgtF.y) < role.range && f.gunCd <= 0)
          fireF(f, tgtF.x + tgtF.vx * 0.2, tgtF.y + tgtF.vy * 0.2, role.dmgF, 'fslug');
      }
      // defenders also gun down incoming torpedoes
      if (f.role === 'DEF' && !dry && f.gunCd <= 0)
        for (const pr of S.projectiles)
          if (pr.kind === 'storp' && pr.side !== f.side && dist(f.x, f.y, pr.x, pr.y) < role.range) {
            fireF(f, pr.x, pr.y, 6, 'fslug');
            pr.hp -= 6;
            if (pr.hp <= 0) { pr.dead = true; evt({ type: 'boom', x: pr.x, y: pr.y, r: 10 }); }
            break;
          }
    } else {   // regroup (or dry): form on the carrier's flank
      const ha = own.face + Math.PI / 2 + (f.squad - 1) * 0.5;
      goalX = own.x + Math.cos(ha) * 260 + (f.slot - 1.5) * 30;
      goalY = own.y + Math.sin(ha) * 260;
    }
    steer(f, goalX + sx, goalY + sy, !engaged, engaged ? 1 : 0.85);
  }

  // ---- projectiles: fighter slugs, capital shells, spinal torpedoes ----
  function tickProjectiles() {
    for (const pr of S.projectiles) {
      if (pr.dead) continue;
      if (pr.kind === 'storp') {
        const foe = pr.side === 'P' ? S.E : S.P;
        const tp = subWorld(foe, pr.sub);
        const want = Math.atan2(tp.y - pr.y, tp.x - pr.x);
        const cur = Math.atan2(pr.vy, pr.vx);
        const na = cur + clamp(wrapA(want - cur), -1.4 * TICK, 1.4 * TICK);
        pr.vx = Math.cos(na) * 150; pr.vy = Math.sin(na) * 150;
        pr.x += pr.vx * TICK; pr.y += pr.vy * TICK;
        pr.life -= TICK;
        // pickets can body-block a torpedo — that is their job
        for (const fr of S.frigates) {
          if (fr.dead || fr.side === pr.side) continue;
          if (dist(pr.x, pr.y, fr.x, fr.y) < fr.radius + 8) {
            pr.dead = true;
            evt({ type: 'boom', x: pr.x, y: pr.y, r: 26, big: true });
            hitFrigate(fr, pr.dmg, pr.x, pr.y);
            break;
          }
        }
        if (pr.dead) continue;
        if (dist(pr.x, pr.y, tp.x, tp.y) < 46) {
          pr.dead = true;
          evt({ type: 'boom', x: pr.x, y: pr.y, r: 26, big: true });
          hitCarrier(foe, pr.dmg, pr.x, pr.y, pr.sub, true);
        } else if (pr.life <= 0) pr.dead = true;
        continue;
      }
      if (pr.kind === 'miss') {
        // home on a fighter if assigned one still lives, else the enemy carrier's subsystem
        const foe = pr.side === 'P' ? S.E : S.P;
        let tx, ty;
        const ft = pr.tFid ? S.fighters.find(f => f.id === pr.tFid && f.alive && f.state !== 'docked') : null;
        if (ft) { tx = ft.x; ty = ft.y; }
        else { const tp = subWorld(foe, pr.sub); tx = tp.x; ty = tp.y; }
        const want = Math.atan2(ty - pr.y, tx - pr.x);
        const cur = Math.atan2(pr.vy, pr.vx);
        const na = cur + clamp(wrapA(want - cur), -pr.turn * TICK, pr.turn * TICK);
        pr.vx = Math.cos(na) * pr.spd; pr.vy = Math.sin(na) * pr.spd;
        pr.x += pr.vx * TICK; pr.y += pr.vy * TICK;
        pr.life -= TICK;
        if (ft && dist(pr.x, pr.y, ft.x, ft.y) < 16) {
          pr.dead = true; ft.hp -= pr.dmg;
          evt({ type: 'boom', x: pr.x, y: pr.y, r: 8 });
          if (ft.hp <= 0) killFighter(ft);
        } else if (!ft && !foe.dead && dist(pr.x, pr.y, foe.x, foe.y) < foe.radius) {
          pr.dead = true;
          evt({ type: 'boom', x: pr.x, y: pr.y, r: 12 });
          hitCarrier(foe, 32, pr.x, pr.y);
        } else if (pr.life <= 0) pr.dead = true;
        continue;
      }
      pr.x += pr.vx * TICK; pr.y += pr.vy * TICK;
      pr.life -= TICK;
      if (pr.life <= 0) { pr.dead = true; continue; }
      // vs fighters
      if (pr.kind === 'fslug' || pr.kind === 'shell') {
        for (const f of S.fighters) {
          if (!f.alive || f.side === pr.side || f.state === 'docked') continue;
          if (dist(pr.x, pr.y, f.x, f.y) < (pr.kind === 'shell' ? 14 : 13)) {
            pr.dead = true;
            f.hp -= pr.dmg;
            evt({ type: 'fhit', x: f.x, y: f.y });
            if (f.hp <= 0) killFighter(f);
            break;
          }
        }
        if (pr.dead) continue;
      }
      // vs frigates
      for (const fr of S.frigates) {
        if (fr.dead || fr.side === pr.side) continue;
        if (dist(pr.x, pr.y, fr.x, fr.y) < fr.radius) {
          pr.dead = true;
          hitFrigate(fr, pr.dmg, pr.x, pr.y);
          evt({ type: 'armorhit', x: pr.x, y: pr.y, big: pr.dmg > 40 });
          break;
        }
      }
      if (pr.dead) continue;
      // vs carriers
      const foe = pr.side === 'P' ? S.E : S.P;
      if (!foe.dead && dist(pr.x, pr.y, foe.x, foe.y) < foe.radius) {
        pr.dead = true;
        hitCarrier(foe, pr.dmg, pr.x, pr.y);
      }
    }
    S.projectiles = S.projectiles.filter(p => !p.dead);
  }

  // ---- capital fire control ----
  function fireBroadside(c) {
    if (c.dead || c.subs.weapons.disabled || c.broadCd > 0) return false;
    const foe = foeOf(c);
    const toFoe = Math.atan2(foe.y - c.y, foe.x - c.x);
    const rel = wrapA(toFoe - c.face);
    const flank = rel > 0 ? 1 : -1;             // starboard or port battery
    if (Math.abs(Math.abs(rel) - Math.PI / 2) > 0.95) return false;   // must present the flank
    if (dist(c.x, c.y, foe.x, foe.y) > 1500) return false;
    c.broadCd = 2.6 / pw(c, 'weapons') / (c.side === 'E' ? S.diff.aggro : 1);
    const ca = Math.cos(c.face), sa = Math.sin(c.face);
    // gunnery lead: aim where the target will be when the shells arrive
    const tof = dist(c.x, c.y, foe.x, foe.y) / 620;
    const lx = foe.x + foe.vx * tof, ly = foe.y + foe.vy * tof;
    BROADSIDE.forEach((b, i) => {
      const bx = c.x + b[0] * ca - b[1] * flank * sa;
      const by = c.y + b[0] * sa + b[1] * flank * ca;
      const a = Math.atan2(ly - by, lx - bx) + (R() - 0.5) * 0.06;
      S.projectiles.push({
        kind: 'shell', side: c.side, x: bx, y: by,
        vx: Math.cos(a) * 620, vy: Math.sin(a) * 620,
        dmg: 62 * pw(c, 'weapons'), life: 2.8, delay: i * 0.05
      });
      evt({ type: 'broadside', x: bx, y: by, i });
    });
    return true;
  }
  function fireSpinal(c) {
    if (c.dead || c.subs.weapons.disabled || c.spinalCd > 0) return false;
    const foe = foeOf(c);
    if (dist(c.x, c.y, foe.x, foe.y) > 2100) return false;
    c.spinalCd = 16;
    for (let i = 0; i < 3; i++) {
      const a = c.face + (i - 1) * 0.14;
      S.projectiles.push({
        kind: 'storp', side: c.side, sub: c.targetSub, hp: 45,
        x: c.x + Math.cos(c.face) * 240, y: c.y + Math.sin(c.face) * 240,
        vx: Math.cos(a) * 150, vy: Math.sin(a) * 150,
        dmg: 135, life: 22
      });
    }
    evt({ type: 'spinal', x: c.x, y: c.y, side: c.side });
    return true;
  }
  // missile barrage: eight birds — half chase fighters, half slam the targeted subsystem
  function fireMissiles(c) {
    if (c.dead || c.subs.weapons.disabled || c.missCd > 0) return false;
    c.missCd = 12;
    const foes = S.fighters.filter(f => f.alive && f.side !== c.side && f.state !== 'docked');
    for (let i = 0; i < 8; i++) {
      const ft = foes.length ? foes[(i / 2 | 0) % foes.length] : null;
      const a = c.face + (i - 3.5) * 0.24;
      S.projectiles.push({
        kind: 'miss', side: c.side, hp: 10,
        x: c.x + Math.cos(a) * 130, y: c.y + Math.sin(a) * 130,
        vx: Math.cos(a) * 200, vy: Math.sin(a) * 200,
        spd: 340, turn: 3.2, dmg: 28, life: 8,
        tFid: (i % 2 === 0 && ft) ? ft.id : 0, sub: c.targetSub
      });
    }
    evt({ type: 'msl', x: c.x, y: c.y });
    return true;
  }

  function launchSquad(c, sq) {
    if (c.dead || c.subs.hangar.disabled || c.launchCd > 0) return false;
    let any = false;
    for (const f of S.fighters) {
      if (!f.alive || f.side !== c.side || f.squad !== sq || f.state !== 'docked') continue;
      if (f.hp < f.max * 0.35) continue;   // too broken to fly
      const h = subWorld(c, 'hangar');
      f.x = h.x + (R() - 0.5) * 30; f.y = h.y + (R() - 0.5) * 30;
      f.vx = c.vx; f.vy = c.vy;
      f.state = 'launch'; f.runT = 1.1 + f.slot * 0.35;
      f.order = f.role === 'BMB' ? 'strike' : f.role === 'DEF' ? 'defend' : 'intercept';
      any = true;
      if (c.side === 'P') S.stats.sorties++;
    }
    if (any) {
      c.launchCd = 4 / pw(c, 'hangar');
      evt({ type: 'launch', side: c.side });
    }
    return any;
  }
  function orderSquad(c, sq, order) {
    let any = false;
    for (const f of S.fighters) {
      if (!f.alive || f.side !== c.side || f.state === 'docked') continue;
      if (sq !== 3 && f.squad !== sq) continue;
      if (order === 'recall') f.state = 'recall';
      else { f.order = order; if (f.state !== 'launch') f.state = order; }
      any = true;
    }
    if (any && c.side === 'P') evt({ type: 'order', order });
    return any;
  }

  // ---- the enemy admiral: a mirror who actually thinks ----
  const tutHold = () => S.diffIdx === 0 && !S.tutSkip && S.tut < 5 && S.t < 75;
  function tickAI() {
    const E = S.E, P = S.P;
    if (E.dead) return;
    const school = tutHold();   // flight school: the enemy stands off and holds fire
    S.aiThinkT -= TICK;
    // continuous helm: hold a broadside band, kite when hurt, press when ahead
    const d = dist(E.x, E.y, P.x, P.y);
    const hurt = E.hull / E.hullMax, ahead = (E.hull / E.hullMax) - (P.hull / P.hullMax);
    let want = 820;
    if (hurt < 0.4) want = 1250;
    else if (ahead > 0.15) want = 680 / S.diff.aggro;
    if (school) want = 1700;
    const toP = Math.atan2(P.y - E.y, P.x - E.x);
    // face so P sits on our broadside (±90°)
    const flank = wrapA(toP - E.face) > 0 ? 1 : -1;
    const wantFace = toP - flank * Math.PI / 2;
    const spd = 115 * pw(E, 'engines') * (E.subs.engines.disabled ? 0.18 : 1);
    E.face += clamp(wrapA(wantFace - E.face), -0.85 * TICK, 0.85 * TICK);
    const push = d > want + 80 ? 1 : d < want - 80 ? -1 : 0;
    // orbital strafe: transversal is armor — the admiral knows it too
    const tang = 0.55 * S.diff.aggro;
    const k = 1 - Math.exp(-0.85 * TICK);
    E.vx += ((Math.cos(toP) * push - Math.sin(toP) * flank * tang) * spd - E.vx) * k;
    E.vy += ((Math.sin(toP) * push + Math.cos(toP) * flank * tang) * spd - E.vy) * k;
    E.x += E.vx * TICK; E.y += E.vy * TICK;

    if (S.aiThinkT > 0 || school) return;
    S.aiThinkT = S.diff.think;
    // power doctrine
    if (E.shield < E.shieldMax * 0.25) E.power = { ...PRESETS.shields };
    else if (SUBKEYS.some(k => E.subs[k].hp < E.subs[k].max * 0.35)) E.power = { ...PRESETS.hangar };
    else if (P.shield <= 0) E.power = { ...PRESETS.weapons };
    else E.power = { ...PRESETS.balanced };
    // target the player's soft spots: hangar first, always
    E.targetSub = !P.subs.hangar.disabled && P.subs.hangar.hp > 0 ? 'hangar'
      : !P.subs.weapons.disabled ? 'weapons' : 'shieldgen';
    // capital fire
    fireBroadside(E);
    if (E.spinalCd <= 0 && R() < 0.6 * S.diff.aggro) fireSpinal(E);
    if (E.missCd <= 0 && R() < 0.5 * S.diff.aggro) fireMissiles(E);
    // squadron management: launch what's ready, recall the dying
    for (let sq = 0; sq < 3; sq++) {
      const docked = S.fighters.filter(f => f.alive && f.side === 'E' && f.squad === sq && f.state === 'docked');
      const ready = docked.filter(f => f.hp > f.max * 0.5);
      if (ready.length >= (S.diff.aggro > 1 ? 1 : 2)) launchSquad(E, sq);
    }
    // threat response: player fighters near our hull → scramble defense
    const nearThreats = S.fighters.filter(f => f.alive && f.side === 'P' && f.state !== 'docked'
      && dist(f.x, f.y, E.x, E.y) < 700).length;
    if (nearThreats >= 5) orderSquad(E, 3, 'intercept');
    else {
      orderSquad(E, 0, 'intercept');
      orderSquad(E, 1, 'strike');
      // smell blood: when the player is hurt, everything goes on the attack
      orderSquad(E, 2, (P.hull < P.hullMax * 0.35 || R() < 0.4 * S.diff.aggro) ? 'strike' : 'defend');
    }
    // recall the dying and the dry — AFTER orders, so nothing overrides the retreat
    for (const f of S.fighters) {
      if (!f.alive || f.side !== 'E' || f.state === 'docked') continue;
      if (f.hp < f.max * 0.34 || f.ammo <= 0) f.state = 'recall';   // the AI feels each loss
    }
  }

  // ---- master tick ----
  function tick(cmd) {
    if (S.mode === 'title') {
      if (cmd.start != null) { reset(cmd.start); S.mode = 'play'; evt({ type: 'battle' }); }
      return;
    }
    if (S.mode === 'end') {
      if (cmd.restart) { const d = S.diffIdx; reset(d); S.mode = 'play'; evt({ type: 'battle' }); }
      return;
    }
    if (cmd.pause) S.paused = !S.paused;
    if (S.paused) return;
    S.t += TICK;
    const P = S.P;

    // ---- player helm: weighty, momentum, no instant stops ----
    if (!P.dead) {
      const spd = 115 * pw(P, 'engines') * (P.subs.engines.disabled ? 0.18 : 1) * (P.wmg.charging ? 0.45 : 1);
      P.face += (cmd.turn || 0) * 0.95 * pw(P, 'engines') * (P.subs.engines.disabled ? 0.3 : 1) * TICK;
      if (cmd.thrust) {
        const k = 1 - Math.exp(-0.85 * TICK);
        P.vx += (Math.cos(P.face) * spd * cmd.thrust - P.vx) * k;
        P.vy += (Math.sin(P.face) * spd * cmd.thrust - P.vy) * k;
      } else { P.vx *= 1 - 0.15 * TICK; P.vy *= 1 - 0.15 * TICK; }
      P.x += P.vx * TICK; P.y += P.vy * TICK;
      if (cmd.preset) P.power = { ...PRESETS[cmd.preset] };
      if (cmd.cycleSub) {
        const i = SUBKEYS.indexOf(P.targetSub);
        P.targetSub = SUBKEYS[(i + 1) % 4];
        evt({ type: 'blip' });
      }
      if (cmd.setSub) { P.targetSub = cmd.setSub; evt({ type: 'blip' }); }
      if (cmd.sel != null) { S.sel = cmd.sel; evt({ type: 'blip' }); }
      if (cmd.launch) launchSquad(P, S.sel === 3 ? 0 : S.sel) || (S.sel === 3 && (launchSquad(P, 1), launchSquad(P, 2)));
      if (cmd.order) orderSquad(P, S.sel, cmd.order);
      if (cmd.broadside) fireBroadside(P);
      if (cmd.spinal) fireSpinal(P);
      if (cmd.missile) fireMissiles(P);
      // WAVE MOTION GUN: hold [H] — the ship braces, energy gathers, judgment
      const wm = P.wmg;
      wm.cd = Math.max(0, wm.cd - TICK);
      if (cmd.wmgHold && wm.cd <= 0 && !P.subs.weapons.disabled) {
        if (!wm.charging) { wm.charging = true; wm.charge = 0; evt({ type: 'wmgcharge' }); }
        wm.charge += TICK / 2.2;
        if (wm.charge >= 1) {
          wm.charging = false; wm.charge = 0; wm.cd = 45;
          S.beamT = 0.7; S.beamN = 0;
          evt({ type: 'wmgfire', x: P.x, y: P.y });
        }
      } else if (wm.charging) { wm.charging = false; wm.charge = 0; }
    }
    // beam pulses: everything in the corridor answers for its sins
    if (S.beamT > 0) {
      S.beamT -= TICK; S.beamN++;
      const dx = Math.cos(P.face), dy = Math.sin(P.face);
      const ox = P.x + dx * 250, oy = P.y + dy * 250;
      const inCorr = (x, y, w2) => {
        const rx = x - ox, ry = y - oy;
        const along = rx * dx + ry * dy;
        return along > 0 && along < 2600 && Math.abs(rx * dy - ry * dx) < w2;
      };
      for (const f of S.fighters)
        if (f.alive && f.side === 'E' && f.state !== 'docked' && inCorr(f.x, f.y, 95)) killFighter(f);
      for (const pr of S.projectiles)
        if (pr.side === 'E' && inCorr(pr.x, pr.y, 95)) pr.dead = true;
      if (S.beamN % 6 === 0) {
        for (const fr of S.frigates)
          if (!fr.dead && fr.side === 'E' && inCorr(fr.x, fr.y, 135)) hitFrigate(fr, 90, fr.x, fr.y);
        if (!S.E.dead && inCorr(S.E.x, S.E.y, 95 + S.E.radius))
          hitCarrier(S.E, 72, S.E.x, S.E.y, P.targetSub, true);
      }
    }

    // second contact: a fresh hostile warps in after the first kill (CAPTAIN+)
    if (S.stage === 2 && S.stage2T > 0) {
      S.stage2T -= TICK;
      // damage control parties: the breather patches the hull, up to a point
      if (!P.dead) P.hull = Math.min(P.hullMax * 0.8, P.hull + 45 * TICK);
      if (S.stage2T <= 0) {
        const ang = Math.atan2(S.E.y - P.y, S.E.x - P.x) + (R() - 0.5) * 1.4;
        S.E = makeCarrier('E', P.x + Math.cos(ang) * 2300, P.y + Math.sin(ang) * 2300, ang + Math.PI);
        S.E.hull = S.E.hullMax = Math.round(S.diff.ehull * 0.75);
        // this admiral is angrier than the last one — truly furious on ADMIRAL
        const anger = S.diffIdx === 2 ? 0.25 : 0.1;
        S.diff = { ...S.diff, aggro: S.diff.aggro + anger, think: Math.max(0.4, S.diff.think - 0.1) };
        for (const f of S.fighters) if (f.side === 'E') { f.alive = false; f.state = 'dead'; }
        for (const fr of S.frigates) if (fr.side === 'E') fr.dead = true;
        // she warped in hot: a skeleton escort, not a full deck
        const wingN = S.diffIdx === 2 ? 5 : 4, frigN = S.diffIdx === 2 ? 2 : 1;
        for (let sq = 0; sq < 3; sq++) for (let sl = 0; sl < wingN; sl++) S.fighters.push(makeFighter('E', sq, sl));
        for (let i = 0; i < frigN; i++) S.frigates.push(makeFrigate('E', i));
        evt({ type: 'stage2', x: S.E.x, y: S.E.y });
      }
    }

    tickCarrier(P);
    tickCarrier(S.E);
    tickAI();
    for (const f of S.fighters) if (f.alive) tickFighter(f);
    for (const fr of S.frigates) tickFrigate(fr);
    tickProjectiles();

    // flight school: gated beats on ENSIGN — advance only when the player does the thing
    if (cmd.skipTut) S.tutSkip = true;
    if (S.tut === 0) {
      S.tutFly += (Math.abs(cmd.thrust || 0) + Math.abs(cmd.turn || 0)) * TICK;
      if (S.tutFly > 1.4) S.tut = 1;
    }
    else if (S.tut === 1 && S.stats.sorties > 0) S.tut = 2;
    else if (S.tut === 2 && S.fighters.some(f => f.side === 'P' && f.state === 'strike')) S.tut = 3;
    else if (S.tut === 3 && S.fighters.some(f => f.side === 'P' && f.state === 'recall')) S.tut = 4;
    else if (S.tut === 4 && cmd.preset) S.tut = 5;

    if (S.winner && S.mode === 'play') {
      S.mode = 'end';
      const st = S.stats, won = S.winner === 'P';
      const raw = st.dealt * 0.35 - st.taken * 0.3 + st.saved * 80 - st.lost * 120 + (won ? 1000 : 0);
      S.score = Math.max(0, Math.round(raw * [0.7, 1, 1.4][S.diffIdx]));
      S.perfect = won && st.lost === 0;

    // engine wake

    const spd = Math.hypot(c.vx, c.vy);
    if (spd > 4 && !c.subs.engines.disabled) {
      const ex = x - Math.cos(c.face) * dw * 0.5, ey = y - Math.sin(c.face) * dw * 0.5;
      glow(ex, ey, 60 * scale + 20, c.side === 'P' ? GLOW.blue : GLOW.orange, 0.5);
    }
    glow(x, y, dw * 0.7, c.side === 'P' ? GLOW.blue : GLOW.red, 0.07);
    // shield bubble
    if (c.shield > 0) {
      g.strokeStyle = c.side === 'P' ? `rgba(120,200,255,${0.1 + 0.25 * c.shield / c.shieldMax})` : `rgba(255,120,120,${0.1 + 0.25 * c.shield / c.shieldMax})`;
      g.lineWidth = 1.5;
      g.beginPath(); g.ellipse(x, y, c.radius * 1.55 * scale, c.radius * 1.05 * scale, c.face, 0, TAU); g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
    g.save(); g.translate(x, y); g.rotate(c.face);
    g.drawImage(img, -dw / 2, -dh / 2, dw, dh);
    g.restore();
    // subsystem state: fires on wounded modules, dark on dead ones
    for (const k of Sim.SUBKEYS) {
      const sub = c.subs[k], p = Sim.subWorld(c, k);
      const sx = w2x(p.x), sy = w2y(p.y);
      if (sub.disabled) {
        g.fillStyle = 'rgba(8,8,10,0.75)';
        g.beginPath(); g.arc(sx, sy, Sim.SUBS[k].r * scale, 0, TAU); g.fill();
        if (Math.random() < 0.3) parts.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 0.5) * 30, life: 1, max: 1, k: 'smoke', sz: 5 });
      } else if (sub.hp < sub.max * 0.5) {
        g.globalCompositeOperation = 'lighter';
        glow(sx, sy, Sim.SUBS[k].r * scale * (0.8 + 0.2 * Math.sin(now * 13)), GLOW.orange, 0.5 * (1 - sub.hp / sub.max));
        g.globalCompositeOperation = 'source-over';
        if (Math.random() < 0.12) parts.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 25, vy: (Math.random() - 0.5) * 25, life: 0.8, max: 0.8, k: 'smoke', sz: 4 });
      }
    }
  }

  function drawFrigate(fr) {
    const x = w2x(fr.x), y = w2y(fr.y);
    const dw = Math.max(46, 150 * scale * 1.6), dh = dw * 64 / 180;
    g.globalCompositeOperation = 'lighter';
    glow(x - Math.cos(fr.face) * dw * 0.45, y - Math.sin(fr.face) * dw * 0.45,
         10 * scale * 3 + 4, fr.side === 'P' ? GLOW.blue : GLOW.orange, 0.5);
    g.globalCompositeOperation = 'source-over';
    g.save(); g.translate(x, y); g.rotate(fr.face);
    g.drawImage(FRG[fr.side], -dw / 2, -dh / 2, dw, dh);
    g.restore();
    if (fr.hp < fr.max) {
      g.fillStyle = 'rgba(20,26,34,0.8)'; g.fillRect(x - 16, y - dh * 0.7 - 6, 32, 3);
      g.fillStyle = fr.hp / fr.max > 0.5 ? '#7fe0a0' : fr.hp / fr.max > 0.25 ? '#ffd070' : '#ff6a5a';
      g.fillRect(x - 16, y - dh * 0.7 - 6, 32 * fr.hp / fr.max, 3);
    }
  }

  function drawFighter(f, S) {
    const x = w2x(f.x), y = w2y(f.y);
    const s = Math.max(4.5, 11 * scale * 3);
    g.globalCompositeOperation = 'lighter';
    // trail
    g.strokeStyle = f.side === 'P' ? 'rgba(110,190,255,0.35)' : 'rgba(255,110,80,0.35)';
    g.lineWidth = Math.max(1, 2 * scale * 2);
    g.beginPath(); g.moveTo(x, y);
    g.lineTo(x - f.vx * 0.06 * scale, y - f.vy * 0.06 * scale); g.stroke();
    glow(x, y, s * 1.5, f.side === 'P' ? GLOW.blue : GLOW.red, 0.3);
    g.globalCompositeOperation = 'source-over';
    const spr = FSPR[f.role + f.side];
    const ds = Math.max(18, s * 3.4);
    g.save(); g.translate(x, y); g.rotate(f.face);
    g.drawImage(spr, -ds / 2, -ds / 2, ds, ds);
    g.restore();
    // your selected wing carries a marker ring
    if (S && f.side === 'P' && (S.sel === 3 || S.sel === f.squad)) {
      g.strokeStyle = 'rgba(160,215,255,0.35)'; g.lineWidth = 1.2;
      g.beginPath(); g.arc(x, y, ds * 0.72, 0, TAU); g.stroke();
    }
    // hp sliver
    if (f.hp < f.max) {
      g.fillStyle = 'rgba(20,26,34,0.8)'; g.fillRect(x - 9, y - s - 6, 18, 3);
      g.fillStyle = f.hp / f.max > 0.5 ? '#7fe0a0' : f.hp / f.max > 0.25 ? '#ffd070' : '#ff6a5a';
      g.fillRect(x - 9, y - s - 6, 18 * f.hp / f.max, 3);
    }
  }

  /* ---- HUD helpers ---- */
  function bar(x, y, w, h, frac, col, back) {
    sctx.fillStyle = back || 'rgba(18,24,32,0.85)'; sctx.fillRect(x, y, w, h);
    sctx.fillStyle = col; sctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
  }
  const rects = { subs: [], squads: [] };
  let wingPrev = ['', '', ''], ticker = [], stage2Flash = 0;

  function drawHUD(S, now) {
    sctx.textBaseline = 'alphabetic';
    const P = S.P, E = S.E;
    // ===== my ship (bottom-left) =====
    const bx = 14, by = H - 168, bw = 250;
    sctx.fillStyle = 'rgba(6,10,16,0.78)'; sctx.fillRect(bx, by, bw, 156);
    sctx.strokeStyle = 'rgba(110,160,210,0.4)'; sctx.strokeRect(bx + 0.5, by + 0.5, bw, 156);
    sctx.fillStyle = '#9fc0dd'; sctx.font = 'bold 11px Consolas,monospace'; sctx.textAlign = 'left';
    sctx.fillText('LEVIATHAN  —  your command', bx + 8, by + 15);
    bar(bx + 8, by + 22, bw - 16, 9, P.shield / P.shieldMax, 'rgba(95,170,255,0.9)');
    bar(bx + 8, by + 33, bw - 16, 9, P.hull / P.hullMax, P.hull / P.hullMax > 0.35 ? 'rgba(140,220,170,0.9)' : 'rgba(255,110,90,0.95)');
    sctx.fillStyle = '#7d93a8'; sctx.font = '9px Consolas,monospace';
    sctx.fillText('SHD ' + Math.round(P.shield) + '   HULL ' + Math.round(P.hull), bx + 8, by + 52);
    // subsystems
    Sim.SUBKEYS.forEach((k, i) => {
      const sub = P.subs[k], yy = by + 60 + i * 13;
      sctx.fillStyle = sub.disabled ? '#ff6a5a' : '#9fb4c8'; sctx.font = '9px Consolas,monospace';
      sctx.fillText(Sim.SUBS[k].label + (sub.disabled ? ' OFFLINE' : ''), bx + 8, yy + 8);
      bar(bx + 118, yy, bw - 126, 8, sub.hp / sub.max, sub.disabled ? 'rgba(255,90,70,0.8)' : 'rgba(190,210,120,0.85)');
    });
    // power pips
    sctx.fillStyle = '#9fc0dd'; sctx.font = 'bold 9px Consolas,monospace';
    sctx.fillText('POWER  [Z]wpn [X]bal [C]shd [V]hgr', bx + 8, by + 122);
    ['shields', 'weapons', 'engines', 'hangar'].forEach((k, i) => {
      sctx.fillStyle = '#7d93a8'; sctx.font = '8px Consolas,monospace';
      sctx.fillText(k.slice(0, 3).toUpperCase(), bx + 8 + i * 60, by + 136);
      for (let p2 = 0; p2 < 4; p2++) {
        sctx.fillStyle = p2 < P.power[k] ? '#ffd070' : 'rgba(60,66,74,0.8)';
        sctx.fillRect(bx + 8 + i * 60 + 24 + p2 * 7, by + 129, 5, 8);
      }
    });
    // weapons readout
    const canB = Sim.canBroadside(P) && !P.subs.weapons.disabled;
    sctx.font = 'bold 9px Consolas,monospace';
    sctx.fillStyle = P.broadCd <= 0 && canB ? '#8fe0a8' : '#7d93a8';
    sctx.fillText('[LMB] BROADSIDE ' + (P.subs.weapons.disabled ? 'OFFLINE' : canB ? (P.broadCd <= 0 ? 'READY' : P.broadCd.toFixed(1)) : 'NO ARC — show your flank'), bx + 8, by + 152);
    // ===== the arsenal (bottom-center): every trigger aims at [TAB] target =====
    sctx.textAlign = 'center';
    const wmgP = P.wmg;
    const wmgTxt = P.subs.weapons.disabled ? 'OFFLINE'
      : wmgP.charging ? 'CHARGING ' + Math.round(wmgP.charge * 100) + '%'
      : wmgP.cd > 0 ? Math.ceil(wmgP.cd) + 's' : 'READY';
    sctx.fillStyle = wmgP.charging ? '#bfe9ff' : wmgP.cd <= 0 ? '#8fe0a8' : '#7d93a8';
    sctx.font = 'bold 10px Consolas,monospace';
    sctx.fillText('[hold H] WAVE MOTION GUN ' + wmgTxt + '   ·   [T/RMB] MISSILES '
      + (P.missCd <= 0 ? 'READY' : Math.ceil(P.missCd) + 's') + '   ·   [SPACE] SPINAL '
      + (P.spinalCd <= 0 ? 'READY' : Math.ceil(P.spinalCd) + 's'), W / 2, H - 24);
    sctx.fillStyle = '#7fe0d8';
    sctx.fillText('target →  ' + Sim.SUBS[P.targetSub].label + '   ([TAB] or click the enemy panel to retarget)', W / 2, H - 10);
    if (wmgP.charging) {
      sctx.save();
      sctx.shadowColor = 'rgba(140,220,255,0.9)'; sctx.shadowBlur = 20;
      sctx.fillStyle = '#dff4ff'; sctx.font = 'bold 22px Consolas,monospace';
      sctx.fillText('WAVE MOTION GUN — ' + Math.round(wmgP.charge * 100) + '%', W / 2, H * 0.28);
      sctx.restore();
    }

    // ===== enemy ship (bottom-right) =====
    const ex = W - 264, ey = H - 128, ew = 250;
    sctx.textAlign = 'left';
    sctx.fillStyle = 'rgba(16,8,10,0.78)'; sctx.fillRect(ex, ey, ew, 116);
    sctx.strokeStyle = 'rgba(220,110,100,0.45)'; sctx.strokeRect(ex + 0.5, ey + 0.5, ew, 116);
    sctx.fillStyle = '#e0a0a0'; sctx.font = 'bold 11px Consolas,monospace';
    sctx.fillText('HOSTILE CARRIER — ' + S.diff.name + (S.stage === 2 ? ' · 2ND CONTACT' : ''), ex + 8, ey + 15);
    bar(ex + 8, ey + 22, ew - 16, 8, E.shield / E.shieldMax, 'rgba(255,130,130,0.85)');
    bar(ex + 8, ey + 32, ew - 16, 8, E.hull / E.hullMax, 'rgba(255,90,70,0.9)');
    rects.subs.length = 0;
    Sim.SUBKEYS.forEach((k, i) => {
      const sub = E.subs[k], yy = ey + 48 + i * 16;
      const sel = P.targetSub === k;
      if (sel) { sctx.fillStyle = 'rgba(120,220,210,0.16)'; sctx.fillRect(ex + 4, yy - 3, ew - 8, 15); }
      sctx.fillStyle = sub.disabled ? '#ff6a5a' : sel ? '#7fe0d8' : '#d8a0a0';
      sctx.font = '9px Consolas,monospace';
      sctx.fillText((sel ? '► ' : '  ') + Sim.SUBS[k].label + (sub.disabled ? ' OFFLINE' : ''), ex + 8, yy + 8);
      bar(ex + 122, yy, ew - 130, 8, sub.hp / sub.max, 'rgba(255,140,110,0.85)');
      rects.subs.push({ x: ex + 4, y: yy - 3, w: ew - 8, h: 15, key: k });
    });

    // ===== squadron roster (top-left) =====
    rects.squads.length = 0;
    const sy0 = 12;
    sctx.fillStyle = 'rgba(6,10,16,0.78)'; sctx.fillRect(14, sy0, 316, 118);
    sctx.strokeStyle = 'rgba(110,160,210,0.4)'; sctx.strokeRect(14.5, sy0 + 0.5, 316, 118);
    sctx.fillStyle = '#9fc0dd'; sctx.font = 'bold 10px Consolas,monospace';
    sctx.fillText('WINGS  [1-3] select · [4] all · [L]aunch', 22, sy0 + 14);
    for (let sq = 0; sq < 3; sq++) {
      const yy = sy0 + 24 + sq * 24;
      const seld = S.sel === sq || S.sel === 3;
      if (seld) { sctx.fillStyle = 'rgba(120,180,240,0.14)'; sctx.fillRect(18, yy - 2, 308, 22); }
      sctx.fillStyle = seld ? '#cfe4f8' : '#8fa4b8'; sctx.font = 'bold 9px Consolas,monospace';
      sctx.fillText((sq + 1) + ' ' + Sim.ROLES[Sim.SQUADS[sq]].label.slice(0, 6), 22, yy + 9);
      rects.squads.push({ x: 18, y: yy - 2, w: 308, h: 22, sq });
      const members = S.fighters.filter(f => f.side === 'P' && f.squad === sq);
      members.forEach((f, i) => {
        const fx = 88 + i * 30;
        if (!f.alive) { sctx.fillStyle = '#5a3a3a'; sctx.fillText('✝', fx, yy + 9); return; }
        bar(fx, yy + 1, 24, 6, f.hp / f.max, f.hp / f.max > 0.5 ? '#7fe0a0' : f.hp / f.max > 0.25 ? '#ffd070' : '#ff6a5a');
        sctx.fillStyle = f.repairing ? '#7fe0d8' : '#7d93a8'; sctx.font = '8px Consolas,monospace';
        sctx.fillText(f.state === 'docked' ? (f.repairing ? Math.round(100 * f.hp / f.max) + '%' : 'BAY') :
          f.state === 'recall' ? 'RTB' : f.state.slice(0, 3).toUpperCase(), fx, yy + 16);
      });
    }
    sctx.fillStyle = 'rgba(140,165,190,0.8)'; sctx.font = '9px Consolas,monospace';
    sctx.fillText('[Q]ntercept  [E]strike  [F]defend  [G]roup  [R]ECALL', 22, sy0 + 111);

    // ===== minimap (top-right) =====
    const mR = 74, mx = W - mR - 18, my = mR + 18;
    sctx.fillStyle = 'rgba(6,10,16,0.75)';
    sctx.beginPath(); sctx.arc(mx, my, mR, 0, TAU); sctx.fill();
    sctx.strokeStyle = 'rgba(110,160,210,0.4)'; sctx.stroke();
    const mput = (wx, wy) => {
      const s2 = mR / 2400;
      let dx = (wx - (P.x + E.x) / 2) * s2, dy = (wy - (P.y + E.y) / 2) * s2;
      const d = Math.hypot(dx, dy); if (d > mR - 5) { dx *= (mR - 5) / d; dy *= (mR - 5) / d; }
      return [mx + dx, my + dy];
    };
    for (const f of S.fighters) {
      if (!f.alive || f.state === 'docked') continue;
      const [fx2, fy2] = mput(f.x, f.y);
      sctx.fillStyle = f.side === 'P' ? '#7fb8ff' : '#ff8a70';
      sctx.fillRect(fx2 - 1, fy2 - 1, 2, 2);
    }
    for (const fr of S.frigates) {
      if (fr.dead) continue;
      const [fx2, fy2] = mput(fr.x, fr.y);
      sctx.fillStyle = fr.side === 'P' ? '#9fd0ff' : '#ff9a80';
      sctx.fillRect(fx2 - 2, fy2 - 1.5, 4, 3);
    }
    for (const c of [P, E]) {
      const [cx2, cy2] = mput(c.x, c.y);
      sctx.save(); sctx.translate(cx2, cy2); sctx.rotate(c.face);
      sctx.fillStyle = c.side === 'P' ? '#bfe0ff' : '#ff6a5a';
      sctx.fillRect(-6, -2.5, 12, 5);
      sctx.restore();
    }

    // ===== wing tags over each airborne cluster + status ticker =====
    for (let sq = 0; sq < 3; sq++) {
      const mem = S.fighters.filter(f => f.alive && f.side === 'P' && f.squad === sq);
      const air = mem.filter(f => f.state !== 'docked');
      if (air.length) {
        const cx3 = air.reduce((a, f) => a + f.x, 0) / air.length;
        const cy3 = air.reduce((a, f) => a + f.y, 0) / air.length;
        const gx = w2x(cx3), gy = w2y(cy3) - 34;
        if (gx > 40 && gx < W - 40 && gy > 20 && gy < H - 20) {
          const col = ['#7fd0ff', '#ffd070', '#7fe0a0'][sq];
          sctx.textAlign = 'center'; sctx.font = 'bold 10px Consolas,monospace';
          sctx.fillStyle = 'rgba(6,10,16,0.7)'; sctx.fillRect(gx - 24, gy - 10, 48, 14);
          if (S.sel === sq || S.sel === 3) { sctx.strokeStyle = col; sctx.strokeRect(gx - 24.5, gy - 10.5, 49, 15); }
          sctx.fillStyle = col;
          sctx.fillText('W' + (sq + 1) + ' ×' + air.length, gx, gy + 1);
        }
      }
      // ticker: announce wing state changes
      let st2 = 'DOCKED';
      if (air.length) st2 = air.every(f => f.state === 'recall') ? 'COMING HOME' : 'ENGAGED';
      else if (mem.length && mem.every(f => f.hp >= f.max && f.ammo >= f.ammoMax)) st2 = 'REARMED & READY';
      if (st2 !== wingPrev[sq]) {
        if (wingPrev[sq] !== '' && st2 !== 'DOCKED') ticker.push({ txt: 'WING ' + (sq + 1) + ' — ' + st2, life: 3 });
        wingPrev[sq] = st2;
      }
    }
    ticker = ticker.filter(m => (m.life -= 0.016) > 0);
    if (ticker.length > 2) ticker.splice(0, ticker.length - 2);
    sctx.textAlign = 'left'; sctx.font = 'bold 10px Consolas,monospace';
    ticker.forEach((m, i) => {
      sctx.fillStyle = 'rgba(159,192,221,' + Math.min(1, m.life).toFixed(2) + ')';
      sctx.fillText('▸ ' + m.txt, 22, 148 + i * 14);
    });
    if (stage2Flash > 0) {
      stage2Flash -= 0.016;
      sctx.save(); sctx.textAlign = 'center';
      sctx.shadowColor = 'rgba(255,80,50,0.9)'; sctx.shadowBlur = 18;
      sctx.fillStyle = '#ffd7cd'; sctx.font = 'bold 26px Consolas,monospace';
      sctx.fillText('SECOND CONTACT — HOSTILE REINFORCEMENT', W / 2, H * 0.3);
      sctx.restore();
    }

    // alerts
    sctx.textAlign = 'center';
    let ay = 90;
    const warn = (t, col) => { if (Math.floor(now * 4) % 2 === 0) { sctx.fillStyle = col; sctx.font = 'bold 14px Consolas,monospace'; sctx.fillText(t, W / 2, ay); } ay += 20; };
    if (P.subs.hangar.disabled) warn('⚠ HANGAR OFFLINE — no launch · no repair', '#ff6a5a');
    if (P.subs.shieldgen.disabled) warn('SHIELD GENERATOR OFFLINE', '#ffb35a');
    if (P.subs.engines.disabled) warn('ENGINES OFFLINE', '#ffb35a');
    if (P.subs.weapons.disabled) warn('WEAPONS ARRAY OFFLINE', '#ffb35a');
    if (P.shield <= 0) warn('SHIELDS DOWN', '#ffd070');

    // flight school (ENSIGN): gated steps while the enemy holds off
    if (S.diffIdx === 0 && !S.tutSkip && S.tut < 5 && S.t < 75) {
      const msgs = [
        'FLIGHT SCHOOL 1/5 — fly the ship: [W] thrust · [A]/[D] turn   (the enemy is holding off)',
        'FLIGHT SCHOOL 2/5 — press [L] to LAUNCH your selected wing from the hangar',
        'FLIGHT SCHOOL 3/5 — select wing [2] and order a STRIKE with [E] — bombers gut subsystems',
        'FLIGHT SCHOOL 4/5 — press [R] to RECALL a wing — docked fighters repair and rearm',
        'FLIGHT SCHOOL 5/5 — set a power preset: [Z] weapons · [X] balanced · [C] shields · [V] hangar'
      ];
      sctx.textAlign = 'center';
      sctx.fillStyle = 'rgba(7,12,20,0.85)';
      const tw = 620; sctx.fillRect(W / 2 - tw / 2, 128, tw, 44);
      sctx.strokeStyle = 'rgba(120,180,255,0.5)'; sctx.strokeRect(W / 2 - tw / 2 + 0.5, 128.5, tw, 44);
      sctx.fillStyle = '#d7e3ef'; sctx.font = '12px Consolas,monospace';
      sctx.fillText(msgs[S.tut], W / 2, 146);
      sctx.fillStyle = '#7d93a8'; sctx.font = '10px Consolas,monospace';
      sctx.fillText('[ESC] skip flight school', W / 2, 164);
    } else if (S.diffIdx === 0 && S.tut === 5 && S.t < 78) {
      sctx.textAlign = 'center';
      sctx.fillStyle = '#8fe0a8'; sctx.font = 'bold 13px Consolas,monospace';
      sctx.fillText('FLIGHT SCHOOL COMPLETE — the enemy is committing. Good hunting, admiral.', W / 2, 147);
    }
  }

  function overlay(S) {
    sctx.textAlign = 'center';
    if (S.mode === 'title') {
      const tt = performance.now() / 1000;
      sctx.fillStyle = 'rgba(2,4,9,0.78)'; sctx.fillRect(0, 0, W, H);
      // hyperspace star streaks drifting past
      sctx.save();
      for (let i = 0; i < 34; i++) {
        const sy2 = (i * 89.7) % H;
        const sx2 = ((i * 137.5 + tt * (14 + (i % 5) * 7)) % (W + 120)) - 60;
        const len = 26 + (i % 4) * 16;
        sctx.strokeStyle = i % 6 ? 'rgba(160,200,255,' + (0.06 + (i % 3) * 0.05) + ')'
                                  : 'rgba(255,150,110,0.12)';
        sctx.lineWidth = i % 7 ? 1 : 1.6;
        sctx.beginPath(); sctx.moveTo(sx2, sy2); sctx.lineTo(sx2 - len, sy2 + len * 0.18); sctx.stroke();
      }
      sctx.restore();
      // the red planet rising at the foot of the screen
      const pcx = W / 2, pcy = H + W * 0.5, prad = W * 0.62;
      const pg = sctx.createRadialGradient(pcx, pcy, prad * 0.55, pcx, pcy, prad);
      pg.addColorStop(0, '#1a0505'); pg.addColorStop(0.82, '#4a120c');
      pg.addColorStop(0.96, '#a03422'); pg.addColorStop(1, '#ff6a40');
      sctx.fillStyle = pg;
      sctx.beginPath(); sctx.arc(pcx, pcy, prad, 0, TAU); sctx.fill();
      sctx.save();                                   // hot rim of atmosphere
      sctx.globalCompositeOperation = 'lighter';
      sctx.strokeStyle = 'rgba(255,120,70,0.5)'; sctx.lineWidth = 3;
      sctx.beginPath(); sctx.arc(pcx, pcy, prad + 2, 0, TAU); sctx.stroke();
      sctx.strokeStyle = 'rgba(255,190,140,0.16)'; sctx.lineWidth = 14;
      sctx.beginPath(); sctx.arc(pcx, pcy, prad + 8, 0, TAU); sctx.stroke();
      sctx.restore();
      // the flagship cruises above the title, engines burning
      sctx.save();
      const shipW = Math.min(430, W * 0.44), shipH = shipW * 230 / 560;
      const shx = W / 2 + Math.sin(tt * 0.22) * 16, shy = H * 0.125 + Math.sin(tt * 0.5) * 5;
      sctx.translate(shx, shy); sctx.rotate(-0.055);
      sctx.globalCompositeOperation = 'lighter';     // exhaust wake first
      const eg = sctx.createLinearGradient(-shipW * 0.5, 0, -shipW * 0.95, 0);

      }

      sctx.fillText('service rank: ' + Sim.rankFor(S.record.best)
        + (nr ? '   ·   next: ' + nr[0] + ' at ' + nr[1] : '   ·   highest rank held'), W / 2, ey2); ey2 += 26;

    const P = S.P, E = S.E;
    // camera frames both titans
    const d = dist(P.x, P.y, E.x, E.y);
    scale += (clamp(Math.min(W, H) / (d + 950), 0.16, 0.5) - scale) * (1 - Math.exp(-2 * dt));
    cam.x += ((P.x * 0.58 + E.x * 0.42) - cam.x) * (1 - Math.exp(-2.5 * dt));
    cam.y += ((P.y * 0.58 + E.y * 0.42) - cam.y) * (1 - Math.exp(-2.5 * dt));
    if (shake > 0.3) { cam.x += (Math.random() - 0.5) * shake / scale * 0.3; cam.y += (Math.random() - 0.5) * shake / scale * 0.3; shake *= Math.exp(-5 * dt); }

      const dxb = Math.cos(P.face), dyb = Math.sin(P.face);
      const x2 = x1 + dxb * 2600 * scale, y2 = y1 + dyb * 2600 * scale;
      for (const [w2, col] of [[190, `rgba(90,170,255,${(0.2 * env).toFixed(2)})`],
                               [90, `rgba(150,215,255,${(0.45 * env).toFixed(2)})`],
                               [34, `rgba(230,248,255,${(0.9 * env).toFixed(2)})`]]) {
        g.strokeStyle = col; g.lineWidth = Math.max(1, w2 * scale);
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();

        if (Math.random() < 0.5) parts.push({ x: pr.x, y: pr.y, vx: 0, vy: 0, life: 0.4, max: 0.4, k: 'smoke', sz: 3 });
      } else if (pr.kind === 'miss') {
        glow(x, y, 9, pr.side === 'P' ? GLOW.blue : GLOW.red, 0.85);
        g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, 1.6, 0, TAU); g.fill();
        if (Math.random() < 0.35) parts.push({ x: pr.x, y: pr.y, vx: 0, vy: 0, life: 0.3, max: 0.3, k: 'smoke', sz: 2 });
      } else {
        const L2 = pr.kind === 'shell' ? 0.03 : 0.014;
        g.strokeStyle = pr.side === 'P'
          ? (pr.kind === 'shell' ? 'rgba(255,220,140,0.95)' : 'rgba(140,210,255,0.9)')
          : (pr.kind === 'shell' ? 'rgba(255,160,90,0.95)' : 'rgba(255,110,90,0.9)');

      p.x += p.vx * dt; p.y += p.vy * dt;
      const a = clamp(p.life / p.max, 0, 1);
      const x = w2x(p.x), y = w2y(p.y);
      if (p.k === 'fire') glow(x, y, p.sz * scale * 6 + 3, a > 0.55 ? GLOW.gold : GLOW.orange, a);

    for (const f2 of flashes) glow(w2x(f2.x), w2y(f2.y), f2.r * scale, f2.img, f2.life / f2.max);

    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    sctx.drawImage(wcv, 0, 0, W, H);
    bactx.clearRect(0, 0, bA.width, bA.height);
    bactx.drawImage(wcv, 0, 0, bA.width, bA.height);
    bbctx.clearRect(0, 0, bB.width, bB.height);
    bbctx.drawImage(bA, 0, 0, bB.width, bB.height);
    sctx.globalCompositeOperation = 'lighter';
    sctx.globalAlpha = 0.28; sctx.drawImage(bA, 0, 0, W, H);
    sctx.globalAlpha = 0.32; sctx.drawImage(bB, 0, 0, W, H);
    sctx.globalAlpha = 1; sctx.globalCompositeOperation = 'source-over';

      const vg = sctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.8);
      vg.addColorStop(0, 'rgba(180,30,20,0)'); vg.addColorStop(1, `rgba(180,30,20,${(redF * 0.8).toFixed(2)})`);

  return {
    render,
    subHit: (x, y) => { for (const r2 of rects.subs) if (x >= r2.x && x <= r2.x + r2.w && y >= r2.y && y <= r2.y + r2.h) return r2.key; return null; },
    squadHit: (x, y) => { for (const r2 of rects.squads) if (x >= r2.x && x <= r2.x + r2.w && y >= r2.y && y <= r2.y + r2.h) return r2.sq; return null; }
  };
})();

        case 'wmgfire': noise(2.2, 0.55, 1400, 40); blip(30, 2.6, 'sine', 0.45, 16); blip(220, 1.2, 'sawtooth', 0.12, 30); break;
        case 'boom': noise(e.big ? 1.6 : 0.5, e.big ? 0.5 : 0.22, 900, 45, pan); if (e.big) blip(60, 1.2, 'sine', 0.3, 24, pan); break;
        case 'shield': blip(900, 0.08, 'triangle', 0.05, 500, pan); break;
        case 'armorhit': noise(0.1, 0.06, 900, 200, pan); break;
        case 'subdown': blip(880, 0.5, 'square', 0.09, 870); blip(660, 0.7, 'square', 0.09, 650); break;   // two-tone alarm
        case 'subup': blip(520, 0.2, 'sine', 0.06, 780); break;
        case 'dock': blip(700, 0.12, 'sine', 0.06, 1050, pan); break;
        case 'rtb': blip(420, 0.14, 'sine', 0.04, 300, pan); break;
        case 'ready': blip(880, 0.1, 'sine', 0.06); blip(1320, 0.16, 'sine', 0.06); break;   // ready chime
        case 'launch': noise(0.5, 0.14, 600, 2600, pan); break;
        case 'order': blip(740, 0.06, 'sine', 0.05, 950); break;
        case 'blip': blip(980, 0.04, 'sine', 0.04); break;
        case 'carrierdeath': noise(2.6, 0.55, 1200, 30, pan); blip(38, 2.6, 'sine', 0.4, 16, pan); break;
        case 'frigatedown': noise(0.9, 0.35, 900, 45, pan); blip(70, 0.9, 'sine', 0.2, 26, pan); break;
        case 'stage2': blip(880, 0.5, 'square', 0.09, 870); blip(660, 0.7, 'square', 0.09, 650); noise(1.4, 0.3, 900, 60); break;
        case 'fighterdown': blip(300, 0.25, 'sawtooth', 0.05, 70, pan); break;
        case 'battle': blip(340, 0.4, 'sine', 0.07, 500); break;
      }
    }
  }
  function update(S) {
    if (!ac || !tension) return;
    const danger = Math.max(1 - S.P.hull / S.P.hullMax, 1 - S.E.hull / S.E.hullMax);
    tension.gain.setTargetAtTime(S.mode === 'play' ? danger * 0.05 : 0, ac.currentTime, 0.8);
  }
  return { ensure, handle, update };
})();

/* ======================= [5] INPUT & MAIN ======================= */
const Input = (() => {
  const held = new Set();
  let launch = false, order = null, sel = null, cycleSub = false, preset = null,
      broadside = false, spinal = false, missile = false, pause = false, restart = false, start = null,
      setSub = null, skipTut = false;
  window.addEventListener('keydown', e => {
    Audio2.ensure();
    if ([' ', 'Tab'].includes(e.key) || e.key.startsWith('Arrow')) e.preventDefault();
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    held.add(k);
    if (k === 'l') launch = true;
    if (k === 'q') order = 'intercept';
    if (k === 'e') order = 'strike';
    if (k === 'f') order = 'defend';
    if (k === 'g') order = 'regroup';
    if (k === 'r') order = 'recall';
    if (k >= '1' && k <= '4') {
      const S = Sim.state();
      if (S.mode === 'title') start = +k - 1 <= 2 ? +k - 1 : null;
      else sel = +k - 1;
    }
    if (k === 'tab') cycleSub = true;
    if (k === 'z') preset = 'weapons';
    if (k === 'x') preset = 'balanced';
    if (k === 'c') preset = 'shields';
    if (k === 'v') preset = 'hangar';
    if (k === ' ') spinal = true;
    if (k === 't') missile = true;
    if (k === 'p') pause = true;
    if (k === 'enter') restart = true;
    if (k === 'escape') skipTut = true;
  });
  window.addEventListener('keyup', e => held.delete(e.key.toLowerCase()));
  window.addEventListener('blur', () => held.clear());
  const cvEl = document.getElementById('cv');
  cvEl.addEventListener('contextmenu', e => e.preventDefault());
  cvEl.addEventListener('pointerdown', e => {
    Audio2.ensure();
    const S = Sim.state();
    if (S.mode === 'title') { start = 1; return; }
    if (S.mode === 'end') { restart = true; return; }
    if (e.button === 2) { missile = true; return; }   // right-click: missile barrage
    const r = cvEl.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const sub = Render.subHit(x, y);
    if (sub) { setSub = sub; return; }
    const sq = Render.squadHit(x, y);
    if (sq != null) { sel = sq; return; }
    broadside = true;
  });
  function consume() {
    const cmd = {
      thrust: (held.has('w') ? 1 : 0) + (held.has('s') ? -0.6 : 0),
      turn: (held.has('a') ? -1 : 0) + (held.has('d') ? 1 : 0),
      launch, order, sel, cycleSub, setSub, preset,
      broadside, spinal, missile, wmgHold: held.has('h'), pause, restart, start, skipTut
    };
    launch = false; order = null; sel = null; cycleSub = false; setSub = null;
    preset = null; broadside = false; spinal = false; missile = false; pause = false; restart = false; start = null; skipTut = false;
    return cmd;
  }
  return { consume };
})();

(function main() {
  let last = performance.now() / 1000, acc = 0;
  function frame() {
    const now = performance.now() / 1000;
    acc += Math.min(now - last, 0.25); last = now;
    const evts = [];
    while (acc >= TICK) {
      Sim.tick(Input.consume());
      evts.push(...Sim.drain());
      acc -= TICK;
    }
    Audio2.handle(evts, Sim.state());
    Audio2.update(Sim.state());
    Render.render(Sim.state(), evts);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
